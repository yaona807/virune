name: Change proposal
description: Propose a feature, design, documentation, or project change
title: "change: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Note any user-facing, compatibility, API, ABI, or language-specification impact if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for related proposals.
          required: true
