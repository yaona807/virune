name: Temporary inline View callback fix

on:
  push:
    branches:
      - fix/frontend-inline-zero-arg-callback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/frontend-inline-zero-arg-callback
      - name: Apply focused fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          emitter_path = Path('packages/compiler/src/codegen/emitter.ts')
          emitter = emitter_path.read_text()
          old = '''\tprivate frontendViewPropertyValue(elementId: number, propertyIndex: number, property: A.ViewProperty, contextName: string): string {
          \tconst raw = this.expression(property.value, contextName);
          \tconst projection = this.#semantic.frontendCallableProjections.find(item => item.viewElementNodeId === elementId && item.propertyIndex === propertyIndex && item.property === property.name);
          \treturn projection === undefined ? raw : this.callableProjection(raw, projection.descriptor);
          \t}'''
          new = '''\tprivate frontendViewPropertyValue(elementId: number, propertyIndex: number, property: A.ViewProperty, contextName: string): string {
          \tconst projection = this.#semantic.frontendCallableProjections.find(item => item.viewElementNodeId === elementId && item.propertyIndex === propertyIndex && item.property === property.name);
          \tconst projectedSyncExternal = property.value.kind === 'LambdaExpression' && projection?.descriptor.async === false;
          \tconst raw = projectedSyncExternal ? this.lambdaExpression(property.value, contextName, true) : this.expression(property.value, contextName);
          \treturn projection === undefined ? raw : this.callableProjection(raw, projection.descriptor);
          \t}'''
          if old not in emitter:
              raise SystemExit('frontendViewPropertyValue target not found')
          emitter_path.write_text(emitter.replace(old, new, 1))

          test_path = Path('packages/js-interop/test/frontend-view-callable-props.test.ts')
          test = test_path.read_text()
          decl_old = 'export const ExternalButton: (props: { onClick: () => void }) => JSX.Element;\n'
          decl_new = decl_old + 'export function setMode(value: string): void;\n'
          if decl_old not in test:
              raise SystemExit('fixture declaration target not found')
          test = test.replace(decl_old, decl_new, 1)

          old_test = '''test('zero-argument inline View callback props reuse the existing callable shim with captures', async () => {
          \tconst result = await compile(`component Page() uses JavaScript {
          \tlet label = "captured"
          \treturn view {
          \t\tbutton(onClick: fn() -> Unit {
          \t\t\tdiscard label
          \t\t\treturn Unit
          \t\t})
          \t}
          }
          `, true);
          \tassert.deepEqual(errors(result), []);
          \tassert.ok(result.output);
          \tassert.match(result.output.code, /<button onClick=\\{\\$viruneProjectCallable\\(/u);
          \tassert.ok(result.output.code.includes('label'));
          \tassert.equal(result.semantic?.frontendCallableProjections.length, 1);
          \tassert.deepEqual(result.semantic?.frontendCallableProjections[0]?.descriptor, {
          \t\tversion: 'virune-callable-shim/v1',
          \t\tparameters: [],
          \t\tresult: 'Unit',
          \t\tasync: false,
          \t\teffects: [],
          \t\tcontextMode: 'root-argument',
          \t});
          });'''
          new_test = '''test('zero-argument inline View callback props reuse the existing callable shim with captures and root context', async () => {
          \tconst result = await compile(`import js { setMode } from "./library.js"
          
          component Page() uses JavaScript {
          \tlet label = "captured"
          \treturn view {
          \t\tbutton(onClick: fn() -> Unit uses JavaScript {
          \t\t\tdiscard setMode(label)
          \t\t\treturn Unit
          \t\t})
          \t}
          }
          `, true);
          \tassert.deepEqual(errors(result), []);
          \tassert.ok(result.output);
          \tconst code = result.output.code;
          \tassert.match(code, /<button onClick=\\{\\$viruneProjectCallable\\(\\(\\(\\$lambdaCtx\\d+ = rootTaskContext\\(\\)\\) => \\{/u);
          \tassert.match(code, /\\$viruneProjectCallable\\(\\(\\(\\$lambdaCtx\\d+ = rootTaskContext\\(\\)\\) => \\{[\\s\\S]*?setMode\\(label\\)[\\s\\S]*?\\}\\),/u);
          \tassert.equal(result.semantic?.frontendCallableProjections.length, 1);
          \tassert.deepEqual(result.semantic?.frontendCallableProjections[0]?.descriptor, {
          \t\tversion: 'virune-callable-shim/v1',
          \t\tparameters: [],
          \t\tresult: 'Unit',
          \t\tasync: false,
          \t\teffects: ['JavaScript'],
          \t\tcontextMode: 'root-argument',
          \t});
          });'''
          if old_test not in test:
              raise SystemExit('inline callback regression target not found')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
          git diff --check
      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/compiler/src/codegen/emitter.ts packages/js-interop/test/frontend-view-callable-props.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(frontend): preserve inline callback root context"
          git push origin HEAD:fix/frontend-inline-zero-arg-callback
