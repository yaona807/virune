name: Temporary issue 598 patch

on:
  push:
    branches:
      - fix/598-structural-foreign-argument-any

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/598-structural-foreign-argument-any
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact source patch
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run focused regression
        run: node --test packages/js-interop/dist/test/usage-resolution-structural-any-safety.test.js packages/js-interop/dist/test/usage-resolution-foreign-argument-projection.test.js
      - name: Commit validated patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-apply-598.yml
          git add packages/js-interop/src/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(interop): preserve safe structural External arguments"
          git push origin HEAD:fix/598-structural-foreign-argument-any
