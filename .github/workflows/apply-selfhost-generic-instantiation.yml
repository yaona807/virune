name: Apply corrected self-host generic instantiation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/selfhost-generic-instantiation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-generic-instantiation
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Extract and repair implementation script
        run: |
          mkdir -p .cache
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const workflow = await readFile('.github/workflows/implement-selfhost-generic-instantiation.yml', 'utf8');
          const startMarker = "          node --input-type=module - <<'NODE'\n";
          const endMarker = "\n          NODE\n      - run: npm ci";
          const start = workflow.indexOf(startMarker);
          const end = workflow.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error(`Implementation script region is missing: ${start}/${end}`);
          let script = workflow.slice(start + startMarker.length, end)
            .split('\n')
            .map(line => line.startsWith('          ') ? line.slice(10) : line)
            .join('\n');

          const helperMarker = 'fn internInstantiation(stateValue: SemanticState, typeId: Int) -> SemanticState {';
          const helpers = `fn optionalTypeId(value: Int?) -> Int {
          \treturn match value {
          \t\tSome(item) => item
          \t\tNone => -1
          \t}
          }

          fn hasInstantiation(value: SemanticType) -> Bool {
          \treturn match value.instantiationId {
          \t\tSome(_) => true
          \t\tNone => false
          \t}
          }

          `;
          if (!script.includes(helperMarker)) throw new Error('Generic helper insertion marker is missing');
          script = script.replace(helperMarker, helpers + helperMarker);

          const targetStart = script.indexOf('\\tmatch declaration.targetType {');
          const targetEndMarker = '\\treturn state\n}\n\nfn containsOpenType';
          const targetEnd = script.indexOf(targetEndMarker, targetStart);
          if (targetStart < 0 || targetEnd < 0) throw new Error(`Generic target region is missing: ${targetStart}/${targetEnd}`);
          const targetReplacement = `\\tlet sourceTarget = optionalTypeId(declaration.targetType)
          \\tif sourceTarget >= 0 {
          \\t\\tlet resolved = substituteType(sourceTarget, declaration, typeValue.arguments, state)
          \\t\\tstate = resolved.state
          \\t\\tstate = setInstantiationTarget(state, instantiationId, resolved.id)
          \\t\\tlet target = typeAt(state.types, resolved.id)
          \\t\\tif declaration.kind == "alias" && target.declarationId == Some(declaration.id) && intListsEqual(target.arguments, typeValue.arguments) {
          \\t\\t\\tstate = addDiagnostic(state, semanticArenaDiagnostic(
          \\t\\t\\t\\t"L2042",
          \\t\\t\\t\\t"Recursive generic alias " + declaration.name,
          \\t\\t\\t\\ttypeValue.span,
          \\t\\t\\t\\tSome("Break the alias cycle with a concrete data declaration."),
          \\t\\t\\t))
          \\t\\t}
          \\t}
          \\treturn state
          }

          fn containsOpenType`;
          script = script.slice(0, targetStart) + targetReplacement + script.slice(targetEnd + targetEndMarker.length);
          script = script.replace('value.kind != "named" || value.instantiationId != None', 'value.kind != "named" || hasInstantiation(value)');
          await writeFile('.cache/apply-generic-instantiation.mjs', script);
          NODE
      - name: Apply generic implementation
        run: node .cache/apply-generic-instantiation.mjs
      - run: npm ci
      - run: npm run build
      - name: Run generic instantiation Host tests
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-generic-instantiation.test.js
      - name: Run data type semantic regression
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-semantic-data-types.test.js
      - name: Run complete Stage 0 tests
        run: node packages/cli/dist/src/main.js test selfhost/mvp
      - run: git diff --check
      - name: Commit implementation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfhost/mvp/src/frontend-semantic-model.virune selfhost/mvp/src/frontend-semantic.virune packages/compiler/test/selfhost-generic-instantiation.test.ts docs/self-hosting-differential.md docs/self-hosting-differential_ja.md
          git commit -m "compiler(selfhost): add generic instantiation table"
          git push origin HEAD:agent/selfhost-generic-instantiation
