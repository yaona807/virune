name: Strict clean bootstrap reproducibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-clean-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify self-host impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selfhost_required: ${{ steps.changes.outputs.selfhost_required_gate_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/classify-ci-changes.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node scripts/classify-ci-changes.mjs --force-full
          fi

  baseline:
    name: Self-host release core / baseline environment
    needs: classify
    if: needs.classify.outputs.selfhost_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Pre-provision dependency cache
        run: npm ci --ignore-scripts
      - name: Pre-provision and verify fixed Seed
        run: node scripts/verify-selfhost-seed.mjs --json
      - name: Execute fail-closed self-host release core
        run: >-
          node scripts/run-selfhost-release-gate.mjs
          --output=.cache/selfhost-required-shadow/release-core.json
          --json
      - name: Stage baseline clean-bootstrap evidence
        run: |
          mkdir -p .cache/selfhost-required-shadow/baseline
          cp .cache/selfhost/clean-bootstrap.json .cache/selfhost-required-shadow/baseline/clean-bootstrap-baseline.json
      - name: Upload baseline release-core evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selfhost-required-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .cache/selfhost-required-shadow/release-core.json
            .cache/selfhost-required-shadow/baseline/clean-bootstrap-baseline.json
          if-no-files-found: error
          retention-days: 30

  perturbed:
    name: Clean bootstrap / perturbed environment
    needs: classify
    if: needs.classify.outputs.selfhost_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Pre-provision dependency cache
        run: npm ci --ignore-scripts
      - name: Pre-provision and verify fixed Seed
        run: node scripts/verify-selfhost-seed.mjs --json
      - name: Execute clean bootstrap in perturbed environment
        run: >-
          node scripts/run-selfhost-clean-bootstrap.mjs
          --environment-profile=perturbed
          --working-root=.cache/selfhost/clean-bootstrap-perturbed
          --output=.cache/selfhost-required-shadow/clean-bootstrap-perturbed.json
          --json
      - name: Upload perturbed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selfhost-required-perturbed-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/selfhost-required-shadow/clean-bootstrap-perturbed.json
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare independent runner artifacts
    needs:
      - classify
      - baseline
      - perturbed
    if: always() && needs.classify.outputs.selfhost_required == 'true' && needs.baseline.result == 'success' && needs.perturbed.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download baseline evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfhost-required-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/selfhost-required-shadow/inputs/baseline
      - name: Download perturbed evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfhost-required-perturbed-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/selfhost-required-shadow/inputs/perturbed
      - name: Compare exact bootstrap artifacts across independent runners
        run: >-
          node scripts/compare-selfhost-clean-bootstrap-evidence.mjs
          --baseline=.cache/selfhost-required-shadow/inputs/baseline/baseline/clean-bootstrap-baseline.json
          --perturbed=.cache/selfhost-required-shadow/inputs/perturbed/clean-bootstrap-perturbed.json
          --output=.cache/selfhost-required-shadow/cross-runner.json
          --json
      - name: Upload cross-runner reproducibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selfhost-required-cross-runner-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/selfhost-required-shadow/cross-runner.json
          if-no-files-found: error
          retention-days: 30

  required-selfhost-gate:
    name: Required self-host gate
    needs:
      - classify
      - baseline
      - perturbed
      - compare
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Run Required Shadow unit tests
        run: node --test scripts/run-selfhost-required-gate.test.mjs
      - name: Validate classifier output
        shell: bash
        env:
          SELFHOST_REQUIRED: ${{ needs.classify.outputs.selfhost_required }}
        run: |
          case "$SELFHOST_REQUIRED" in
            true|false) ;;
            *)
              echo "Invalid selfhost_required output: $SELFHOST_REQUIRED" >&2
              exit 1
              ;;
          esac
      - name: Record upstream evidence failure
        if: needs.classify.outputs.selfhost_required == 'true' && (needs.baseline.result != 'success' || needs.perturbed.result != 'success' || needs.compare.result != 'success')
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BASELINE_RESULT: ${{ needs.baseline.result }}
          PERTURBED_RESULT: ${{ needs.perturbed.result }}
          COMPARE_RESULT: ${{ needs.compare.result }}
        run: >-
          node scripts/run-selfhost-required-gate.mjs
          --expected-commit="$EXPECTED_COMMIT"
          --upstream-failure="baseline=$BASELINE_RESULT,perturbed=$PERTURBED_RESULT,compare=$COMPARE_RESULT"
          --json
      - name: Download baseline release-core evidence
        if: needs.classify.outputs.selfhost_required == 'true' && needs.baseline.result == 'success' && needs.perturbed.result == 'success' && needs.compare.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfhost-required-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/selfhost-required-shadow/summary/baseline
      - name: Download cross-runner evidence
        if: needs.classify.outputs.selfhost_required == 'true' && needs.baseline.result == 'success' && needs.perturbed.result == 'success' && needs.compare.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfhost-required-cross-runner-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/selfhost-required-shadow/summary/cross-runner
      - name: Validate Required Shadow evidence
        if: needs.classify.outputs.selfhost_required == 'true' && needs.baseline.result == 'success' && needs.perturbed.result == 'success' && needs.compare.result == 'success'
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/run-selfhost-required-gate.mjs
          --expected-commit="$EXPECTED_COMMIT"
          --release-core=.cache/selfhost-required-shadow/summary/baseline/release-core.json
          --cross-runner=.cache/selfhost-required-shadow/summary/cross-runner/cross-runner.json
          --json
      - name: Record explicit omission for unrelated changes
        if: needs.classify.outputs.selfhost_required == 'false'
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/run-selfhost-required-gate.mjs
          --expected-commit="$EXPECTED_COMMIT"
          --not-required
          --json
      - name: Upload Required Shadow summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selfhost-required-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/selfhost-required-shadow/required-gate.json
          if-no-files-found: warn
          retention-days: 30
