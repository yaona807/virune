name: Self-host list pattern compatibility repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/selfhost-match-pattern-ast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-match-pattern-ast
      - name: Replace multiline if expression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('selfhost/mvp/src/frontend-pattern-parser.virune')
          text = path.read_text()
          marker = 'fn parseListPattern(stateValue: PatternState, tokens: List<FrontendToken>, depth: Int) -> ParsedPattern {'
          helper = '''fn parseListPatternItem(\n\tstate: PatternState,\n\ttokens: List<FrontendToken>,\n\tdepth: Int,\n) -> ParsedPattern {\n\tif isText(state, tokens, "...") {\n\t\treturn parseRestPattern(state, tokens)\n\t}\n\treturn parsePatternDepth(state, tokens, depth + 1)\n}\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('list pattern marker not found')
              text = text.replace(marker, helper + marker, 1)
          old = '''\t\tlet item = if isText(state, tokens, "...")\n\t\t\tthen parseRestPattern(state, tokens)\n\t\t\telse parsePatternDepth(state, tokens, depth + 1)'''
          new = '\t\tlet item = parseListPatternItem(state, tokens, depth)'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('multiline if expression not found')
          path.write_text(text)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/frontend-pattern-parser.virune
          git commit -m "fix(selfhost): make list pattern parser Stage 0 compatible"
          git push origin HEAD:agent/selfhost-match-pattern-ast
