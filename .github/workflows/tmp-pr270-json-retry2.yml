name: Temporary PR 270 Json retry 2

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/selfhost-try-rebuild-run-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Patch direct Json call and nested type parsing
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/selfhost-generic-json-type-arguments'
          expected_head='8ed1b0e825fbbd67ce339ff6da18dbf2e4be1590'
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/$branch)" = "$expected_head"
          git checkout -B "$branch" "origin/$branch"
          python - <<'PY'
          from pathlib import Path

          path = Path('selfhost/mvp/src/checker.virune')
          source = path.read_text()

          call_anchor = 'fn checkCall(node: MvpExpression, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {\n\tlet constructorName = standardConstructorName(node.text)\n'
          call_replacement = 'fn checkCall(node: MvpExpression, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {\n\tif node.text == "Json.parse" {\n\t\treturn checkKnownCall(node, Signature {\n\t\t\tname: "Json.parse",\n\t\t\tparameters: [MvpType.StringType],\n\t\t\treturnType: MvpType.NamedType("Result<JsonValue,List<JsonError>>"),\n\t\t\tisPublic: false,\n\t\t\tspan: node.span,\n\t\t}, context, expressions)\n\t}\n\tlet constructorName = standardConstructorName(node.text)\n'
          if source.count(call_anchor) != 1:
              raise RuntimeError(f'expected one checkCall anchor, found {source.count(call_anchor)}')
          source = source.replace(call_anchor, call_replacement, 1)

          list_anchor = 'if String.contains(compact, "List<") {'
          list_replacement = 'if String.length(compact) >= 5 && String.slice(compact, 0, Some(5)) == "List<" {'
          if source.count(list_anchor) != 1:
              raise RuntimeError(f'expected one List detector, found {source.count(list_anchor)}')
          path.write_text(source.replace(list_anchor, list_replacement, 1))
          PY
          test "$(git diff --name-only)" = 'selfhost/mvp/src/checker.virune'
          git diff --check
          npm ci
          npm run build
          node --test --test-timeout=900000 packages/compiler/dist/test/selfhost-generic-json-type-arguments.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/checker.virune
          git commit -m 'fix(selfhost): check Json calls with nested type names'
          git push --force-with-lease=refs/heads/$branch:"$expected_head" origin HEAD:$branch
