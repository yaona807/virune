name: Temporary View Repetition Withdrawal

on:
  push:
    branches: [fix/frontend-withdraw-view-repetition]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Remove the falsified View repetition surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def remove_between(path, start, end):
              text = read(path)
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f'{path}: marker count mismatch for {start!r} / {end!r}')
              left, rest = text.split(start, 1)
              _, right = rest.split(end, 1)
              write(path, left + end + right)

          replace_once(
              'packages/compiler/src/ast/nodes.ts',
              'export type ViewChild = ViewElement | ViewConditional | ViewRepetition | ViewTextChild | ViewExpressionChild | ViewChildrenSlot;',
              'export type ViewChild = ViewElement | ViewConditional | ViewTextChild | ViewExpressionChild | ViewChildrenSlot;',
          )
          remove_between(
              'packages/compiler/src/ast/nodes.ts',
              'export interface ViewRepetitionEvidence {',
              'export interface ViewTextChild',
          )

          replace_once(
              'packages/compiler/src/syntax/parser.ts',
              "\t\t\t\t{ GATE: () => this.LA(1).tokenType === KwFor, ALT: () => $.SUBRULE($.viewRepetition) },\n",
              '',
          )
          remove_between(
              'packages/compiler/src/syntax/parser.ts',
              "\n\t\t$.RULE('viewRepetition', () => {",
              "\n\t\t$.RULE('viewTextChild', () => {",
          )
          replace_once(
              'packages/compiler/src/syntax/cst-to-ast.ts',
              "['viewElement', 'viewConditional', 'viewRepetition', 'viewTextChild', 'viewExpressionChild', 'viewChildrenSlot']",
              "['viewElement', 'viewConditional', 'viewTextChild', 'viewExpressionChild', 'viewChildrenSlot']",
          )
          remove_between(
              'packages/compiler/src/syntax/cst-to-ast.ts',
              '\n\tpublic viewRepetition(ctx: Ctx): A.ViewRepetition {',
              '\n\tpublic viewTextChild',
          )

          replace_once(
              'packages/compiler/src/checker/checker.ts',
              '\tprivate checkViewBlock(block: A.ViewBlock, scope: Scope, insideRepetition = false): void {',
              '\tprivate checkViewBlock(block: A.ViewBlock, scope: Scope): void {',
          )
          replace_once(
              'packages/compiler/src/checker/checker.ts',
              "\t\t\t\tcase 'ViewChildrenSlot':\n\t\t\t\t\tif (insideRepetition) {\n\t\t\t\t\t\tthis.diagnostics.error('L4311', 'children cannot appear inside View repetition', child.span);\n\t\t\t\t\t\tbreak;\n\t\t\t\t\t}\n",
              "\t\t\t\tcase 'ViewChildrenSlot':\n",
          )
          for old, new in [
              ('this.checkViewBlock(child.children, scope, insideRepetition)', 'this.checkViewBlock(child.children, scope)'),
              ('this.checkViewBlock(child.thenBlock, scope, insideRepetition)', 'this.checkViewBlock(child.thenBlock, scope)'),
              ('this.checkViewBlock(child.elseBranch, scope, insideRepetition)', 'this.checkViewBlock(child.elseBranch, scope)'),
              ('this.checkViewConditional(child.elseBranch, scope, insideRepetition)', 'this.checkViewConditional(child.elseBranch, scope)'),
              ('\t\t\t\tcase \'ViewRepetition\': this.checkViewRepetition(child, scope); break;\n', ''),
              ('\tprivate checkViewConditional(conditional: A.ViewConditional, scope: Scope, insideRepetition = false): void {', '\tprivate checkViewConditional(conditional: A.ViewConditional, scope: Scope): void {'),
              ('this.checkViewBlock(conditional.thenBlock, scope, insideRepetition)', 'this.checkViewBlock(conditional.thenBlock, scope)'),
              ('this.checkViewBlock(conditional.elseBranch, scope, insideRepetition)', 'this.checkViewBlock(conditional.elseBranch, scope)'),
              ('this.checkViewConditional(conditional.elseBranch, scope, insideRepetition)', 'this.checkViewConditional(conditional.elseBranch, scope)'),
          ]:
              replace_once('packages/compiler/src/checker/checker.ts', old, new)
          remove_between(
              'packages/compiler/src/checker/checker.ts',
              '\n\tprivate checkViewRepetition(repetition: A.ViewRepetition, scope: Scope): void {',
              '\n\tprivate checkContextualAggregate',
          )

          replace_once(
              'packages/compiler/src/hir/lower.ts',
              "\t\tcase 'ViewRepetition':\n\t\t\treturn { ...child, source: lowerExpression(child.source), body: lowerViewBlock(child.body) };\n",
              '',
          )
          replace_once(
              'packages/compiler/src/codegen/emitter.ts',
              "\t\t\tcase 'ViewRepetition': return `{${this.viewRepetitionExpression(child, contextName)}}`;\n",
              '',
          )
          remove_between(
              'packages/compiler/src/codegen/emitter.ts',
              '\n\tprivate checkedViewRepetitionEvidence(repetition: A.ViewRepetition): A.ViewRepetitionEvidence {',
              '\n\tprivate nativeChildrenSlotExpression',
          )

          replace_once(
              'packages/compiler/src/interop/jsx-view-validation.ts',
              '\treadonly repetitionValues: Map<number, string>;\n',
              '',
          )
          replace_once(
              'packages/compiler/src/interop/jsx-view-validation.ts',
              'const context: RenderContext = { semantic, types, externalTagRoots, usedNativeProofs: new Set(), repetitionValues: new Map() };',
              'const context: RenderContext = { semantic, types, externalTagRoots, usedNativeProofs: new Set() };',
          )
          replace_once(
              'packages/compiler/src/interop/jsx-view-validation.ts',
              "\t\tcase 'ViewRepetition': return renderViewRepetition(child, context);\n",
              '',
          )
          replace_once(
              'packages/compiler/src/interop/jsx-view-validation.ts',
              "\t\tcase 'ViewRepetition': {\n\t\t\tconst value = renderViewRepetition(child, context);\n\t\t\treturn value === undefined ? undefined : `{${value}}`;\n\t\t}\n",
              '',
          )
          remove_between(
              'packages/compiler/src/interop/jsx-view-validation.ts',
              '\nfunction renderViewRepetition(repetition: A.ViewRepetition, context: RenderContext): string | undefined {',
              '\nfunction renderViewElement',
          )
          replace_once(
              'packages/compiler/src/interop/jsx-view-validation.ts',
              "\tif (expression.kind === 'IdentifierExpression' && expression.symbolId !== undefined) {\n\t\tconst repetitionValue = context.repetitionValues.get(expression.symbolId);\n\t\tif (repetitionValue !== undefined) return repetitionValue;\n\t}\n",
              '',
          )

          replace_once(
              'packages/compiler/src/interop/types.ts',
              '\t/** Declared element resolver for a proven Array or ReadonlyArray repetition source. */\n\tresolveArrayElement?(type: ForeignTypeRef): ForeignTypeSnapshot | undefined;\n',
              '',
          )
          replace_once(
              'packages/js-interop/src/index.ts',
              "\t\t\t['resolveArrayElement', (reference: ForeignTypeRef) => this.resolveArrayElementInternal(reference)],\n",
              '',
          )
          remove_between(
              'packages/js-interop/src/index.ts',
              '\n\tprivate resolveArrayElementInternal(reference: ForeignTypeRef): ForeignTypeSnapshot | undefined {',
              '\n\tprivate resolveIndexUsageInternal',
          )
          Path('packages/js-interop/test/view-repetition-array-evidence.test.ts').unlink()

          replace_once(
              'packages/formatter/src/index.ts',
              "\t\tcase 'ViewRepetition': return `${prefix}for ${child.itemName}${child.indexName === undefined ? '' : `, ${child.indexName}`} in ${printExpression(child.source)} ${printViewBlock(child.body, indent)}`;\n",
              '',
          )

          remove_between(
              'selfhost/mvp/src/frontend-parser-core.virune',
              '\nfn parseViewRepetition(stateValue: CoreState, tokens: List<FrontendToken>) -> CoreParsedNode {',
              '\nfn parseViewChild',
          )
          replace_once(
              'selfhost/mvp/src/frontend-parser-core.virune',
              '\tif text == "for" {\n\t\treturn parseViewRepetition(state, tokens)\n\t}\n',
              '',
          )

          path = 'selfhost/mvp/src/frontend-parser.spec.virune'
          text = read(path)
          old = text
          text = text.replace(r'\t\t\tfor item in items {\n\t\t\t\tUi.Row(value: item)\n\t\t\t}\n', '')
          text = text.replace(r'\t\t\tfor item, index in items {\n\t\t\t\tUi.Row(value: item, position: index)\n\t\t\t}\n', '')
          text = text.replace('\n\texpect(String.contains(result, "\\\"kind\\\":\\\"ViewRepetition\\\""))', '')
          text = text.replace('\n\texpect(String.contains(result, "\\\"text\\\":\\\"item,index\\\""))', '')
          if text == old:
              raise SystemExit('selfhost parser spec: repetition fixture did not change')
          anchor = '\n\texpect(String.contains(result, "\\\"kind\\\":\\\"ViewChildrenSlot\\\""))\n'
          if text.count(anchor) != 1:
              raise SystemExit('selfhost parser spec: expected ViewChildrenSlot anchor once')
          rejection = '\texpect(String.contains(encoded("component Repetition(items: List<String>) uses JavaScript {\\n\\treturn view {\\n\\t\\tfor item in items {\\n\\t\\t\\tUi.Row(value: item)\\n\\t\\t}\\n\\t}\\n}\\n"), "\\\"accepted\\\":false"))\n'
          text = text.replace(anchor, anchor + rejection, 1)
          write(path, text)

          replace_once('spec/grammar.ebnf', '                        | ViewRepetition\n', '')
          replace_once('spec/grammar.ebnf', 'ViewRepetition          = "for" Identifier [ "," Identifier ] "in" Expression ViewBlock ;\n', '')

          for path, containment_old, containment_new, framework_old, framework_new in [
              (
                  'spec/frontend.md',
                  '- a View-local declarative conditional or repetition body;',
                  '- a View-local declarative conditional branch;',
                  'The component/View grammar does not select a framework. Virune Core does not define framework-name enums, package-name heuristics, a Virune frontend VDOM/runtime, universal state/effect/router APIs, property-vocabulary rewrites, or framework-specific JSX lowering.',
                  'The component/View grammar does not select a framework. Virune Core does not define framework-name enums, package-name heuristics, a Virune frontend VDOM/runtime, universal state/effect/router APIs, property-vocabulary rewrites, framework-specific JSX lowering, or framework-neutral list reconciliation. Virune 1.0 does not define a View-local repetition construct; list rendering that depends on identity or lifecycle remains owned by downstream framework/library APIs consumed through ordinary External JSX/API interoperability.',
              ),
              (
                  'spec/frontend_ja.md',
                  '- View-local declarative conditionalまたはrepetition body',
                  '- View-local declarative conditional branch',
                  'component/View grammarはframeworkを選択しない。Virune Coreはframework-name enum、package-name heuristic、Virune frontend VDOM/runtime、universal state/effect/router API、property vocabulary rewrite、framework固有JSX loweringを定義しない。',
                  'component/View grammarはframeworkを選択しない。Virune Coreはframework-name enum、package-name heuristic、Virune frontend VDOM/runtime、universal state/effect/router API、property vocabulary rewrite、framework固有JSX lowering、framework-neutralなlist reconciliationを定義しない。Virune 1.0はView-local repetition constructを定義しない。identityやlifecycleに依存するlist renderingはdownstream framework/library APIが所有し、通常のExternal JSX/API interoperabilityを通じて利用する。',
              ),
          ]:
              replace_once(path, containment_old, containment_new)
              text = read(path)
              start = '## `[frontend.view-repetition]` Declarative View repetition'
              end = '## `[frontend.framework-neutral]` Framework-neutral core'
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f'{path}: repetition/framework section marker mismatch')
              left, rest = text.split(start, 1)
              _, right = rest.split(end, 1)
              text = left.rstrip() + '\n\n' + end + right
              write(path, text)
              replace_once(path, framework_old, framework_new)

          path = 'packages/compiler/test/frontend-component-view.test.ts'
          text = read(path)
          marker = '// @virune-rule {"id":"frontend.view-repetition"'
          if text.count(marker) != 1:
              raise SystemExit('frontend component test: repetition test marker mismatch')
          replacement = '\n'.join([
              '',
              '',
              "test('View-local for is not part of the frontend authoring syntax', () => {",
              '\tassert.ok(parseErrorCodes(`component ListView() uses JavaScript {',
              '\tlet items = [1, 2]',
              '\treturn view {',
              '\t\tfor item in items {',
              '\t\t\tspan(value: item)',
              '\t\t}',
              '\t}',
              '}',
              '`).length > 0);',
              '});',
              '',
              "test('ordinary imperative for remains valid after View repetition withdrawal', () => {",
              '\tconst result = compileSource(source(`fn sum(items: List<Int>) -> Int {',
              '\tlet mut total = 0',
              '\tfor item in items {',
              '\t\ttotal = total + item',
              '\t}',
              '\treturn total',
              '}',
              '`), { emit: false });',
              "\tassert.deepEqual(result.diagnostics.filter(item => item.severity === 'error'), []);",
              '});',
              '',
          ])
          write(path, text.split(marker, 1)[0].rstrip() + replacement)
          PY

          if git grep -n -E 'ViewRepetition|viewRepetition|resolveArrayElement|repetitionValues|frontend\.view-repetition|L4311' -- ':!*.lock'; then
            echo 'stale View repetition implementation artifact remains' >&2
            exit 1
          fi
          git diff --check

      - name: Install dependencies
        run: npm ci
      - name: TypeScript build/check
        run: npm run check
      - name: Focused frontend compiler regression
        run: node --test packages/compiler/dist/test/frontend-component-view.test.js
      - name: Specification and compatibility checks
        run: |
          npm run spec:check
          npm run api:check
          npm run abi:check
      - name: Self-host frontend/parser parity
        run: |
          npm run selfhost:mvp:check
          npm run selfhost:parser:parity
      - name: Core tests
        run: npm run test:core:built
      - name: Commit validated source change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-withdraw-view-repetition.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(frontend): withdraw generic View repetition'
          git push origin HEAD:fix/frontend-withdraw-view-repetition
