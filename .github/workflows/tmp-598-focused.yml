name: Temporary issue 598 focused regression

on:
  push:
    branches:
      - fix/598-vnode-structural-any

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Apply bounded structural safety fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/js-interop/src/index.ts')
          text = path.read_text()
          old = 'budget: { remaining: number } = { remaining: 512 },'
          new = 'budget: { remaining: number } = { remaining: 1024 },'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          rm packages/js-interop/test/tmp-598-dom-path.test.ts
          rm .github/workflows/tmp-598-focused.yml
      - run: npm run build
      - run: node --test packages/js-interop/dist/test/usage-resolution-structural-any-safety.test.js
      - run: npm --workspace @virune/js-interop test
      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/js-interop/src/index.ts packages/js-interop/test/usage-resolution-structural-any-safety.test.ts packages/js-interop/test/tmp-598-dom-path.test.ts .github/workflows/tmp-598-focused.yml
          git commit -m 'fix(interop): extend structural any-safety budget'
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = 'packages/js-interop/src/index.ts'
          test "${files[1]}" = 'packages/js-interop/test/usage-resolution-structural-any-safety.test.ts'
          git diff --check origin/main...HEAD
          git push origin HEAD:fix/598-vnode-structural-any
