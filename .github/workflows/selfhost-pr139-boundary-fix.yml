name: Selfhost PR139 boundary fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/selfhost-pr139-boundary-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfhost/collection-type-operations
      - name: Keep imported semantic types private
        shell: python
        run: |
          from pathlib import Path

          path = Path('selfhost/mvp/src/frontend-type-operations.virune')
          content = path.read_text()
          replacements = [
              ('pub record FrontendTypeRelationRequest', 'record FrontendTypeRelationRequest'),
              ('pub record FrontendCommonTypeRequest', 'record FrontendCommonTypeRequest'),
              ('pub record FrontendTypeOperationsRequest', 'record FrontendTypeOperationsRequest'),
              ('pub record SemanticTypeRelationResult', 'record SemanticTypeRelationResult'),
              ('pub record SemanticTypeTraits', 'record SemanticTypeTraits'),
              ('pub record SemanticCommonTypeResult', 'record SemanticCommonTypeResult'),
              ('pub record FrontendTypeOperationsResult', 'record FrontendTypeOperationsResult'),
              ('pub fn checkFrontendTypeOperations(request:', 'fn checkFrontendTypeOperations(request:'),
          ]
          for before, after in replacements:
              count = content.count(before)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {before!r}, found {count}')
              content = content.replace(before, after, 1)
          path.write_text(content)
          Path('.github/workflows/selfhost-pr139-boundary-fix.yml').unlink()
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/frontend-type-operations.virune .github/workflows/selfhost-pr139-boundary-fix.yml
          git commit -m "compiler(selfhost): keep type operation model private"
          git push origin HEAD:selfhost/collection-type-operations
