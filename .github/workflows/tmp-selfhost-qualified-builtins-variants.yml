name: Temporary selfhost core timeout promotion

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: tmp-selfhost-core-timeout-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-and-promote:
    if: github.event.pull_request.number == 277 && github.head_ref == 'feat/selfhost-qualified-builtins-variants'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/selfhost-qualified-builtins-variants
          fetch-depth: 0

      - name: Verify isolated transport commits
        shell: bash
        run: |
          set -euo pipefail
          source_head=51891e8ea85246ee2eeaebe44e28523348b4be6b
          expected_ci_blob=026ad48857d330c49c0053533bce604bb7a5c0de
          git cat-file -e "${source_head}^{commit}"
          git merge-base --is-ancestor "$source_head" HEAD
          test "$(git hash-object .github/workflows/ci.yml)" = "$expected_ci_blob"
          mapfile -t changed < <(git diff --name-only "$source_head"..HEAD | sort)
          expected=(.github/workflows/tmp-selfhost-qualified-builtins-variants.yml)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected transport diff:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

      - name: Raise Core job timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('  verify:\n')
          end = text.index('\n  quality:\n', start)
          block = text[start:end]
          if block.count('timeout-minutes: 25') != 1:
              raise SystemExit(f'expected one verify timeout, found {block.count("timeout-minutes: 25")}')
          updated = block.replace('timeout-minutes: 25', 'timeout-minutes: 35', 1)
          path.write_text(text[:start] + updated + text[end:], encoding='utf-8')
          PY

      - name: Remove transport workflow and verify final diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-selfhost-qualified-builtins-variants.yml
          source_head=51891e8ea85246ee2eeaebe44e28523348b4be6b
          mapfile -t changed < <(git diff --name-only "$source_head" | sort)
          expected=(.github/workflows/ci.yml)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected final diff:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          grep -A6 -B1 '^  verify:' .github/workflows/ci.yml
          git diff --check

      - name: Commit clean timeout change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name yaona807
          git config user.email 72598968+yaona807@users.noreply.github.com
          git add -A
          git commit -m "ci: allow selfhost inventory to complete"
          git push origin HEAD:feat/selfhost-qualified-builtins-variants
