name: Self-host pattern indentation repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/selfhost-match-pattern-ast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-match-pattern-ast
      - name: Normalize inserted Virune indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('selfhost/mvp/src/frontend-parser-core.virune')
          text = path.read_text()
          start = text.index('fn loadPattern(')
          end = text.index('fn parsePrimary(', start)
          segment = text[start:end]
          repaired = segment.replace('\\t', '\t')
          if repaired == segment:
              raise SystemExit(0)
          path.write_text(text[:start] + repaired + text[end:])
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/frontend-parser-core.virune
          git commit -m "fix(selfhost): normalize pattern parser indentation"
          git push origin HEAD:agent/selfhost-match-pattern-ast
