name: VSIX smoke

on:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/vsix-smoke.yml'
      - 'packages/vscode/**'
      - 'packages/language-server/**'
      - 'scripts/build-vscode.mjs'
      - 'scripts/package-vscode.mjs'
      - 'scripts/vsix-smoke*.mjs'
      - 'scripts/vsix-smoke-harness/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: vsix-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Linux clean install
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:vscode
      - name: Run installed VSIX smoke
        run: xvfb-run -a npm run smoke:vscode-release
      - name: Upload VS Code logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix-smoke-linux
          path: .cache/vsix-smoke
          if-no-files-found: ignore
          retention-days: 30
