name: VSIX smoke

on:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vsix-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify VSIX impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      formal_required: ${{ steps.changes.outputs.formal_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/classify-formal-ci-changes.mjs --lane vsix --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node scripts/classify-formal-ci-changes.mjs --lane vsix --force-full
          fi

  smoke:
    name: Linux clean install
    needs: classify
    if: needs.classify.outputs.formal_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:vscode
      - name: Run installed VSIX smoke
        run: xvfb-run -a npm run smoke:vscode-release
      - name: Upload VS Code logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix-smoke-linux
          path: .cache/vsix-smoke
          if-no-files-found: ignore
          retention-days: 30

  required-vsix-gate:
    name: Required VSIX gate
    needs: [classify, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Require reviewed VSIX disposition
        env:
          FORMAL_REQUIRED: ${{ needs.classify.outputs.formal_required }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: >-
          node scripts/verify-formal-ci-gate.mjs
          --kind optional
          --label vsix
          --required "$FORMAL_REQUIRED"
          --classify-result "$CLASSIFY_RESULT"
          --upstream-result "$SMOKE_RESULT"
