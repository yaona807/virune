name: Frontend callable props branch edit

on:
  push:
    branches:
      - feat/frontend-view-callable-props
    paths:
      - .github/workflows/frontend-callable-props-branch-edit.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'yaona807/virune'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/frontend-view-callable-props
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Apply exact source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1))

          checker = 'packages/compiler/src/checker/checker.ts'
          replace_once(checker,
          '''interface PendingObjectUsage {
          \treadonly point: SemanticPoint;
          \treadonly usage: import('../interop/types.js').ForeignUsage;
          }

          export interface SemanticModel {''',
          '''interface PendingObjectUsage {
          \treadonly point: SemanticPoint;
          \treadonly usage: import('../interop/types.js').ForeignUsage;
          }

          export interface FrontendCallableProjectionEvidence {
          \treadonly viewElementNodeId: number;
          \treadonly propertyIndex: number;
          \treadonly property: string;
          \treadonly descriptor: Extract<NativeCallableBoundaryDescriptor, { readonly version: 'virune-callable-shim/v1' }>;
          }

          export interface SemanticModel {''')
          replace_once(checker,
          '''\treadonly namedTypes: ReadonlyMap<string, TypeId>;
          \treadonly interop: InteropSemanticModel;
          }''',
          '''\treadonly namedTypes: ReadonlyMap<string, TypeId>;
          \treadonly frontendCallableProjections: readonly FrontendCallableProjectionEvidence[];
          \treadonly interop: InteropSemanticModel;
          }''')
          replace_once(checker,
          '''\treadonly #objectCallableProjections: import('../interop/types.js').ObjectCallableProjectionEvidence[] = [];
          \treadonly #moduleWitnesses: import('../interop/types.js').ModuleResolutionWitness[] = [];''',
          '''\treadonly #objectCallableProjections: import('../interop/types.js').ObjectCallableProjectionEvidence[] = [];
          \treadonly #frontendCallableProjections: FrontendCallableProjectionEvidence[] = [];
          \treadonly #moduleWitnesses: import('../interop/types.js').ModuleResolutionWitness[] = [];''')
          replace_once(checker,
          '''return { arena: this.arena, diagnostics: this.diagnostics, globalScope: this.globalScope, symbols: this.#symbols, namedTypes: this.#namedTypes, interop: {''',
          '''return { arena: this.arena, diagnostics: this.diagnostics, globalScope: this.globalScope, symbols: this.#symbols, namedTypes: this.#namedTypes, frontendCallableProjections: this.#frontendCallableProjections, interop: {''')
          replace_once(checker,
          '''\t\t\t\tcase 'ViewElement':
          \t\t\t\t\tfor (const property of child.properties) this.checkExpression(property.value, scope);
          \t\t\t\t\tif (child.children !== undefined) this.checkViewBlock(child.children, scope, insideRepetition);
          \t\t\t\t\tbreak;''',
          '''\t\t\t\tcase 'ViewElement': {
          \t\t\t\t\tconst root = child.tag[0];
          \t\t\t\t\tconst native = child.tag.length === 1 && root !== undefined && this.globalScope.lookup(root)?.kind === 'component';
          \t\t\t\t\tfor (let propertyIndex = 0; propertyIndex < child.properties.length; propertyIndex += 1) {
          \t\t\t\t\t\tconst property = child.properties[propertyIndex]!;
          \t\t\t\t\t\tconst typeId = this.checkExpression(property.value, scope);
          \t\t\t\t\t\tif (native) continue;
          \t\t\t\t\t\tconst boundary = this.nativeCallableBoundary(typeId, property.value);
          \t\t\t\t\t\tif (boundary === undefined || boundary.parameters.includes('Int')) continue;
          \t\t\t\t\t\tthis.requireEffects(boundary.effects, property.value.span);
          \t\t\t\t\t\tthis.#frontendCallableProjections.push({ viewElementNodeId: child.id, propertyIndex, property: property.name, descriptor: boundary });
          \t\t\t\t\t}
          \t\t\t\t\tif (child.children !== undefined) this.checkViewBlock(child.children, scope, insideRepetition);
          \t\t\t\t\tbreak;
          \t\t\t\t}''')

          jsx = 'packages/compiler/src/interop/jsx-view-validation.ts'
          replace_once(jsx,
          '''\tconst properties: string[] = [];
          \tfor (const property of element.properties) {
          \t\tif (!jsxAttributeName.test(property.name)) return fail(context, property.span, `property ${JSON.stringify(property.name)} cannot be represented as a preserved JSX attribute without speculative lowering`);
          \t\tconst value = native ? renderNativeComponentPropertyValue(property.value, context) : renderViewValue(property.value, context);
          \t\tif (value === undefined) return undefined;
          \t\tproperties.push(`${property.name}={${value}}`);
          \t}''',
          '''\tconst properties: string[] = [];
          \tfor (let propertyIndex = 0; propertyIndex < element.properties.length; propertyIndex += 1) {
          \t\tconst property = element.properties[propertyIndex]!;
          \t\tif (!jsxAttributeName.test(property.name)) return fail(context, property.span, `property ${JSON.stringify(property.name)} cannot be represented as a preserved JSX attribute without speculative lowering`);
          \t\tlet value: string | undefined;
          \t\tif (native) value = renderNativeComponentPropertyValue(property.value, context);
          \t\telse {
          \t\t\tconst projection = context.semantic.frontendCallableProjections.find(item => item.viewElementNodeId === element.id && item.propertyIndex === propertyIndex && item.property === property.name);
          \t\t\tif (projection === undefined) value = renderViewValue(property.value, context);
          \t\t\telse {
          \t\t\t\tvalue = renderFrontendCallableValue(projection.descriptor);
          \t\t\t\tif (value === undefined) return fail(context, property.span, `native callable property ${property.name} has unsupported frontend projection evidence`);
          \t\t\t}
          \t\t}
          \t\tif (value === undefined) return undefined;
          \t\tproperties.push(`${property.name}={${value}}`);
          \t}''')
          replace_once(jsx,
          '''function renderNativeComponentPropertyValue(expression: A.Expression, context: RenderContext): string | undefined {''',
          '''function renderFrontendCallablePrimitiveType(primitive: string, parameter: boolean): string | undefined {
          \tswitch (primitive) {
          \t\tcase 'Bool': return 'boolean';
          \t\tcase 'Int': return parameter ? undefined : 'number';
          \t\tcase 'Float': return 'number';
          \t\tcase 'BigInt': return 'bigint';
          \t\tcase 'String': return 'string';
          \t\tcase 'Unit': return 'undefined';
          \t\tdefault: return undefined;
          \t}
          }

          function renderFrontendCallablePrimitiveValue(primitive: string): string | undefined {
          \tswitch (primitive) {
          \t\tcase 'Bool': return 'false';
          \t\tcase 'Int':
          \t\tcase 'Float': return '0';
          \t\tcase 'BigInt': return '0n';
          \t\tcase 'String': return '""';
          \t\tcase 'Unit': return 'undefined';
          \t\tdefault: return undefined;
          \t}
          }

          function renderFrontendCallableValue(descriptor: SemanticModel['frontendCallableProjections'][number]['descriptor']): string | undefined {
          \tconst parameters: string[] = [];
          \tfor (let index = 0; index < descriptor.parameters.length; index += 1) {
          \t\tconst type = renderFrontendCallablePrimitiveType(descriptor.parameters[index]!, true);
          \t\tif (type === undefined) return undefined;
          \t\tparameters.push(`$p${index}: ${type}`);
          \t}
          \tconst resultType = renderFrontendCallablePrimitiveType(descriptor.result, false);
          \tconst resultValue = renderFrontendCallablePrimitiveValue(descriptor.result);
          \tif (resultType === undefined || resultValue === undefined) return undefined;
          \treturn descriptor.async
          \t\t? `(async (${parameters.join(', ')}): Promise<${resultType}> => ${resultValue})`
          \t\t: `((${parameters.join(', ')}): ${resultType} => ${resultValue})`;
          }

          function renderNativeComponentPropertyValue(expression: A.Expression, context: RenderContext): string | undefined {''')

          emitter = 'packages/compiler/src/codegen/emitter.ts'
          replace_once(emitter,
          '''\t\tif ((this.#semantic.interop.callableProjections?.length ?? 0) > 0 || (this.#semantic.interop.objectCallableProjections?.length ?? 0) > 0) {''',
          '''\t\tif ((this.#semantic.interop.callableProjections?.length ?? 0) > 0 || (this.#semantic.interop.objectCallableProjections?.length ?? 0) > 0 || this.#semantic.frontendCallableProjections.length > 0) {''')
          replace_once(emitter,
          '''\t\tconst properties = element.properties.map(property => `${property.name}={${native ? this.nativeComponentPropertyValue(property.value, contextName) : this.expression(property.value, contextName)}}`);''',
          '''\t\tconst properties = element.properties.map((property, propertyIndex) => `${property.name}={${native ? this.nativeComponentPropertyValue(property.value, contextName) : this.frontendViewPropertyValue(element.id, propertyIndex, property, contextName)}}`);''')
          replace_once(emitter,
          '''\tprivate nativeComponentPropertyValue(expression: A.Expression, contextName: string): string {''',
          '''\tprivate frontendViewPropertyValue(elementId: number, propertyIndex: number, property: A.ViewProperty, contextName: string): string {
          \t\tconst raw = this.expression(property.value, contextName);
          \t\tconst projection = this.#semantic.frontendCallableProjections.find(item => item.viewElementNodeId === elementId && item.propertyIndex === propertyIndex && item.property === property.name);
          \t\treturn projection === undefined ? raw : this.callableProjection(raw, projection.descriptor);
          \t}

          \tprivate nativeComponentPropertyValue(expression: A.Expression, contextName: string): string {''')

          test_path = Path('packages/js-interop/test/frontend-view-callable-props.test.ts')
          if test_path.exists():
              raise SystemExit(f'{test_path}: file already exists')
          test_path.write_text('''import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import test from 'node:test';
          import { compileSource } from '@virune/compiler/experimental';
          import { TypeScriptInteropProvider } from '../src/index.js';
          import { fixtureRoot } from './fixture.js';

          async function compile(text: string, emit = false) {
          \tconst root = await fixtureRoot();
          \tawait writeFile(join(root, 'tsconfig.json'), JSON.stringify({ compilerOptions: { jsx: 'preserve', noUnusedLocals: true }, include: ['src/**/*'] }), 'utf8');
          \tawait writeFile(join(root, 'src/library.d.ts'), `declare global {
          \tnamespace JSX {
          \t\tinterface Element { readonly __viruneJsxElement: unique symbol; }
          \t\tinterface IntrinsicElements {
          \t\t\tbutton: {
          \t\t\t\tonClick?: () => void;
          \t\t\t\tonNumber?: (value: number) => number;
          \t\t\t\tonText?: (value: string) => void;
          \t\t\t};
          \t\t\tdiv: {};
          \t\t}
          \t}
          }

          export const ExternalButton: (props: { onClick: () => void }) => JSX.Element;
          `, 'utf8');
          \tconst provider = new TypeScriptInteropProvider({ projectRoot: root });
          \ttry {
          \t\treturn compileSource({ id: 1, path: join(root, 'src/main.virune'), text }, { emit, platform: 'browser', jsInteropProvider: provider });
          \t} finally {
          \t\tprovider.dispose();
          \t}
          }

          const errors = (result: Awaited<ReturnType<typeof compile>>) => result.diagnostics.filter(item => item.severity === 'error');

          test('intrinsic View callback props reuse the existing callable shim', async () => {
          \tconst result = await compile(`fn handle() -> Unit {
          \treturn Unit
          }

          component Page() uses JavaScript {
          \treturn view {
          \t\tbutton(onClick: handle)
          \t}
          }
          `, true);
          \tassert.deepEqual(errors(result), []);
          \tassert.ok(result.output);
          \tassert.match(result.output.code, /<button onClick=\\{\\$viruneProjectCallable\\(handle,/u);
          \tassert.equal(result.semantic?.frontendCallableProjections.length, 1);
          \tassert.deepEqual(result.semantic?.frontendCallableProjections[0]?.descriptor, {
          \t\tversion: 'virune-callable-shim/v1',
          \t\tparameters: [],
          \t\tresult: 'Unit',
          \t\tasync: false,
          \t\teffects: [],
          \t\tcontextMode: 'root-argument',
          \t});
          });

          test('JavaScript-imported component callback props use the same projection', async () => {
          \tconst result = await compile(`import js { ExternalButton } from "./library.js"

          fn handle() -> Unit {
          \treturn Unit
          }

          component Page() uses JavaScript {
          \treturn view {
          \t\tExternalButton(onClick: handle)
          \t}
          }
          `, true);
          \tassert.deepEqual(errors(result), []);
          \tassert.ok(result.output);
          \tassert.match(result.output.code, /<ExternalButton onClick=\\{\\$viruneProjectCallable\\(handle,/u);
          \tassert.equal(result.semantic?.frontendCallableProjections.length, 1);
          });

          test('TypeScript JSX whole-usage proof rejects incompatible projected callbacks', async () => {
          \tconst result = await compile(`fn handle(value: Float) -> Unit {
          \treturn Unit
          }

          component Page() uses JavaScript {
          \treturn view {
          \t\tbutton(onText: handle)
          \t}
          }
          `);
          \tassert.ok(errors(result).some(item => item.code === 'L4308'));
          });

          test('Int callback parameters remain fail-closed because TypeScript number does not prove Virune Int', async () => {
          \tconst result = await compile(`fn handle(value: Int) -> Int {
          \treturn value
          }

          component Page() uses JavaScript {
          \treturn view {
          \t\tbutton(onNumber: handle)
          \t}
          }
          `);
          \tassert.ok(errors(result).some(item => item.code === 'L4308'));
          \tassert.equal(result.semantic?.frontendCallableProjections.length, 0);
          });

          test('generic native functions remain fail-closed as View callback props', async () => {
          \tconst result = await compile(`fn identity<T>(value: T) -> T {
          \treturn value
          }

          component Page() uses JavaScript {
          \treturn view {
          \t\tbutton(onNumber: identity)
          \t}
          }
          `);
          \tassert.ok(errors(result).some(item => item.code === 'L4308'));
          \tassert.equal(result.semantic?.frontendCallableProjections.length, 0);
          });

          test('frontend callable projection evidence and emission are deterministic', async () => {
          \tconst source = `fn handle() -> Unit {
          \treturn Unit
          }

          component Page() uses JavaScript {
          \treturn view {
          \t\tbutton(onClick: handle)
          \t}
          }
          `;
          \tconst first = await compile(source, true);
          \tconst second = await compile(source, true);
          \tassert.deepEqual(errors(first), []);
          \tassert.deepEqual(errors(second), []);
          \tassert.deepEqual(first.semantic?.frontendCallableProjections, second.semantic?.frontendCallableProjections);
          \tassert.equal(first.output?.code, second.output?.code);
          });
          ''')
          PY
      - name: Focused validation
        run: |
          npm ci
          npm run build
          node --test packages/js-interop/dist/test/frontend-view-callable-props.test.js
      - name: Commit validated source change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/frontend-callable-props-branch-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/compiler/src/checker/checker.ts packages/compiler/src/interop/jsx-view-validation.ts packages/compiler/src/codegen/emitter.ts packages/js-interop/test/frontend-view-callable-props.test.ts .github/workflows/frontend-callable-props-branch-edit.yml
          git diff --cached --check
          git commit -m "feat(frontend): project native callable view props"
          git push origin HEAD:feat/frontend-view-callable-props
