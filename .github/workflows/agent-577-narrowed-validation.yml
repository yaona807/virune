name: Temporary #577 simplified validation

on:
  push:
    branches:
      - fix/577-contextual-external-callable

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
      - name: Reconstruct reviewed prototype from historical Git objects
        shell: bash
        run: |
          git fetch --no-tags origin 9e38dc1bd891571cdc8cfdafd0586657243d25ab
          git show 9e38dc1bd891571cdc8cfdafd0586657243d25ab:.github/agent-577-candidate-source.yml > .github/agent-577-candidate-source.yml
          git show 9e38dc1bd891571cdc8cfdafd0586657243d25ab:.github/workflows/agent-577-candidate-validation-v6.yml > /tmp/agent-577-v8.yml
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('/tmp/agent-577-v8.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          source = workflow[start:end]
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in source.splitlines())
          exec(compile(source, '<agent-577-reviewed>', 'exec'), {'Path': Path})
          PY
      - name: Build simplified candidate
        run: |
          python3 .github/agent-577-narrow.py
          python3 .github/agent-577-narrow-fix-v2.py
          python3 .github/agent-577-simple-v2.py
      - name: Validate simplified compiler and regressions
        run: |
          npm run build
          node --test packages/js-interop/dist/test/contextual-external-callable.test.js packages/js-interop/dist/test/callable-boundary-ignored-arguments.test.js packages/js-interop/dist/test/callable-boundary-shim.test.js packages/js-interop/dist/test/callable-boundary-regressions.test.js
          npm run check
      - name: Validate real Hono 4.13.5 contextual compile
        shell: bash
        run: |
          npm install --no-save --package-lock=false --ignore-scripts hono@4.13.5
          node --input-type=module <<'JS'
          import { compileSource } from '@virune/compiler/experimental';
          import { TypeScriptInteropProvider } from '@virune/js-interop';
          import { join } from 'node:path';
          const path = join(process.cwd(), 'agent-577-hono.virune');
          const source = `import js { Hono } from "hono"\n\npub async fn runHttpSuccess() -> String uses JavaScript {\n\tlet app = Hono()\n\tdiscard app.get("/jobs/:id", async fn(c) uses JavaScript => c.text(c.req.param("id")))\n\tlet response = await app.request("/jobs/job-42")\n\tlet body = await response.text()\n\treturn "{response.status}:{body}"\n}\n`;
          const provider = new TypeScriptInteropProvider({ projectRoot: process.cwd() });
          const result = compileSource({ id: 1, path, text: source }, { platform: 'node', jsInteropProvider: provider });
          const errors = result.diagnostics.filter(item => item.severity === 'error');
          if (errors.length !== 0) throw new Error(errors.map(item => `${item.code} ${item.message}`).join('\n'));
          const projection = result.semantic?.interop.callableProjections?.[0];
          if (projection?.descriptor.version !== 'virune-callable-shim/v2') throw new Error('expected v2 Hono callback projection');
          if (projection.descriptor.parameters.join(',') !== 'External' || projection.descriptor.result !== 'External' || projection.descriptor.async !== true) throw new Error('unexpected simplified Hono callback descriptor');
          JS
      - name: Upload exact simplified source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-577-simplified-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            packages/compiler/src/interop/types.ts
            packages/compiler/src/checker/checker.ts
            packages/compiler/src/interop/operation.ts
            packages/compiler/src/codegen/emitter.ts
            packages/js-interop/src/index.ts
            packages/js-interop/test/contextual-external-callable.test.ts
