name: Temporary self-host expected value regression fix

on:
  push:
    branches:
      - feat/selfhost-expected-list-literals
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/selfhost-expected-list-literals
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Patch and validate contextual record fields
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/selfhost-expected-list-literals'
          expected_parent='6615b6d1480558067b636fdcea74d444991e9cc8'
          start_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          python - <<'PY'
          from pathlib import Path

          path = Path('selfhost/mvp/src/checker.virune')
          source = path.read_text()
          old = '''fn checkExpectedRecordField(node: MvpExpression, recordName: String, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet sourceId = childAt(node, 0)?
          \tlet expectedType = namedFieldType(recordName, node.text)
          \tlet checkedResult = if expectedType == MvpType.ErrorType then checkExpression(sourceId, context, expressions) else checkExpectedExpression(sourceId, expectedType, context, expressions)
          \tlet checked = checkedResult?
          \treturn Ok(addHir(checked.expressions, MvpHirExpression {
          \t\tkind: "recordField",
          \t\ttext: node.text,
          \t\tvalueType: checked.valueType,
          \t\tchildren: [checked.expressionId],
          \t\tspan: node.span,
          \t}, checked.valueType))
          }'''
          new = '''fn checkExpectedRecordField(node: MvpExpression, recordName: String, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet sourceId = childAt(node, 0)?
          \tlet source = sourceExpressionAt(context, sourceId)?
          \tlet expectedType = namedFieldType(recordName, node.text)
          \tlet constructorName = standardConstructorName(source.text)
          \tlet needsExpectedType = source.kind == "list" || constructorName == "Some" || constructorName == "None"
          \tlet checkedResult = if expectedType != MvpType.ErrorType && needsExpectedType then checkExpectedExpression(sourceId, expectedType, context, expressions) else checkExpression(sourceId, context, expressions)
          \tlet checked = checkedResult?
          \treturn Ok(addHir(checked.expressions, MvpHirExpression {
          \t\tkind: "recordField",
          \t\ttext: node.text,
          \t\tvalueType: checked.valueType,
          \t\tchildren: [checked.expressionId],
          \t\tspan: node.span,
          \t}, checked.valueType))
          }'''
          if source.count(old) != 1:
              raise RuntimeError(f'expected one checkExpectedRecordField anchor, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          npm ci
          npm run build
          node --test --test-timeout=900000 \
            packages/compiler/dist/test/selfhost-member-chain-integration.test.js \
            packages/compiler/dist/test/selfhost-expected-list-literals.test.js
          node --test --test-timeout=900000 \
            packages/compiler/dist/test/selfhost-full-language-inventory.test.js
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const inventory = JSON.parse(readFileSync('.cache/ci-timings/selfhost-full-language-inventory.json', 'utf8'));
          const l2020 = inventory.codeCounts.find(entry => entry.code === 'L2020');
          if (l2020 !== undefined && l2020.count !== 0) {
            throw new Error(`L2020 diagnostics remain: ${JSON.stringify(inventory.entries.filter(entry => entry.code === 'L2020'))}`);
          }
          console.log(JSON.stringify({ diagnosticCount: inventory.diagnosticCount, codeCounts: inventory.codeCounts }, null, 2));
          NODE
          rm .github/workflows/tmp-selfhost-expected-value-regression-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(selfhost): limit contextual record field checking'
          git push --force-with-lease=refs/heads/$branch:"$start_head" origin HEAD:$branch
