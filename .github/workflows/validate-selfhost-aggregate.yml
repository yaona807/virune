name: Validate self-host aggregate parser slice

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.head_ref == 'agent/selfhost-aggregate-call-ast' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-aggregate-call-ast
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Rename reserved generated bindings
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'selfhost/mvp/src/frontend-parser-core.virune';
          let source = await readFile(path, 'utf8');
          source = source.replace('let record = parseRecordExpression(state, tokens, text)', 'let recordValue = parseRecordExpression(state, tokens, text)');
          source = source.replace('return parsePostfix(record.state, tokens, start, record.id)', 'return parsePostfix(recordValue.state, tokens, start, recordValue.id)');
          source = source.replaceAll('let arguments = parseCallArguments(state, tokens)', 'let callArguments = parseCallArguments(state, tokens)');
          source = source.replaceAll('state = arguments.state', 'state = callArguments.state');
          source = source.replaceAll('arguments.id', 'callArguments.id');
          await writeFile(path, source);
          NODE
      - run: npm ci
      - run: npm run check
      - name: Run aggregate parser Host test
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-aggregate-call-expression-ast.test.js
      - name: Run Stage 0 self-host tests
        run: node packages/cli/dist/src/main.js test selfhost/mvp
      - name: Commit fixes and remove temporary validation workflow
        run: |
          rm .github/workflows/validate-selfhost-aggregate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfhost/mvp/src/frontend-parser-core.virune .github/workflows/validate-selfhost-aggregate.yml
          git commit -m "fix(selfhost): avoid generated JavaScript reserved bindings"
          git push origin HEAD:agent/selfhost-aggregate-call-ast
