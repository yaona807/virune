name: Temporary self-host Stage artifact loader

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-selfhost-stage-artifact-loader.yml
      - packages/compiler/src/selfhost/bootstrap-stage-loader.ts
      - packages/compiler/test/selfhost-bootstrap-stage-loader.test.ts

permissions:
  contents: read

jobs:
  stage-artifact-loader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Run Stage artifact loader tests
        run: node scripts/run-unit-tests.mjs --file=packages/compiler/dist/test/selfhost-bootstrap-stage-loader.test.js

      - name: Verify diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
