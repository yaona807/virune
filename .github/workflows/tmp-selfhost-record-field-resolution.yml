name: Temporary selfhost record field resolution

on:
  push:
    branches:
      - feat/selfhost-record-field-resolution
    paths:
      - .github/workflows/tmp-selfhost-record-field-resolution.yml

permissions:
  contents: write

concurrency:
  group: tmp-selfhost-record-field-resolution
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/selfhost-record-field-resolution
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Verify isolated transport and source blobs
        shell: bash
        run: |
          set -euo pipefail
          base=869c443c9af9ce1f18d6d618f259443d19f95b5d
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base"..HEAD | sort)
          expected=(.github/workflows/tmp-selfhost-record-field-resolution.yml)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected transport diff:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          test "$(git hash-object packages/compiler/test/selfhost-full-language-inventory.test.ts)" = f2e1507e5a0e29ef7a3b861bb1dbc3a373945d4e
          test "$(git hash-object selfhost/mvp/src/checker.virune)" = c64714cddcc944d378aa4cc0e90bd90485591adb
          test "$(git hash-object selfhost/mvp/src/frontend-control-flow.virune)" = b5c4b853417b9c48833fbb0c52ee7f5c0b5e95e9
          test "$(git hash-object selfhost/mvp/src/frontend-defer-checker.virune)" = ae2f34afd9daaa250ccfc06d5c152ea5ddccb2d0
          test "$(git hash-object selfhost/mvp/src/frontend-effect-checker.virune)" = fd5bec32cdb8d9349297a34148217cd897caa6f7
          test "$(git hash-object selfhost/mvp/src/frontend-symbol-scope.virune)" = 649db52e5783e72c993798c63f1cee102e5bac1e
          test "$(git hash-object selfhost/mvp/src/frontend-symbol-visibility.virune)" = c424e1b02296092783cb1df873bdb69c7818bbab

      - name: Apply unique record names and field types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'selfhost/mvp/src/frontend-control-flow.virune': [
                  ('FunctionBuildResult', 'ControlFlowFunctionBuildResult', 3),
              ],
              'selfhost/mvp/src/frontend-effect-checker.virune': [
                  ('FunctionBuildResult', 'EffectFunctionBuildResult', 3),
              ],
              'selfhost/mvp/src/frontend-defer-checker.virune': [
                  ('ScopeBuildResult', 'DeferScopeBuildResult', 3),
              ],
              'selfhost/mvp/src/frontend-symbol-scope.virune': [
                  ('ScopeBuildResult', 'SymbolScopeBuildResult', 3),
                  ('SymbolBuildResult', 'SymbolScopeSymbolBuildResult', 3),
              ],
              'selfhost/mvp/src/frontend-symbol-visibility.virune': [
                  ('SymbolBuildResult', 'VisibilitySymbolBuildResult', 3),
              ],
          }
          for file_name, entries in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              for old, new, expected_count in entries:
                  actual_count = text.count(old)
                  if actual_count != expected_count:
                      raise SystemExit(f'{file_name}: expected {expected_count} occurrences of {old}, found {actual_count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          checker_path = Path('selfhost/mvp/src/checker.virune')
          checker = checker_path.read_text(encoding='utf-8')
          anchor = '\tlet base = namedBaseTypeName(compact)\n'
          if checker.count(anchor) != 1:
              raise SystemExit(f'checker field anchor count: {checker.count(anchor)}')
          if 'base == "ControlFlowFunctionBuildResult"' in checker or 'base == "MvpExternalSignature"' in checker:
              raise SystemExit('record-field mappings already exist')
          mappings = '''\tif base == "ControlFlowFunctionBuildResult" && fieldName == "functions" {\n\t\treturn typeFromName("List<SemanticFlowFunction>")\n\t}\n\tif base == "ControlFlowFunctionBuildResult" && fieldName == "diagnostics" {\n\t\treturn typeFromName("List<SemanticFlowDiagnostic>")\n\t}\n\tif base == "EffectFunctionBuildResult" && fieldName == "functions" {\n\t\treturn typeFromName("List<SemanticEffectFunction>")\n\t}\n\tif base == "EffectFunctionBuildResult" && fieldName == "diagnostics" {\n\t\treturn typeFromName("List<SemanticEffectDiagnostic>")\n\t}\n\tif base == "DeferScopeBuildResult" && fieldName == "scopes" {\n\t\treturn typeFromName("List<SemanticDeferScope>")\n\t}\n\tif base == "DeferScopeBuildResult" && fieldName == "diagnostics" {\n\t\treturn typeFromName("List<SemanticDeferDiagnostic>")\n\t}\n\tif base == "SymbolScopeBuildResult" && fieldName == "scopes" {\n\t\treturn typeFromName("List<SemanticScope>")\n\t}\n\tif base == "SymbolScopeBuildResult" && fieldName == "diagnostics" {\n\t\treturn typeFromName("List<SemanticScopeDiagnostic>")\n\t}\n\tif base == "SymbolScopeSymbolBuildResult" && fieldName == "symbols" {\n\t\treturn typeFromName("List<SemanticSymbol>")\n\t}\n\tif base == "SymbolScopeSymbolBuildResult" && fieldName == "diagnostics" {\n\t\treturn typeFromName("List<SemanticScopeDiagnostic>")\n\t}\n\tif base == "VisibilitySymbolBuildResult" && fieldName == "symbols" {\n\t\treturn typeFromName("List<SemanticModuleSymbol>")\n\t}\n\tif base == "VisibilitySymbolBuildResult" && fieldName == "diagnostics" {\n\t\treturn typeFromName("List<SemanticVisibilityDiagnostic>")\n\t}\n\tif base == "MvpExternalSignature" && fieldName == "name" {\n\t\treturn typeFromName("String")\n\t}\n\tif base == "MvpExternalSignature" && fieldName == "parameters" {\n\t\treturn typeFromName("List<MvpType>")\n\t}\n\tif base == "MvpExternalSignature" && fieldName == "returnType" {\n\t\treturn typeFromName("MvpType")\n\t}\n\tif base == "MvpExternalSignature" && fieldName == "span" {\n\t\treturn typeFromName("MvpSpan")\n\t}\n'''
          checker_path.write_text(checker.replace(anchor, anchor + mappings, 1), encoding='utf-8')

          test_path = Path('packages/compiler/test/selfhost-full-language-inventory.test.ts')
          test_text = test_path.read_text(encoding='utf-8')
          test_anchor = '\tassert.deepEqual(inventory.boundaryBlockers, []);\n'
          if test_text.count(test_anchor) != 1:
              raise SystemExit(f'inventory test anchor count: {test_text.count(test_anchor)}')
          assertion = '''\tconst diagnosticCountFor = (code: string): number =>\n\t\tinventory.codeCounts.find(entry => entry.code === code)?.count ?? 0;\n\tassert.equal(diagnosticCountFor('L2014'), 0);\n'''
          test_path.write_text(test_text.replace(test_anchor, test_anchor + assertion, 1), encoding='utf-8')
          PY

      - name: Verify reserved final diff
        shell: bash
        run: |
          set -euo pipefail
          base=869c443c9af9ce1f18d6d618f259443d19f95b5d
          mapfile -t changed < <(git diff --name-only "$base" | sort)
          expected=(
            .github/workflows/tmp-selfhost-record-field-resolution.yml
            packages/compiler/test/selfhost-full-language-inventory.test.ts
            selfhost/mvp/src/checker.virune
            selfhost/mvp/src/frontend-control-flow.virune
            selfhost/mvp/src/frontend-defer-checker.virune
            selfhost/mvp/src/frontend-effect-checker.virune
            selfhost/mvp/src/frontend-symbol-scope.virune
            selfhost/mvp/src/frontend-symbol-visibility.virune
          )
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected final diff:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: npm run check

      - name: Run full-language inventory regression
        run: node --test --test-timeout=1300000 packages/compiler/dist/test/selfhost-full-language-inventory.test.js

      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selfhost-record-field-resolution-${{ github.sha }}
          path: .cache/ci-timings/selfhost-full-language-inventory.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated source and test changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name yaona807
          git config user.email 72598968+yaona807@users.noreply.github.com
          git add \
            packages/compiler/test/selfhost-full-language-inventory.test.ts \
            selfhost/mvp/src/checker.virune \
            selfhost/mvp/src/frontend-control-flow.virune \
            selfhost/mvp/src/frontend-defer-checker.virune \
            selfhost/mvp/src/frontend-effect-checker.virune \
            selfhost/mvp/src/frontend-symbol-scope.virune \
            selfhost/mvp/src/frontend-symbol-visibility.virune
          git commit -m "feat(selfhost): resolve internal record fields"
          git push origin HEAD:feat/selfhost-record-field-resolution
