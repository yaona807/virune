name: Implement self-host extern detail AST

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.head_ref == 'agent/selfhost-extern-detail-ast' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-extern-detail-ast
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Implement extern detail parser
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'selfhost/mvp/src/frontend-parser-core.virune';
          let source = await readFile(path, 'utf8');
          const marker = 'fn parseComposite(';
          if (!source.includes('fn parseExternDeclaration(')) {
            const implementation = `fn parseExternParameters(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet mut state = stateValue\n\tlet mut children: List<Int> = []\n\tif isText(state, tokens, "(") {\n\t\tstate = skipNewLines(advance(state), tokens)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected ( to begin extern parameters", state.index)\n\t}\n\twhile !atEnd(state, tokens) && !isText(state, tokens, ")") {\n\t\tlet before = state.index\n\t\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\t\tlet name = if validName then currentText(state, tokens) else ""\n\t\tif validName {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an extern parameter name", state.index)\n\t\t}\n\t\tlet optional = isText(state, tokens, "?")\n\t\tif optional {\n\t\t\tstate = advance(state)\n\t\t}\n\t\tif isText(state, tokens, ":") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected : after an extern parameter name", state.index)\n\t\t}\n\t\tlet typeValue = parseTypeReferenceNode(state, tokens)\n\t\tstate = typeValue.state\n\t\tlet mut parameterChildren: List<Int> = []\n\t\tif typeValue.id >= 0 {\n\t\t\tparameterChildren = List.append(parameterChildren, typeValue.id)\n\t\t}\n\t\tlet parameterText = if optional then "optional " + name else name\n\t\tlet parameter = addNode(\n\t\t\tstate,\n\t\t\ttokens,\n\t\t\t"ExternParameter",\n\t\t\tparameterText,\n\t\t\tbefore,\n\t\t\tstate.index,\n\t\t\tparameterChildren,\n\t\t\t[],\n\t\t)\n\t\tstate = parameter.state\n\t\tchildren = List.append(children, parameter.id)\n\t\tif isText(state, tokens, ",") {\n\t\t\tstate = skipNewLines(advance(state), tokens)\n\t\t} else if !isText(state, tokens, ")") {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected , or ) after an extern parameter", state.index)\n\t\t\twhile !atEnd(state, tokens)\n\t\t\t\t&& currentKind(state, tokens) != FrontendTokenKind.NewLine\n\t\t\t\t&& !isText(state, tokens, ",")\n\t\t\t\t&& !isText(state, tokens, ")") {\n\t\t\t\tstate = advance(state)\n\t\t\t}\n\t\t\tif isText(state, tokens, ",") {\n\t\t\t\tstate = skipNewLines(advance(state), tokens)\n\t\t\t}\n\t\t}\n\t\tif state.index <= before {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Parser made no progress in extern parameters", state.index)\n\t\t\tif !atEnd(state, tokens) {\n\t\t\t\tstate = advance(state)\n\t\t\t}\n\t\t}\n\t}\n\tif isText(state, tokens, ")") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected ) to end extern parameters", state.index)\n\t}\n\treturn addNode(state, tokens, "ExternParameters", "", start, state.index, children, [])\n}\n\nfn parseExternFunction(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet mut state = stateValue\n\tlet asyncValue = isText(state, tokens, "async")\n\tif asyncValue {\n\t\tstate = advance(state)\n\t}\n\tif isText(state, tokens, "fn") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected fn in an extern declaration", state.index)\n\t}\n\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\tlet name = if validName then currentText(state, tokens) else ""\n\tif validName {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an extern function name", state.index)\n\t}\n\tlet mut children: List<Int> = []\n\tif asyncValue {\n\t\tlet modifiers = addNode(state, tokens, "ExternFunctionModifiers", "async", start, state.index, [], [])\n\t\tstate = modifiers.state\n\t\tchildren = List.append(children, modifiers.id)\n\t}\n\tlet parameters = parseExternParameters(state, tokens)\n\tstate = parameters.state\n\tchildren = List.append(children, parameters.id)\n\tif isText(state, tokens, "->") {\n\t\tlet returnType = parseReturnTypeNode(advance(state), tokens)\n\t\tstate = returnType.state\n\t\tchildren = List.append(children, returnType.id)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected -> in an extern function", state.index)\n\t}\n\tif isText(state, tokens, "uses") {\n\t\tlet usesClause = parseUsesClauseNode(state, tokens)\n\t\tstate = usesClause.state\n\t\tchildren = List.append(children, usesClause.id)\n\t}\n\tif isText(state, tokens, "=") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected = before an extern binding", state.index)\n\t}\n\tlet bindingStart = state.index\n\tlet validBinding = currentKind(state, tokens) == FrontendTokenKind.StringLiteral\n\tlet bindingText = if validBinding then currentText(state, tokens) else ""\n\tif validBinding {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a JavaScript binding string", state.index)\n\t}\n\tlet binding = addNode(state, tokens, "ExternBinding", bindingText, bindingStart, state.index, [], [])\n\tstate = binding.state\n\tchildren = List.append(children, binding.id)\n\tstate = consumeLineEnd(state, tokens, "an extern function")\n\treturn addNode(state, tokens, "ExternFunction", name, start, state.index, children, [])\n}\n\nfn parseExternDeclaration(\n\tstateValue: CoreState,\n\ttokens: List<FrontendToken>,\n\tdocumentation: List<String>,\n) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet keywordIndex = declarationKeywordIndex(stateValue, tokens)\n\tlet unsafeValue = modifierPresent(stateValue, tokens, keywordIndex, "unsafe")\n\tlet mut state = withIndex(stateValue, keywordIndex + 1)\n\tlet mut children: List<Int> = []\n\tif unsafeValue {\n\t\tlet modifiers = addNode(state, tokens, "ExternModifiers", "unsafe", start, keywordIndex, [], [])\n\t\tstate = modifiers.state\n\t\tchildren = List.append(children, modifiers.id)\n\t}\n\tif isText(state, tokens, "js") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected js after extern", state.index)\n\t}\n\tlet sourceStart = state.index\n\tlet validSource = currentKind(state, tokens) == FrontendTokenKind.StringLiteral\n\tlet sourceText = if validSource then currentText(state, tokens) else ""\n\tif validSource {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an extern module source string", state.index)\n\t}\n\tlet sourceNode = addNode(state, tokens, "ExternSource", sourceText, sourceStart, state.index, [], [])\n\tstate = sourceNode.state\n\tchildren = List.append(children, sourceNode.id)\n\tif isText(state, tokens, "{") {\n\t\tstate = skipNewLines(advance(state), tokens)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected { to begin an extern declaration", state.index)\n\t\tstate = synchronizeLine(state, tokens)\n\t}\n\twhile !atEnd(state, tokens) && !isText(state, tokens, "}") {\n\t\tstate = skipNewLines(state, tokens)\n\t\tif !atEnd(state, tokens) && !isText(state, tokens, "}") {\n\t\t\tlet before = state.index\n\t\t\tif isText(state, tokens, "fn") || isText(state, tokens, "async") {\n\t\t\t\tlet member = parseExternFunction(state, tokens)\n\t\t\t\tstate = member.state\n\t\t\t\tchildren = List.append(children, member.id)\n\t\t\t} else {\n\t\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an extern function", state.index)\n\t\t\t\tstate = synchronizeLine(state, tokens)\n\t\t\t}\n\t\t\tif state.index <= before {\n\t\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Parser made no progress in an extern declaration", state.index)\n\t\t\t\tif !atEnd(state, tokens) {\n\t\t\t\t\tstate = advance(state)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\tif isText(state, tokens, "}") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected } to end an extern declaration", state.index)\n\t}\n\treturn addNode(state, tokens, "ExternDeclaration", sourceText, start, state.index, children, documentation)\n}\n\n`;
            source = source.replace(marker, implementation + marker);
          }
          source = source.replace(
            'if kind == "ExternDeclaration" {\n\t\treturn parseComposite(state, tokens, kind, docs.documentation)\n\t}',
            'if kind == "ExternDeclaration" {\n\t\treturn parseExternDeclaration(state, tokens, docs.documentation)\n\t}',
          );
          await writeFile(path, source);

          const englishPath = 'docs/self-hosting-frontend.md';
          let english = await readFile(englishPath, 'utf8');
          if (!english.includes('### Extern declaration AST')) {
            english += '\n\n### Extern declaration AST\n\nJavaScript extern blocks now emit `ExternModifiers`, `ExternSource`, detailed `ExternFunction`, `ExternParameters`, `ExternParameter`, `ReturnType`, `UsesClause`, and `ExternBinding` nodes. Optional parameters are encoded deterministically in parameter text, and malformed members recover at physical line boundaries so later extern members and declarations remain reachable.\n';
          }
          await writeFile(englishPath, english);

          const japanesePath = 'docs/self-hosting-frontend_ja.md';
          let japanese = await readFile(japanesePath, 'utf8');
          if (!japanese.includes('### Extern declaration AST')) {
            japanese += '\n\n### Extern declaration AST\n\nJavaScript extern blockは`ExternModifiers`、`ExternSource`、詳細`ExternFunction`、`ExternParameters`、`ExternParameter`、`ReturnType`、`UsesClause`、`ExternBinding`を生成します。Optional parameterはparameter textで決定的に区別し、壊れたmemberは物理line境界で復旧して後続extern memberとdeclarationへの到達性を維持します。\n';
          }
          await writeFile(japanesePath, japanese);
          NODE
      - run: npm ci
      - run: npm run check
      - name: Run extern detail Host test
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-extern-detail-ast.test.js
      - name: Run Stage 0 self-host tests
        run: node packages/cli/dist/src/main.js test selfhost/mvp
      - run: git diff --check
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/implement-selfhost-extern-detail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfhost/mvp/src/frontend-parser-core.virune packages/compiler/test/selfhost-extern-detail-ast.test.ts selfhost/mvp/src/frontend-extern-detail.spec.virune docs/self-hosting-frontend.md docs/self-hosting-frontend_ja.md .github/workflows/implement-selfhost-extern-detail.yml
          git commit -m "compiler(selfhost): add extern detail AST"
          git push origin HEAD:agent/selfhost-extern-detail-ast
