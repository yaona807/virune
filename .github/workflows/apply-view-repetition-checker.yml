name: Apply exact View repetition checker proof

on:
  push:
    branches:
      - feat/frontend-view-repetition

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/frontend-view-repetition
          fetch-depth: 0
      - name: Apply exact checker replacement
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const path = 'packages/compiler/src/checker/checker.ts';
          const expectedBlob = 'af74f5706e45a953c25b0cbfb82c4fd7e482b96a';
          const actualBlob = execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim();
          if (actualBlob !== expectedBlob) throw new Error(`Unexpected checker blob ${actualBlob}`);
          const oldBlock = [
            "\t\t} else if (sourceType.kind === 'foreign' && sourceType.snapshot.category === 'array') {",
            "\t\t\tconst provider = this.currentInteropProvider(sourceType.snapshot);",
            "\t\t\tlet resolution: import('../interop/types.js').ForeignIndexResolution | undefined;",
            "\t\t\tif (provider?.resolveIndexUsage !== undefined) {",
            "\t\t\t\ttry { resolution = provider.resolveIndexUsage(sourceType.ref, { index: { kind: 'native-primitive', primitive: 'Int' } }); } catch { resolution = undefined; }",
            "\t\t\t}",
            "\t\t\tif (provider !== undefined && this.isCurrentForeignSnapshot(resolution?.result, provider, false)) {",
            "\t\t\t\tthis.requireEffects(['JavaScript'], repetition.span);",
            "\t\t\t\trepetition.sourceKind = 'external-array';",
            "\t\t\t\titemType = this.arena.foreign(resolution.result);",
            "\t\t\t}",
            "\t\t}",
          ].join('\n');
          const newBlock = [
            "\t\t} else if (sourceType.kind === 'foreign' && sourceType.snapshot.category === 'array') {",
            "\t\t\tconst provider = this.currentInteropProvider(sourceType.snapshot);",
            "\t\t\tlet element: ForeignTypeSnapshot | undefined;",
            "\t\t\tif (provider?.resolveArrayElement !== undefined) {",
            "\t\t\t\ttry { element = provider.resolveArrayElement(sourceType.ref); } catch { element = undefined; }",
            "\t\t\t}",
            "\t\t\tif (provider !== undefined && this.isCurrentForeignSnapshot(element, provider, false)) {",
            "\t\t\t\tthis.requireEffects(['JavaScript'], repetition.span);",
            "\t\t\t\trepetition.sourceKind = 'external-array';",
            "\t\t\t\titemType = this.arena.foreign(element);",
            "\t\t\t}",
            "\t\t}",
          ].join('\n');
          const text = fs.readFileSync(path, 'utf8');
          const parts = text.split(oldBlock);
          if (parts.length !== 2) throw new Error(`Expected exactly one checker block, found ${parts.length - 1}`);
          fs.writeFileSync(path, parts[0] + newBlock + parts[1]);
          NODE
          git diff --check
          test "$(git diff --name-only)" = "packages/compiler/src/checker/checker.ts"
      - name: Commit exact checker change and remove patch workflow
        run: |
          rm .github/workflows/apply-view-repetition-checker.yml
          git add packages/compiler/src/checker/checker.ts .github/workflows/apply-view-repetition-checker.yml
          test "$(git diff --cached --name-only)" = $'.github/workflows/apply-view-repetition-checker.yml\npackages/compiler/src/checker/checker.ts'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(frontend): use declared Array element proof for repetition'
          git push origin HEAD:feat/frontend-view-repetition
