name: Patch parser module transport

on:
  push:
    branches:
      - agent/selfhost-frontend-parser-core
    paths:
      - .github/workflows/patch-parser-module-transport.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-frontend-parser-core
          fetch-depth: 0
      - name: Decode one module transport layer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('selfhost/mvp/src/frontend-parser-core.virune')
          content = path.read_text(encoding='utf-8')
          old = 'fn decodeFrontend(source: String) -> Result<FrontendLexResult, List<JsonError>> {\n\tlet payload = lexFrontendJson(source)?\n\treturn Json.decode<FrontendLexResult>(payload)\n}'
          new = 'fn decodeFrontend(source: String) -> Result<FrontendLexResult, List<JsonError>> {\n\tlet transported = lexFrontendJson(source)?\n\tlet payload = Json.decode<String>(transported)?\n\treturn Json.decode<FrontendLexResult>(payload)\n}'
          if content.count(old) != 1:
              raise SystemExit(f'replacement count: {content.count(old)}')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git rm .github/workflows/patch-parser-module-transport.yml
          git add selfhost/mvp/src/frontend-parser-core.virune
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(selfhost): decode internal lexer module transport"
          git push origin HEAD:agent/selfhost-frontend-parser-core
