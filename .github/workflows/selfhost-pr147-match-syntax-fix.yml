name: Selfhost PR147 match syntax fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/selfhost-pr147-match-syntax-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfhost/closed-pattern-coverage
      - name: Replace block match arms with Stage 0 compatible control flow
        shell: python
        run: |
          from pathlib import Path

          path = Path('selfhost/mvp/src/frontend-pattern-coverage.virune')
          content = path.read_text()
          start = content.index('fn buildCoverage(')
          end = content.index('\nfn accepted(', start)
          replacement = '''fn buildCoverage(
          \tcheck: FrontendPatternCheck,
          \tsemantics: FrontendSemanticResult,
          \tdiagnosticsValue: List<SemanticDiagnostic>,
          ) -> CoverageBuildResult {
          \tlet spaceResult = buildPatternSpace(check.target, check.span, semantics, diagnosticsValue)
          \tlet space = spaceResult.space
          \tlet mut diagnostics = spaceResult.diagnostics
          \tlet mut seen: List<String> = []
          \tlet mut covered: List<Int> = []
          \tlet mut arms: List<SemanticPatternArmResult> = []
          \tlet mut wildcard = false
          \tlet mut index = 0
          \tfor arm in check.arms {
          \t\tlet key = armKey(arm)
          \t\tlet keyValue = match key {
          \t\t\tSome(value) => value
          \t\t\tNone => ""
          \t\t}
          \t\tlet mut reachable = true
          \t\tlet mut coveredCaseId = -1
          \t\tif wildcard {
          \t\t\tdiagnostics = List.append(diagnostics, patternError(
          \t\t\t\t"L3002",
          \t\t\t\t"Unreachable pattern after wildcard",
          \t\t\t\tarm.span,
          \t\t\t\tSome("Remove this arm or move it before the unguarded wildcard arm."),
          \t\t\t))
          \t\t\treachable = false
          \t\t} else if String.length(keyValue) == 0 {
          \t\t\tdiagnostics = List.append(diagnostics, patternError(
          \t\t\t\t"L9001",
          \t\t\t\t"Malformed pattern coverage arm",
          \t\t\t\tarm.span,
          \t\t\t\tSome("Use wildcard, constructor, boolean, or literal with the required name."),
          \t\t\t))
          \t\t\treachable = false
          \t\t} else if !arm.guarded {
          \t\t\tif containsString(seen, keyValue) {
          \t\t\t\tdiagnostics = List.append(diagnostics, patternError(
          \t\t\t\t\t"L3002",
          \t\t\t\t\t"Unreachable duplicate pattern " + keyValue,
          \t\t\t\t\tarm.span,
          \t\t\t\t\tSome("Remove the duplicate arm or add a guard that can distinguish it."),
          \t\t\t\t))
          \t\t\t\treachable = false
          \t\t\t} else {
          \t\t\t\tseen = List.append(seen, keyValue)
          \t\t\t}
          \t\t\tif keyValue == "*" {
          \t\t\t\twildcard = true
          \t\t\t} else if closedSpace(space.kind) {
          \t\t\t\tcoveredCaseId = caseId(space.cases, keyValue)
          \t\t\t\tif coveredCaseId < 0 {
          \t\t\t\t\tdiagnostics = List.append(diagnostics, patternError(
          \t\t\t\t\t\t"L2040",
          \t\t\t\t\t\t"Unknown pattern case " + keyValue + " for " + check.target,
          \t\t\t\t\t\tarm.span,
          \t\t\t\t\t\tSome("Use a constructor or literal that belongs to the target pattern space."),
          \t\t\t\t\t))
          \t\t\t\t} else if !containsInt(covered, coveredCaseId) {
          \t\t\t\t\tcovered = List.append(covered, coveredCaseId)
          \t\t\t\t}
          \t\t\t}
          \t\t}
          \t\tarms = List.append(arms, SemanticPatternArmResult {
          \t\t\tindex: index,
          \t\t\tkey: key,
          \t\t\tguarded: arm.guarded,
          \t\t\treachable: reachable,
          \t\t\tcoveredCaseId: maybeInt(coveredCaseId),
          \t\t})
          \t\tindex = index + 1
          \t}
          \tlet missing = appendMissing(space.cases, covered, wildcard)
          \tlet names = missingNames(space.cases, missing)
          \tlet mut exhaustive = false
          \tif wildcard {
          \t\texhaustive = true
          \t} else if space.kind == "bool" {
          \t\texhaustive = List.length(missing) == 0
          \t\tif !exhaustive {
          \t\t\tdiagnostics = List.append(diagnostics, patternError(
          \t\t\t\t"L3003",
          \t\t\t\t"Bool match must cover true and false",
          \t\t\t\tcheck.span,
          \t\t\t\tSome("Add the missing Bool literal arm or an unguarded wildcard arm."),
          \t\t\t))
          \t\t}
          \t} else if space.kind == "enum" || space.kind == "option" || space.kind == "result" {
          \t\texhaustive = List.length(missing) == 0
          \t\tfor name in names {
          \t\t\tdiagnostics = List.append(diagnostics, patternError(
          \t\t\t\t"L3004",
          \t\t\t\t"Non-exhaustive match: missing " + name,
          \t\t\t\tcheck.span,
          \t\t\t\tSome("Add an arm for " + name + " or an unguarded wildcard arm."),
          \t\t\t))
          \t\t}
          \t} else if space.kind == "int" || space.kind == "string" {
          \t\tdiagnostics = List.append(diagnostics, patternError(
          \t\t\t"L3005",
          \t\t\t"Int and String matches require a wildcard arm",
          \t\t\tcheck.span,
          \t\t\tSome("Add an unguarded wildcard arm because this pattern space is open."),
          \t\t))
          \t} else {
          \t\texhaustive = false
          \t}
          \treturn CoverageBuildResult {
          \t\tcoverage: SemanticPatternCoverage {
          \t\t\ttarget: check.target,
          \t\t\ttargetTypeId: maybeInt(space.typeId),
          \t\t\tspaceKind: space.kind,
          \t\t\tcases: space.cases,
          \t\t\tarms: arms,
          \t\t\tmissingCaseIds: missing,
          \t\t\tmissingCaseNames: names,
          \t\t\texhaustive: exhaustive,
          \t\t},
          \t\tdiagnostics: diagnostics,
          \t}
          }
          '''
          path.write_text(content[:start] + replacement + content[end:])
          Path('.github/workflows/selfhost-pr147-match-syntax-fix.yml').unlink()
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/frontend-pattern-coverage.virune .github/workflows/selfhost-pr147-match-syntax-fix.yml
          git commit -m "compiler(selfhost): use Stage 0 compatible match control flow"
          git push origin HEAD:selfhost/closed-pattern-coverage
