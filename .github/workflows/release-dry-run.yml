name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Stable release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute production release path without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_DATE_EPOCH: '0'
        run: npm run release:gate
      - name: Upload release evidence and candidate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          name: stable-release-dry-run-${{ github.sha }}
          path: |
            .cache/release/release-evidence.json
            .cache/reproducible-release/
            release/
          if-no-files-found: error
          retention-days: 30
