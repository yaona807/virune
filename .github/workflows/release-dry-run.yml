name: Release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions-policy.json'
      - '.github/stable-release-gate.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'
      - '.github/workflows/nightly.yml'
      - 'docs/release-channels*.md'
      - 'docs/reproducible-builds*.md'
      - 'docs/runtime-abi*.md'
      - 'docs/stable-release-gate*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - 'packages/public-abi.snapshot.json'
      - 'packages/runtime/src/**'
      - 'packages/js-interop/src/**'
      - 'packages/stdlib/src/**'
      - 'packages/compiler/src/codegen/runtime-imports.ts'
      - 'scripts/generate-release-sbom*.mjs'
      - 'scripts/package.mjs'
      - 'scripts/release-manifest.mjs'
      - 'scripts/smoke-release.mjs'
      - 'scripts/stable-release-gate*.mjs'
      - 'scripts/verify-documentation.mjs'
      - 'scripts/verify-public-abi*.mjs'
      - 'scripts/verify-release-channel.mjs'
      - 'scripts/verify-reproducible-release*.mjs'
      - 'scripts/verify-workflows*.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-dry-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Stable release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute production release path without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_DATE_EPOCH: '0'
        run: npm run release:gate
      - name: Upload release evidence and candidate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stable-release-dry-run-${{ github.sha }}
          path: |
            .cache/release/release-evidence.json
            .cache/reproducible-release/
            release/
          if-no-files-found: error
          retention-days: 30
