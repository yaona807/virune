name: Self-host promotion policy

on:
  pull_request:
    paths:
      - '.github/self-hosting/promotion-policy-v1.json'
      - '.github/workflows/selfhost-promotion-policy.yml'
      - 'scripts/verify-selfhost-promotion-policy.mjs'
      - 'scripts/verify-selfhost-promotion-policy.test.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/self-hosting/promotion-policy-v1.json'
      - '.github/workflows/selfhost-promotion-policy.yml'
      - 'scripts/verify-selfhost-promotion-policy.mjs'
      - 'scripts/verify-selfhost-promotion-policy.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify promotion policy
        run: node scripts/verify-selfhost-promotion-policy.mjs

      - name: Test promotion policy verifier
        run: node --test scripts/verify-selfhost-promotion-policy.test.mjs
