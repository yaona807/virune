name: Temporary self-host break and continue implementation

on:
  pull_request:
    branches:
      - feat/selfhost-else-if-parser
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/selfhost-break-continue
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply break and continue implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          patch_path = Path('.github/workflows/tmp-selfhost-break-continue-patch.py')
          script = patch_path.read_text()
          start = script.index("emitter_path = Path('selfhost/mvp/src/emitter.virune')")
          end = script.index("Path('packages/compiler/test/selfhost-break-continue.test.ts')", start)
          replacement = r'''emitter_path = Path('selfhost/mvp/src/emitter.virune')
          emitter = emitter_path.read_text()
          emitter = required_replace(
              emitter,
              '\t\tHirReturn(expressionId, _) => prefix + "return " + emitExpression(expressionId, expressions) + ";\\n"',
              '\t\tHirBreak(_) => prefix + "break;\\n"\n\t\tHirContinue(_) => prefix + "continue;\\n"\n\t\tHirReturn(expressionId, _) => prefix + "return " + emitExpression(expressionId, expressions) + ";\\n"',
              'emitter loop control statements',
          )
          emitter_path.write_text(emitter)

          '''
          corrected = script[:start] + replacement + script[end:]
          compile(corrected, str(patch_path), 'exec')
          exec(corrected, {'__name__': '__main__'})
          PY
      - run: npm run build
      - run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-break-continue.test.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/model.virune selfhost/mvp/src/parser.virune selfhost/mvp/src/checker.virune selfhost/mvp/src/emitter.virune packages/compiler/test/selfhost-break-continue.test.ts .github/workflows/tmp-selfhost-break-continue-pr.yml .github/workflows/tmp-selfhost-break-continue-patch.py
          git commit -m "feat(selfhost): support break and continue"
          git push origin HEAD:feat/selfhost-break-continue
