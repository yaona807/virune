name: Reference Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: virune-reference-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      stable: ${{ steps.identity.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Resolve Stable Reference identity
        id: identity
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected="v${version}"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Expected tag $expected, got $GITHUB_REF_NAME" >&2; exit 1; }
          echo "stable=true" >> "$GITHUB_OUTPUT"
      - name: Test Reference boundary handling
        if: steps.identity.outputs.stable == 'true'
        run: node --test scripts/build-reference.test.mjs
      - name: Verify deterministic Stable Reference projection
        if: steps.identity.outputs.stable == 'true'
        run: node scripts/build-reference.mjs --check --mode=stable --release-tag="$GITHUB_REF_NAME" --source-sha="$GITHUB_SHA"
      - name: Configure GitHub Pages
        if: steps.identity.outputs.stable == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build Stable Reference
        if: steps.identity.outputs.stable == 'true'
        run: node scripts/build-reference.mjs --mode=stable --release-tag="$GITHUB_REF_NAME" --source-sha="$GITHUB_SHA" --output=.cache/reference/site
      - name: Upload Reference Pages artifact
        if: steps.identity.outputs.stable == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .cache/reference/site

  deploy:
    if: needs.build.outputs.stable == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Reference to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
