name: Reference Pages

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: virune-reference-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REFERENCE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      stable: ${{ steps.identity.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.REFERENCE_SOURCE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Resolve Stable Reference identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(node -p 'require("./package.json").version')"
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected="v${version}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$GITHUB_REF_NAME" = "$expected" || { echo "Expected tag $expected, got $GITHUB_REF_NAME" >&2; exit 1; }
          fi

          IFS=$'\t' read -r published_tag draft prerelease < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$expected" --jq '[.tag_name, .draft, .prerelease] | @tsv'
          )
          test "$published_tag" = "$expected" || { echo "Published release tag mismatch." >&2; exit 1; }
          if [[ "$draft" != "false" || "$prerelease" != "false" ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$REFERENCE_SOURCE_SHA" || { echo "Checked-out source SHA does not match triggering workflow identity." >&2; exit 1; }
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$expected" --jq .sha)"
          test "$tag_sha" = "$source_sha" || { echo "Stable release tag $expected does not identify source $source_sha." >&2; exit 1; }

          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "tag=$expected" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.identity.outputs.stable == 'true'
        run: npm ci
      - name: Test Reference boundary handling
        if: steps.identity.outputs.stable == 'true'
        run: node --test scripts/build-reference.test.mjs
      - name: Verify deterministic Stable Reference projection
        if: steps.identity.outputs.stable == 'true'
        run: node scripts/build-reference.mjs --check --mode=stable --release-tag="${{ steps.identity.outputs.tag }}" --source-sha="${{ steps.identity.outputs.source_sha }}"
      - name: Configure GitHub Pages
        if: steps.identity.outputs.stable == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build Stable Reference
        if: steps.identity.outputs.stable == 'true'
        run: node scripts/build-reference.mjs --mode=stable --release-tag="${{ steps.identity.outputs.tag }}" --source-sha="${{ steps.identity.outputs.source_sha }}" --output=.cache/reference/site
      - name: Upload Reference Pages artifact
        if: steps.identity.outputs.stable == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .cache/reference/site

  deploy:
    if: needs.build.outputs.stable == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Reference to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
