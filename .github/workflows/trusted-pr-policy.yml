name: Trusted PR policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: trusted-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Trusted-base PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify trusted policy regressions
        run: node --test scripts/evaluate-pr-policy.test.mjs scripts/evaluate-pr-policy-workflow.test.mjs
      - name: Evaluate PR metadata and publish exact-head status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/evaluate-pr-policy.mjs
