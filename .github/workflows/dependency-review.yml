name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit-fix-commit:
    name: Commit audited lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Apply and verify lockfile-only audit fixes
        run: |
          npm audit fix --package-lock-only
          npm audit --audit-level=moderate

      - name: Commit fixed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Audited lockfile is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: refresh audited dependency lockfile'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Review dependency changes with GitHub
        id: github_dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate

      - name: Audit all locked dependencies
        run: npm audit --audit-level=moderate

      - name: Report unavailable GitHub dependency review
        if: steps.github_dependency_review.outcome == 'failure'
        shell: bash
        run: echo '::warning::GitHub change-level dependency review is unavailable because Dependency Graph is disabled. The blocking npm audit covered all locked runtime and development dependencies. Enable Dependency Graph before requiring the GitHub review result.'
