name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit-diagnostic:
    name: Diagnose locked dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize audit findings
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output package.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/package.json"
          curl --fail --silent --show-error --location --retry 3 \
            --output package-lock.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/package-lock.json"
          status=0
          npm audit --json > audit.json || status=$?
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('audit.json', 'utf8'));
          console.log(`Audit totals: ${JSON.stringify(report.metadata?.vulnerabilities ?? {})}`);
          for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (finding.via ?? []).map(item => typeof item === 'string' ? item : `${item.source}:${item.title}`).join(', ');
            console.log(`${name}: severity=${finding.severity}; range=${finding.range}; via=${via}; fixAvailable=${JSON.stringify(finding.fixAvailable)}`);
          }
          NODE
          exit "$status"

  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Review dependency changes with GitHub
        id: github_dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate

      - name: Audit all locked dependencies
        run: npm audit --audit-level=moderate

      - name: Report unavailable GitHub dependency review
        if: steps.github_dependency_review.outcome == 'failure'
        shell: bash
        run: echo '::warning::GitHub change-level dependency review is unavailable because Dependency Graph is disabled. The blocking npm audit covered all locked runtime and development dependencies. Enable Dependency Graph before requiring the GitHub review result.'
