name: Temporary issue 595 void-result patch

on:
  push:
    branches: [fix/595-contextual-object-callback]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/595-contextual-object-callback
          fetch-depth: 0
      - name: Apply minimal void-result projection fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/compiler/src/checker/checker.ts')
          text = path.read_text()
          old_result = "const result = resultType.kind === 'primitive' && resultType.name === 'Never' ? 'Never' as const : this.currentExternalObjectRef(type.result);"
          new_result = "const result = resultType.kind === 'primitive' && resultType.name === 'Never' ? 'Never' as const : this.currentExternalRef(type.result);"
          if text.count(old_result) != 1:
              raise SystemExit(f'expected one result projection anchor, found {text.count(old_result)}')
          text = text.replace(old_result, new_result, 1)

          anchor = "\tprivate currentExternalObjectRef(typeId: TypeId): import('../interop/types.js').ForeignTypeRef | undefined {\n"
          helper = "\tprivate currentExternalRef(typeId: TypeId): import('../interop/types.js').ForeignTypeRef | undefined {\n\t\tconst type = this.arena.get(typeId);\n\t\tif (type.kind !== 'foreign') return undefined;\n\t\tconst provider = this.currentInteropProvider(type.snapshot);\n\t\treturn provider !== undefined && this.isCurrentForeignSnapshot(type.snapshot, provider, false) ? type.ref : undefined;\n\t}\n\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one object-ref helper anchor, found {text.count(anchor)}')
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)
          PY
          rm .github/workflows/tmp-595-void-result.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/compiler/src/checker/checker.ts .github/workflows/tmp-595-void-result.yml
          git diff --cached --check
          git commit -m "fix(interop): preserve contextual callback result evidence"
          git push origin HEAD:fix/595-contextual-object-callback
