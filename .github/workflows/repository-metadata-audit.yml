name: Repository metadata audit

on:
  schedule:
    - cron: '43 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: repository-metadata-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Read-only work-item metadata audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Run metadata audit regressions
        run: node --test scripts/audit-work-item-metadata.test.mjs scripts/audit-work-item-metadata-policy.test.mjs scripts/audit-work-item-metadata-workflow.test.mjs
      - name: Audit current open Issues and PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-work-item-metadata.mjs --repository=${{ github.repository }}
