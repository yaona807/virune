name: Temporary View Repetition Withdrawal v4

on:
  push:
    branches: [fix/frontend-withdraw-view-repetition]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Apply withdrawal patch and remove stale feature tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/tmp-withdraw-view-repetition-v3.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n          rm .github/workflows/tmp-withdraw-view-repetition.yml"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('cannot locate v3 patch script exactly once')
          script = dedent(workflow.split(start, 1)[1].split(end, 1)[0])
          exec(compile(script, '<withdraw-view-repetition-v3>', 'exec'), {})

          path = Path('packages/compiler/test/frontend-preserved-jsx-emission.test.ts')
          text = path.read_text()
          start_test = "test('View repetition emits one flat compiler-owned sequence without overrideable collection helpers', () => {"
          next_test = "test('no-else conditional fails closed when an empty fragment would become an observable External child', () => {"
          if text.count(start_test) != 1 or text.count(next_test) != 1:
              raise SystemExit('stale repetition emission test boundaries are not unique')
          left, rest = text.split(start_test, 1)
          _, right = rest.split(next_test, 1)
          path.write_text(left.rstrip() + '\n\n' + next_test + right)
          PY

          rm .github/workflows/tmp-withdraw-view-repetition.yml
          rm .github/workflows/tmp-withdraw-view-repetition-v2.yml
          rm .github/workflows/tmp-withdraw-view-repetition-v3.yml
          rm .github/workflows/tmp-withdraw-view-repetition-v4.yml

          if git grep -n -E 'ViewRepetition|viewRepetition|resolveArrayElement|repetitionValues|frontend\.view-repetition|L4311|View repetition emits one flat|generated collection observable as a child' -- ':!*.lock'; then
            echo 'stale View repetition implementation/test artifact remains' >&2
            exit 1
          fi
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: TypeScript build/check
        run: npm run check
      - name: Focused frontend compiler regressions
        run: |
          node --test packages/compiler/dist/test/frontend-component-view.test.js
          node --test packages/compiler/dist/test/frontend-preserved-jsx-emission.test.js
      - name: Specification and compatibility checks
        run: |
          npm run spec:check
          npm run api:check
          npm run abi:check
      - name: Self-host frontend/parser parity
        run: |
          npm run selfhost:mvp:check
          npm run selfhost:parser:parity
      - name: Core tests
        run: npm run test:core:built
      - name: Commit validated source change
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(frontend): withdraw generic View repetition'
          git push origin HEAD:fix/frontend-withdraw-view-repetition
