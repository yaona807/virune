name: Temporary dependency audit fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chore/dependency-audit-fix-20260804
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix
      - name: Verify clean install
        run: npm ci
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
      - name: Build
        run: npm run build
      - name: Validate changed paths
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-dependency-audit-fix.yml
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort -u)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              package.json|package-lock.json|.github/workflows/tmp-dependency-audit-fix.yml) ;;
              *) echo "Unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          if ! git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          echo "npm audit fix produced no dependency changes" >&2
          exit 1
      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(deps): resolve dependency audit findings"
          git push origin HEAD:chore/dependency-audit-fix-20260804
