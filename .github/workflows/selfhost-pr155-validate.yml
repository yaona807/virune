name: Selfhost PR155 focused validation

on:
  push:
    branches:
      - selfhost/local-must-use-analysis
    paths:
      - .github/workflows/selfhost-pr155-validate.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/selfhost-pr155-validate.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfhost/local-must-use-analysis
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build repository
        run: npm run build
      - name: Run focused must-use test
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-must-use.test.js
      - name: Run semantic regression tests
        run: |
          node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-semantic-data-types.test.js
          node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-generic-instantiation.test.js
          node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-type-operations.test.js
          node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-symbol-scope.test.js
          node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-pattern-coverage.test.js
      - name: Remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/selfhost-pr155-validate.yml
          git commit -m "ci: remove temporary PR155 validation workflow"
          git push origin HEAD:selfhost/local-must-use-analysis
