name: Patch 616 structural-scope narrowing

on:
  push:
    branches:
      - fix/616-block-lambda-newlines
    paths:
      - .github/patch-616-narrow.py
      - .github/workflows/patch-616-narrow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/616-block-lambda-newlines
          fetch-depth: 0
      - name: Narrow lambda-scope scan
        run: python3 .github/patch-616-narrow.py
      - name: Commit narrowing and remove bootstrap files
        run: |
          rm .github/patch-616-narrow.py .github/workflows/patch-616-narrow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/compiler/src/syntax/tokens.ts selfhost/mvp/src/frontend-lexer.virune .github/patch-616-narrow.py .github/workflows/patch-616-narrow.yml
          git diff --cached --check
          git commit -m "fix(parser): limit lambda newline scan to structural scopes"
          git push origin HEAD:fix/616-block-lambda-newlines
