name: Publish v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.0.yml'

permissions:
  actions: read
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write

env:
  TAG: v1.0.0
  TARGET_SHA: dcaf89b2f557fde38cdfd9bceb7d23af3ba8ed51

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dcaf89b2f557fde38cdfd9bceb7d23af3ba8ed51
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verify release identity
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$version" = "1.0.0"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
      - name: Install dependencies
        run: npm ci
      - name: Execute stable release gate for the verified commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          env \
            GITHUB_SHA="$TARGET_SHA" \
            GITHUB_REF="refs/tags/$TAG" \
            GITHUB_REF_TYPE="tag" \
            GITHUB_REF_NAME="$TAG" \
            npm run release:gate
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ env.TAG }}
          path: |
            .cache/release/release-evidence.json
            .cache/reproducible-release/
            release/
          if-no-files-found: error
          retention-days: 90
      - name: Attest release build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release/*
      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release/*
          sbom-path: release/SBOM.cdx.json
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            test "$existing" = "$TARGET_SHA" || {
              echo "Tag $TAG already points to $existing, expected $TARGET_SHA" >&2
              exit 1
            }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$TARGET_SHA" >/dev/null
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh release create "$TAG" release/* --generate-notes --verify-tag
      - name: Remove source branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/ops/publish-v1.0.0" || true
