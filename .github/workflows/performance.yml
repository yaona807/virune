name: Performance

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify performance impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      formal_required: ${{ steps.changes.outputs.formal_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/classify-formal-ci-changes.mjs --lane performance --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node scripts/classify-formal-ci-changes.mjs --lane performance --force-full
          fi

  benchmark:
    name: LSP and JS Interop regression
    needs: classify
    if: needs.classify.outputs.formal_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check project references
        run: npm run check

      - name: Test performance regression policy
        run: npm run test:performance-regression

      - name: Run LSP completion benchmark
        run: npm run benchmark:lsp:built -- --runs=5 --output=.cache/performance/lsp.json

      - name: Run JS Interop heap benchmark
        run: npm run benchmark:interop-heap:built -- --output=.cache/performance/interop.json

      - name: Check performance regression thresholds
        run: npm run check:performance -- --baseline=benchmarks/performance/baseline.json --lsp=.cache/performance/lsp.json --interop=.cache/performance/interop.json --output=.cache/performance/comparison.json

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-node-24
          path: .cache/performance/
          if-no-files-found: warn
          retention-days: 30

  required-performance-gate:
    name: Required performance gate
    needs: [classify, benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Require reviewed performance disposition
        env:
          FORMAL_REQUIRED: ${{ needs.classify.outputs.formal_required }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: >-
          node scripts/verify-formal-ci-gate.mjs
          --kind optional
          --label performance
          --required "$FORMAL_REQUIRED"
          --classify-result "$CLASSIFY_RESULT"
          --upstream-result "$BENCHMARK_RESULT"
