name: Void-or-callable union focused validation

on:
  push:
    branches:
      - fix/interop-void-callable-result-union
    paths:
      - .github/workflows/void-callable-union-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interop-void-callable-result-union
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify expected parent
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "fa07b6a8f4bfc86b1202681b6c7b5ae53c084f64"
      - run: npm ci
      - name: Apply finite contextual union proof and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          provider = Path('packages/js-interop/src/index.ts')
          text = provider.read_text()
          old = """function contextualNestedPrimitiveCallable(
          \ttype: ts.Type,
          \tchecker: ts.TypeChecker,
          \tlocation: ts.Node,
          \tcallable: Extract<NativeCallableTypeTemplate['result'], { readonly kind: 'callable' }>['callable'],
          ): Extract<ContextualCallableResult, { readonly kind: 'callable' }>['callable'] | undefined {
          \tconst signatures = type.getCallSignatures();
          \tif (signatures.length !== 1 || type.getConstructSignatures().length !== 0) return undefined;
          """
          new = """function contextualNestedPrimitiveCallable(
          \ttype: ts.Type,
          \tchecker: ts.TypeChecker,
          \tlocation: ts.Node,
          \tcallable: Extract<NativeCallableTypeTemplate['result'], { readonly kind: 'callable' }>['callable'],
          ): Extract<ContextualCallableResult, { readonly kind: 'callable' }>['callable'] | undefined {
          \tlet callableType = type;
          \tif (type.isUnion()) {
          \t\tlet candidate: ts.Type | undefined;
          \t\tfor (const branch of type.types) {
          \t\t\tconst flags = branch.getFlags();
          \t\t\tif ((flags & (ts.TypeFlags.Void | ts.TypeFlags.Undefined)) !== 0) continue;
          \t\t\tif (candidate !== undefined) return undefined;
          \t\t\tcandidate = branch;
          \t\t}
          \t\tif (candidate === undefined) return undefined;
          \t\tcallableType = candidate;
          \t}
          \tconst signatures = callableType.getCallSignatures();
          \tif (signatures.length !== 1 || callableType.getConstructSignatures().length !== 0) return undefined;
          """
          old = ''.join(line.removeprefix('          ') for line in old.splitlines(True))
          new = ''.join(line.removeprefix('          ') for line in new.splitlines(True))
          if text.count(old) != 1:
              raise SystemExit('unexpected contextualNestedPrimitiveCallable shape')
          provider.write_text(text.replace(old, new, 1))

          test = Path('packages/js-interop/test/callable-boundary-regressions.test.ts')
          text = test.read_text()
          anchor = "});\ntest('contextual object V3 requires latent cleanup effects'"
          if text.count(anchor) != 1:
              raise SystemExit('unexpected returned-callable regression anchor')
          block = base64.b64decode('').decode()
          text = text.replace(anchor, '});\n\n' + block + "\n\ntest('contextual object V3 requires latent cleanup effects'", 1)
          test.write_text(text)
          PY
      - name: Build
        run: npm run build
      - name: Focused returned-callable regressions
        run: node --test packages/js-interop/dist/test/callable-boundary-regressions.test.js
      - name: Preserve sync-or-promise result-union regressions
        run: node --test packages/js-interop/dist/test/generic-sync-or-promise-callable.test.js
      - name: API check
        run: npm run api:check
      - name: ABI check
        run: npm run abi:check
      - name: Diff check
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "packages/js-interop/src/index.ts packages/js-interop/test/callable-boundary-regressions.test.ts "
      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/void-callable-union-fix.yml
          git add -A
          git commit -m "fix(interop): prove void-or-callable cleanup unions"
          git push origin HEAD:fix/interop-void-callable-result-union
