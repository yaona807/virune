name: Browser conformance

on:
  schedule:
    - cron: '43 4 * * 2'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify browser conformance impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      formal_required: ${{ steps.changes.outputs.formal_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/classify-formal-ci-changes.mjs --lane browser-conformance --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node scripts/classify-formal-ci-changes.mjs --lane browser-conformance --force-full
          fi

  browser:
    name: ${{ matrix.engine }}
    needs: classify
    if: needs.classify.outputs.formal_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: Run browser runtime conformance
        run: npm run test:browser-conformance:built
        env:
          VIRUNE_BROWSER_ENGINE: ${{ matrix.engine }}
          VIRUNE_PLAYWRIGHT_MANAGED: 'true'
          VIRUNE_BROWSER_ARTIFACT_DIR: .cache/browser/${{ matrix.engine }}
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-conformance-${{ matrix.engine }}
          path: .cache/browser/${{ matrix.engine }}
          if-no-files-found: warn
          retention-days: 30

  required-browser-conformance-gate:
    name: Required browser conformance gate
    needs: [classify, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require reviewed browser conformance disposition
        shell: bash
        env:
          FORMAL_REQUIRED: ${{ needs.classify.outputs.formal_required }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "::error::Browser conformance classification concluded with $CLASSIFY_RESULT."
            exit 1
          fi
          case "$FORMAL_REQUIRED" in
            true)
              if [[ "$BROWSER_RESULT" != "success" ]]; then
                echo "::error::Required browser conformance concluded with $BROWSER_RESULT."
                exit 1
              fi
              echo 'Required browser conformance passed.'
              ;;
            false)
              if [[ "$BROWSER_RESULT" != "skipped" ]]; then
                echo "::error::Not-required browser conformance concluded with unexpected result $BROWSER_RESULT."
                exit 1
              fi
              echo 'Browser conformance is explicitly not required for these reviewed changes.'
              ;;
            *)
              echo "::error::Invalid formal_required output: $FORMAL_REQUIRED."
              exit 1
              ;;
          esac
