name: Returned native callable branch edit v2

on:
  push:
    branches:
      - feat/interop-returned-native-callable
    paths:
      - .github/workflows/returned-native-callable-branch-edit-v2.yml

permissions:
  contents: write

jobs:
  edit-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interop-returned-native-callable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Replay focused implementation and narrow callable result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/returned-native-callable-branch-edit.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<returned-native-callable-edit>', 'exec'), {})

          checker = Path('packages/compiler/src/checker/checker.ts')
          text = checker.read_text()
          old = "\t\tif (result.kind === 'external') return false;\n\t\tif (result.kind === 'void') return !boundary.async && boundary.result === 'Unit';"
          new = "\t\tif (result.kind === 'external' || result.kind === 'callable') return false;\n\t\tif (result.kind === 'void') return !boundary.async && boundary.result === 'Unit';"
          if text.count(old) != 1:
              raise SystemExit(f'checker narrowing anchor count={text.count(old)}')
          checker.write_text(text.replace(old, new))
          PY
      - name: Build
        run: npm run build
      - name: Focused callable regressions
        run: node --test packages/js-interop/dist/test/callable-boundary-regressions.test.js
      - name: API check
        run: npm run api:check
      - name: ABI check
        run: npm run abi:check
      - name: Diff check
        run: git diff --check
      - name: Commit validated implementation and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/compiler/src/interop/types.ts packages/compiler/src/interop/operation.ts packages/compiler/src/checker/checker.ts packages/compiler/src/codegen/emitter.ts packages/js-interop/src/index.ts packages/js-interop/test/callable-boundary-regressions.test.ts
          git rm .github/workflows/returned-native-callable-branch-edit.yml .github/workflows/returned-native-callable-branch-edit-v2.yml
          git commit -m 'feat(interop): project one-level returned native callables'
          git push origin HEAD:feat/interop-returned-native-callable
