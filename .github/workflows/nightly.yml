name: Nightly quality suites

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nightly.yml'
      - 'package.json'
      - 'packages/**'
      - 'integration/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:fuzz:long
        env:
          VIRUNE_FUZZ_DURATION_MS: 900000
          VIRUNE_FUZZ_SHARD: ${{ matrix.shard }}
          VIRUNE_FUZZ_ARTIFACT_DIR: fuzz-regressions/artifacts/shard-${{ matrix.shard }}
      - name: Upload fuzz regressions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-regressions-${{ matrix.shard }}
          path: fuzz-regressions/artifacts/shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 30

  binding-corpus:
    name: Binding corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:binding-corpus
        env:
          VIRUNE_BINDING_CORPUS_REPORT: .cache/binding-corpus/report.current.json
      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binding-corpus-diagnostics
          path: |
            .cache/binding-corpus/report.current.json
            .cache/binding-corpus/generated/
            .cache/binding-corpus/package-lock.json
            .cache/binding-corpus/baseline-diff.json
          if-no-files-found: ignore
          retention-days: 30

  semantic-fuzz:
    name: Semantic fuzz shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:semantic-fuzz:long
        env:
          VIRUNE_SEMANTIC_FUZZ_DURATION_MS: 900000
          VIRUNE_SEMANTIC_FUZZ_BATCH_ITERATIONS: 25
          VIRUNE_SEMANTIC_FUZZ_SHARD: ${{ matrix.shard }}
          VIRUNE_SEMANTIC_FUZZ_ARTIFACT_DIR: fuzz-regressions/semantic-artifacts/shard-${{ matrix.shard }}
      - name: Upload semantic fuzz regressions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semantic-fuzz-regressions-${{ matrix.shard }}
          path: fuzz-regressions/semantic-artifacts/shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 30

  reproducible-release:
    name: Reproducible release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Build the release independently twice and compare outputs
        run: npm run verify:reproducible-release
        env:
          SOURCE_DATE_EPOCH: '0'
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducible-release-evidence
          path: .cache/reproducible-release/
          if-no-files-found: error
          retention-days: 30

  selfhost-stage0-evidence:
    name: Self-host Stage 0 / fixed-point shadow evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Host and compiler packages
        run: npm run build
      - name: Execute the Stage 0 compiler candidate
        run: >-
          node scripts/run-selfhost-nightly-shadow.mjs
          --candidate-sha=${{ github.sha }}
          --run-id=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Execute fixed-Seed Stage 1 -> Stage 2 transition and Stage 2 -> Stage 3 fixed-point shadow
        if: always()
        run: >-
          node scripts/run-selfhost-fixed-seed-bootstrap.mjs
          --output=.cache/selfhost-nightly-shadow/fixed-seed-bootstrap.json
          --temporary-root=.cache/selfhost-nightly-shadow/fixed-seed-bootstrap
      - name: Build the Self-host MVP
        if: always()
        run: npm run selfhost:mvp:build
      - name: Run the MVP differential suite
        if: always()
        run: >-
          node scripts/run-selfhost-mvp-differential.mjs
          --output=.cache/selfhost-nightly-shadow/differential
      - name: Run the Project Compiler differential suite
        if: always()
        continue-on-error: true
        run: >-
          node scripts/run-selfhost-project-differential.mjs
          --output=.cache/selfhost-nightly-shadow/project-differential
      - name: Upload non-promotable self-host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selfhost-stage0-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/selfhost-nightly-shadow/
          if-no-files-found: warn
          retention-days: 30
