name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      selfhost_inventory_required: ${{ steps.changes.outputs.selfhost_inventory_required }}
      changed_count: ${{ steps.changes.outputs.changed_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Select the required gate
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/classify-ci-changes.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node scripts/classify-ci-changes.mjs --force-full
          fi

  metadata:
    name: Metadata and policy
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VIRUNE_CI_JOB: metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Verify metadata, policy and specifications
        run: node scripts/run-ci-command.mjs --id metadata -- npm run verify:metadata
      - name: Verify unit-test lane selection
        run: node --test scripts/run-unit-tests.test.mjs
      - name: Build documentation examples
        if: needs.classify.outputs.docs_only == 'true'
        run: node scripts/run-ci-command.mjs --id docs-build -- npm run check
      - name: Verify documentation example policy
        if: needs.classify.outputs.docs_only == 'true'
        run: node scripts/run-ci-command.mjs --id docs-example-policy -- npm run test:docs-examples
      - name: Compile and execute documentation examples
        if: needs.classify.outputs.docs_only == 'true'
        run: node scripts/run-ci-command.mjs --id docs-examples -- npm run docs:examples:check
      - name: Write timing summary
        if: always()
        run: node scripts/write-ci-summary.mjs
      - name: Upload metadata evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-metadata-evidence-${{ github.sha }}
          path: |
            .cache/ci-timings/
            .cache/ci-failures/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Canonical build (Ubuntu 24.04 / Node.js 24)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VIRUNE_CI_JOB: build-ubuntu-node24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Build and type-check project references
        run: node scripts/run-ci-command.mjs --id build -- npm run check
      - name: Package compiled output
        run: node scripts/run-ci-command.mjs --id package-compiled-output -- bash -lc "tar -czf .cache/compiled-output.tgz packages/*/dist integration/dist"
      - name: Upload compiled output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiled-node-24-${{ github.sha }}
          path: .cache/compiled-output.tgz
          if-no-files-found: error
          retention-days: 2
      - name: Write timing summary
        if: always()
        run: node scripts/write-ci-summary.mjs
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-evidence-build-ubuntu-node24
          path: |
            .cache/ci-timings/
            .cache/ci-failures/
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Core tests (Ubuntu 24.04 / Node.js 24)
    needs: [classify, build]
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VIRUNE_CI_JOB: core-tests-ubuntu-node24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compiled-node-24-${{ github.sha }}
          path: .cache
      - name: Restore compiled output
        run: node scripts/run-ci-command.mjs --id restore-compiled-output -- tar -xzf .cache/compiled-output.tgz -C .
      - name: Run platform-independent unit and integration tests
        run: node scripts/run-ci-command.mjs --id core-tests -- npm run test:core:built -- --failure-output-only --exclude-selfhost-inventory
        env:
          VIRUNE_TEST_ROLE: full
      - name: Write timing summary
        if: always()
        run: node scripts/write-ci-summary.mjs
      - name: Upload core-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-evidence-core-tests-ubuntu-node24
          path: |
            .cache/unit-test-failure.log
            .cache/ci-timings/
            .cache/ci-failures/
          if-no-files-found: warn
          retention-days: 14

  selfhost-inventory:
    name: Self-host full-language inventory (Ubuntu 24.04 / Node.js 24)
    needs: [classify, build]
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VIRUNE_CI_JOB: selfhost-inventory-ubuntu-node24
    steps:
      - name: Validate inventory decision
        shell: bash
        env:
          SELFHOST_INVENTORY_REQUIRED: ${{ needs.classify.outputs.selfhost_inventory_required }}
        run: |
          case "$SELFHOST_INVENTORY_REQUIRED" in
            true|false) ;;
            *)
              echo "Invalid selfhost_inventory_required output: $SELFHOST_INVENTORY_REQUIRED" >&2
              exit 1
              ;;
          esac
      - name: Record inventory omission
        if: needs.classify.outputs.selfhost_inventory_required == 'false'
        run: echo "Full-language inventory omitted because no inventory-impacting paths changed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.classify.outputs.selfhost_inventory_required == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.classify.outputs.selfhost_inventory_required == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: needs.classify.outputs.selfhost_inventory_required == 'true'
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Download compiled output
        if: needs.classify.outputs.selfhost_inventory_required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compiled-node-24-${{ github.sha }}
          path: .cache
      - name: Restore compiled output
        if: needs.classify.outputs.selfhost_inventory_required == 'true'
        run: node scripts/run-ci-command.mjs --id restore-compiled-output -- tar -xzf .cache/compiled-output.tgz -C .
      - name: Run full-language inventory
        if: needs.classify.outputs.selfhost_inventory_required == 'true'
        run: >-
          node scripts/run-ci-command.mjs --id selfhost-full-language-inventory --
          node scripts/run-unit-tests.mjs
          --file=packages/compiler/dist/test/selfhost-full-language-inventory.test.js
          --failure-output-only
      - name: Write timing summary
        if: always() && needs.classify.outputs.selfhost_inventory_required == 'true'
        run: node scripts/write-ci-summary.mjs
      - name: Upload self-host inventory evidence
        if: always() && needs.classify.outputs.selfhost_inventory_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-evidence-selfhost-inventory-ubuntu-node24-${{ github.sha }}
          path: |
            .cache/unit-test-failure.log
            .cache/ci-timings/selfhost-full-language-inventory.json
            .cache/ci-timings/
            .cache/ci-failures/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Compiler quality gates (Ubuntu 24.04 / Node.js 24)
    needs: [classify, build]
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VIRUNE_CI_JOB: quality-ubuntu-node24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compiled-node-24-${{ github.sha }}
          path: .cache
      - name: Restore compiled output
        run: node scripts/run-ci-command.mjs --id restore-compiled-output -- tar -xzf .cache/compiled-output.tgz -C .
      - name: Verify TypeScript binding corpus
        run: node scripts/run-ci-command.mjs --id binding-corpus -- npm run test:binding-corpus:built
        env:
          VIRUNE_BINDING_CORPUS_REPORT: .cache/binding-corpus/report.current.json
      - name: Run fuzz smoke suite
        run: node scripts/run-ci-command.mjs --id fuzz-smoke -- npm run test:fuzz:smoke:built
        env:
          VIRUNE_FUZZ_DURATION_MS: 2000
          VIRUNE_FUZZ_ARTIFACT_DIR: fuzz-regressions/artifacts/smoke
      - name: Run semantic differential fuzz policy
        run: node scripts/run-ci-command.mjs --id semantic-fuzz-policy -- npm run test:semantic-fuzz-policy
      - name: Run semantic differential fuzz smoke
        run: node scripts/run-ci-command.mjs --id semantic-fuzz-smoke -- npm run test:semantic-fuzz:smoke:built
        env:
          VIRUNE_SEMANTIC_FUZZ_DURATION_MS: 4000
          VIRUNE_SEMANTIC_FUZZ_ARTIFACT_DIR: fuzz-regressions/semantic-artifacts/smoke
      - name: Verify VS Code extension and language server
        run: node scripts/run-ci-command.mjs --id vscode-and-lsp -- npm run test:vscode:built
      - name: Run conformance suite
        run: node scripts/run-ci-command.mjs --id conformance -- npm run test:conformance:built
      - name: Verify formatter output
        run: node scripts/run-ci-command.mjs --id formatter -- npm run fmt:check:built
      - name: Run source clone smoke test
        run: node scripts/run-ci-command.mjs --id clone-smoke -- npm run smoke:clone:built
      - name: Write timing summary
        if: always()
        run: node scripts/write-ci-summary.mjs
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-evidence-quality-ubuntu-node24
          path: |
            .cache/binding-corpus/report.current.json
            .cache/binding-corpus/baseline-diff.json
            .cache/semantic-fuzz-smoke.json
            .cache/ci-timings/
            .cache/ci-failures/
            fuzz-regressions/artifacts/smoke/
            fuzz-regressions/semantic-artifacts/smoke/
          if-no-files-found: warn
          retention-days: 14

  semantic-fuzz:
    name: Semantic fuzz shard ${{ matrix.shard }} (pull request)
    needs: [classify, build]
    if: github.event_name == 'pull_request' && needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      VIRUNE_CI_JOB: semantic-fuzz-pr-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compiled-node-24-${{ github.sha }}
          path: .cache
      - name: Restore compiled output
        run: node scripts/run-ci-command.mjs --id restore-compiled-output -- tar -xzf .cache/compiled-output.tgz -C .
      - name: Run bounded semantic differential fuzz shard
        run: node scripts/run-ci-command.mjs --id semantic-fuzz-long-${{ matrix.shard }} -- node scripts/semantic-fuzz-long.mjs
        env:
          VIRUNE_SEMANTIC_FUZZ_DURATION_MS: 120000
          VIRUNE_SEMANTIC_FUZZ_BATCH_ITERATIONS: 25
          VIRUNE_SEMANTIC_FUZZ_SHARD: ${{ matrix.shard }}
          VIRUNE_SEMANTIC_FUZZ_ARTIFACT_DIR: fuzz-regressions/semantic-artifacts/pr-shard-${{ matrix.shard }}
      - name: Write timing summary
        if: always()
        run: node scripts/write-ci-summary.mjs
      - name: Upload semantic fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semantic-fuzz-pr-${{ matrix.shard }}-${{ github.sha }}
          path: |
            .cache/ci-timings/
            .cache/ci-failures/
            fuzz-regressions/semantic-artifacts/pr-shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Core (${{ matrix.label }})
    needs: [classify, build]
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-2022-node-24
            label: Windows Server 2022 / Node.js 24
            os: windows-2022
            node: 24
            experimental: false
          - id: windows-2025-node-24
            label: Windows Server 2025 / Node.js 24
            os: windows-2025
            node: 24
            experimental: true
          - id: macos-14-node-24
            label: macOS 14 / Node.js 24
            os: macos-14
            node: 24
            experimental: false
          - id: ubuntu-24.04-node-26
            label: Ubuntu 24.04 / Node.js 26
            os: ubuntu-24.04
            node: 26
            experimental: false
    env:
      VIRUNE_CI_JOB: compatibility-${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install platform dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compiled-node-24-${{ github.sha }}
          path: .cache
      - name: Restore compiled output
        run: node scripts/run-ci-command.mjs --id restore-compiled-output -- tar -xzf .cache/compiled-output.tgz -C .
      - name: Run platform-sensitive CLI and filesystem smoke tests
        run: node scripts/run-ci-command.mjs --id platform-smoke -- npm run test:platform-smoke:built
      - name: Verify VS Code extension and language server
        run: node scripts/run-ci-command.mjs --id vscode-and-lsp -- npm run test:vscode:built
      - name: Run conformance path smoke
        run: node scripts/run-ci-command.mjs --id conformance -- npm run test:conformance:built
      - name: Run clone and process smoke
        run: node scripts/run-ci-command.mjs --id clone-smoke -- npm run smoke:clone:built
      - name: Write timing summary
        if: always()
        run: node scripts/write-ci-summary.mjs
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-evidence-${{ matrix.id }}
          path: |
            .cache/ci-timings/
            .cache/ci-failures/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Browser runtime (Ubuntu 24.04 / Node.js 24)
    needs: [classify, build]
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VIRUNE_CI_JOB: browser-ubuntu-node24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compiled-node-24-${{ github.sha }}
          path: .cache
      - name: Restore compiled output
        run: node scripts/run-ci-command.mjs --id restore-compiled-output -- tar -xzf .cache/compiled-output.tgz -C .
      - name: Execute emitted ESM in Chromium
        run: node scripts/run-ci-command.mjs --id browser-runtime -- npm run test:integration:browser:built
      - name: Write timing summary
        if: always()
        run: node scripts/write-ci-summary.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-evidence-browser-ubuntu-node24
          path: |
            .cache/ci-timings/
            .cache/ci-failures/
          if-no-files-found: warn
          retention-days: 14

  release-artifacts:
    name: Release artifacts
    needs: [classify, metadata, build, verify, selfhost-inventory, quality, semantic-fuzz, compatibility, browser]
    if: >-
      always() &&
      needs.classify.outputs.docs_only != 'true' &&
      needs.metadata.result == 'success' &&
      needs.build.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.selfhost-inventory.result == 'success' &&
      needs.quality.result == 'success' &&
      (
        needs.semantic-fuzz.result == 'success' ||
        (github.event_name != 'pull_request' && needs.semantic-fuzz.result == 'skipped')
      ) &&
      needs.compatibility.result == 'success' &&
      needs.browser.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VIRUNE_CI_JOB: release-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install release dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Package and verify release artifacts
        run: node scripts/run-ci-command.mjs --id verify-release -- npm run verify:release
      - name: Write timing summary
        if: always()
        run: node scripts/write-ci-summary.mjs
      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            release/
            .cache/ci-timings/
            .cache/ci-failures/
          if-no-files-found: error
          retention-days: 30
