name: License lock refresh

on:
  push:
    branches: [docs/383-apache-2-license-transition]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Preserve original lock metadata
        run: cp package-lock.json "$RUNNER_TEMP/package-lock.before.json"
      - name: Regenerate lock metadata from manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove only Virune-owned license metadata changed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const before = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/package-lock.before.json', 'utf8'));
          const after = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const paths = ['', 'packages/cli', 'packages/compiler', 'packages/formatter', 'packages/js-interop', 'packages/language-server', 'packages/runtime', 'packages/stdlib', 'packages/vscode'];

          for (const path of paths) {
            assert.equal(before.packages[path]?.license, 'MIT', `${path || '<root>'}: expected previous MIT license`);
            assert.equal(after.packages[path]?.license, 'Apache-2.0', `${path || '<root>'}: expected Apache-2.0 license`);
          }

          const normalizedAfter = structuredClone(after);
          for (const path of paths) normalizedAfter.packages[path].license = before.packages[path].license;
          assert.deepEqual(normalizedAfter, before, 'npm changed lock metadata beyond the nine Virune-owned license fields');
          NODE
      - name: Commit canonical lock metadata and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git rm .github/workflows/license-lock-refresh.yml
          git add package-lock.json
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/license-lock-refresh.yml\npackage-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): sync Apache-2.0 lock metadata'
          git push origin HEAD:"$GITHUB_REF_NAME"
