name: Temporary locked dependency update

on:
  push:
    branches: [build/update-fast-uri-lock]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: build/update-fast-uri-lock
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Update locked dependency and validate
        shell: bash
        run: |
          set -euo pipefail
          npm update fast-uri --package-lock-only --ignore-scripts
          npm --prefix corpus/bindings update fast-uri --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=moderate
          git diff --check
          rm .github/workflows/tmp-fast-uri-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json corpus/bindings/package-lock.json .github/workflows/tmp-fast-uri-lock.yml
          git diff --cached --check
          git commit -m "build(deps): refresh fast-uri lock entries"
          git push origin HEAD:build/update-fast-uri-lock
