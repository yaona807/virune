name: Workflow validation probe SHA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: Validate pinned action scheduling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout with full SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Confirm pinned action
        run: echo 'Pinned action scheduling succeeded.'
