name: Implement self-host generic instantiation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.head_ref == 'agent/selfhost-generic-instantiation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-generic-instantiation
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Extend the semantic checker
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'selfhost/mvp/src/frontend-semantic.virune';
          let source = await readFile(path, 'utf8');

          source = source.replace(
            '\tSemanticDiagnostic,\n\tSemanticMember,\n\tSemanticSpan,\n\tSemanticType,',
            '\tSemanticDiagnostic,\n\tSemanticInstantiation,\n\tSemanticInstantiatedMember,\n\tSemanticMember,\n\tSemanticSpan,\n\tSemanticType,',
          );

          source = source.replace(/record SemanticState \{[\s\S]*?\n\}/, `record SemanticState {
          \tdeclarations: List<SemanticDeclaration>
          \tmembers: List<SemanticMember>
          \ttypes: List<SemanticType>
          \tinstantiations: List<SemanticInstantiation>
          \tinstantiatedMembers: List<SemanticInstantiatedMember>
          \tdiagnostics: List<SemanticDiagnostic>
          }`);

          const stateStart = source.indexOf('fn stateWith(');
          const stateEnd = source.indexOf('fn addDiagnostic(', stateStart);
          if (stateStart < 0 || stateEnd < 0) throw new Error('Semantic state helper region is missing');
          const stateHelpers = `fn fallbackType() -> SemanticType {
          \treturn SemanticType {
          \t\tid: -1,
          \t\tkind: "missing",
          \t\tname: "",
          \t\tdeclarationId: None,
          \t\targuments: [],
          \t\tinstantiationId: None,
          \t\tspan: toSemanticSpan(fallbackSpan()),
          \t}
          }

          fn fallbackMember() -> SemanticMember {
          \treturn SemanticMember {
          \t\tid: -1,
          \t\tdeclarationId: -1,
          \t\tkind: "missing",
          \t\tname: "",
          \t\ttypeIds: [],
          \t\tspan: toSemanticSpan(fallbackSpan()),
          \t}
          }

          fn fallbackInstantiation() -> SemanticInstantiation {
          \treturn SemanticInstantiation {
          \t\tid: -1,
          \t\tdeclarationId: -1,
          \t\targumentTypeIds: [],
          \t\tmemberIds: [],
          \t\ttargetType: None,
          \t\tspan: toSemanticSpan(fallbackSpan()),
          \t}
          }

          fn typeAt(types: List<SemanticType>, index: Int) -> SemanticType {
          \treturn match List.get(types, index) {
          \t\tSome(value) => value
          \t\tNone => fallbackType()
          \t}
          }

          fn memberAt(members: List<SemanticMember>, index: Int) -> SemanticMember {
          \treturn match List.get(members, index) {
          \t\tSome(value) => value
          \t\tNone => fallbackMember()
          \t}
          }

          fn instantiationAt(values: List<SemanticInstantiation>, index: Int) -> SemanticInstantiation {
          \treturn match List.get(values, index) {
          \t\tSome(value) => value
          \t\tNone => fallbackInstantiation()
          \t}
          }

          fn stateWith(
          \tdeclarations: List<SemanticDeclaration>,
          \tmembers: List<SemanticMember>,
          \ttypes: List<SemanticType>,
          \tinstantiations: List<SemanticInstantiation>,
          \tinstantiatedMembers: List<SemanticInstantiatedMember>,
          \tdiagnostics: List<SemanticDiagnostic>,
          ) -> SemanticState {
          \treturn SemanticState {
          \t\tdeclarations: declarations,
          \t\tmembers: members,
          \t\ttypes: types,
          \t\tinstantiations: instantiations,
          \t\tinstantiatedMembers: instantiatedMembers,
          \t\tdiagnostics: diagnostics,
          \t}
          }

          fn withDeclarations(state: SemanticState, values: List<SemanticDeclaration>) -> SemanticState {
          \treturn stateWith(values, state.members, state.types, state.instantiations, state.instantiatedMembers, state.diagnostics)
          }

          fn withMembers(state: SemanticState, values: List<SemanticMember>) -> SemanticState {
          \treturn stateWith(state.declarations, values, state.types, state.instantiations, state.instantiatedMembers, state.diagnostics)
          }

          fn withTypes(state: SemanticState, values: List<SemanticType>) -> SemanticState {
          \treturn stateWith(state.declarations, state.members, values, state.instantiations, state.instantiatedMembers, state.diagnostics)
          }

          fn withInstantiations(state: SemanticState, values: List<SemanticInstantiation>) -> SemanticState {
          \treturn stateWith(state.declarations, state.members, state.types, values, state.instantiatedMembers, state.diagnostics)
          }

          fn withInstantiatedMembers(state: SemanticState, values: List<SemanticInstantiatedMember>) -> SemanticState {
          \treturn stateWith(state.declarations, state.members, state.types, state.instantiations, values, state.diagnostics)
          }

          fn withDiagnostics(state: SemanticState, values: List<SemanticDiagnostic>) -> SemanticState {
          \treturn stateWith(state.declarations, state.members, state.types, state.instantiations, state.instantiatedMembers, values)
          }

          `;
          source = source.slice(0, stateStart) + stateHelpers + source.slice(stateEnd);
          source = source.replace('stateWith([], [], [], [])', 'stateWith([], [], [], [], [], [])');
          source = source.replace(
            '\t\targuments: typeArguments,\n\t\tspan: toSemanticSpan(span),',
            '\t\targuments: typeArguments,\n\t\tinstantiationId: None,\n\t\tspan: toSemanticSpan(span),',
          );

          const genericFunctions = `fn semanticArenaDiagnostic(
          \tcode: String,
          \tmessage: String,
          \tspan: SemanticSpan,
          \thelp: String?,
          ) -> SemanticDiagnostic {
          \treturn SemanticDiagnostic {
          \t\tcode: code,
          \t\tseverity: "error",
          \t\tmessage: message,
          \t\tspan: span,
          \t\thelp: help,
          \t}
          }

          fn intListsEqual(left: List<Int>, right: List<Int>) -> Bool {
          \tif List.length(left) != List.length(right) {
          \t\treturn false
          \t}
          \tlet mut index = 0
          \twhile index < List.length(left) {
          \t\tlet leftValue = match List.get(left, index) { Some(value) => value, None => -1 }
          \t\tlet rightValue = match List.get(right, index) { Some(value) => value, None => -2 }
          \t\tif leftValue != rightValue {
          \t\t\treturn false
          \t\t}
          \t\tindex = index + 1
          \t}
          \treturn true
          }

          fn nameIndex(values: List<String>, name: String) -> Int {
          \tlet mut index = 0
          \twhile index < List.length(values) {
          \t\tlet value = match List.get(values, index) { Some(item) => item, None => "" }
          \t\tif value == name {
          \t\t\treturn index
          \t\t}
          \t\tindex = index + 1
          \t}
          \treturn -1
          }

          fn replaceType(state: SemanticState, replacement: SemanticType) -> SemanticState {
          \tlet mut values: List<SemanticType> = []
          \tfor value in state.types {
          \t\tvalues = List.append(values, if value.id == replacement.id then replacement else value)
          \t}
          \treturn withTypes(state, values)
          }

          fn replaceInstantiation(state: SemanticState, replacement: SemanticInstantiation) -> SemanticState {
          \tlet mut values: List<SemanticInstantiation> = []
          \tfor value in state.instantiations {
          \t\tvalues = List.append(values, if value.id == replacement.id then replacement else value)
          \t}
          \treturn withInstantiations(state, values)
          }

          fn instantiationIndex(state: SemanticState, declarationId: Int, typeArguments: List<Int>) -> Int {
          \tlet mut index = 0
          \twhile index < List.length(state.instantiations) {
          \t\tlet value = instantiationAt(state.instantiations, index)
          \t\tif value.declarationId == declarationId && intListsEqual(value.argumentTypeIds, typeArguments) {
          \t\t\treturn index
          \t\t}
          \t\tindex = index + 1
          \t}
          \treturn -1
          }

          fn attachInstantiationToType(state: SemanticState, typeId: Int, instantiationId: Int) -> SemanticState {
          \tlet value = typeAt(state.types, typeId)
          \treturn replaceType(state, SemanticType {
          \t\tid: value.id,
          \t\tkind: value.kind,
          \t\tname: value.name,
          \t\tdeclarationId: value.declarationId,
          \t\targuments: value.arguments,
          \t\tinstantiationId: Some(instantiationId),
          \t\tspan: value.span,
          \t})
          }

          fn substituteType(
          \tsourceTypeId: Int,
          \tdeclaration: SemanticDeclaration,
          \ttypeArguments: List<Int>,
          \tstateValue: SemanticState,
          ) -> ResolvedType {
          \tlet sourceType = typeAt(stateValue.types, sourceTypeId)
          \tif sourceType.kind == "type-parameter" && sourceType.declarationId == Some(declaration.id) {
          \t\tlet parameterIndex = nameIndex(declaration.typeParameters, sourceType.name)
          \t\tif parameterIndex >= 0 {
          \t\t\tlet replacement = match List.get(typeArguments, parameterIndex) { Some(value) => value, None => sourceTypeId }
          \t\t\treturn ResolvedType { state: stateValue, id: replacement }
          \t\t}
          \t}
          \tlet mut state = stateValue
          \tlet mut substitutedArguments: List<Int> = []
          \tfor argumentId in sourceType.arguments {
          \t\tlet resolved = substituteType(argumentId, declaration, typeArguments, state)
          \t\tstate = resolved.state
          \t\tsubstitutedArguments = List.append(substitutedArguments, resolved.id)
          \t}
          \tlet id = List.length(state.types)
          \tlet value = SemanticType {
          \t\tid: id,
          \t\tkind: sourceType.kind,
          \t\tname: sourceType.name,
          \t\tdeclarationId: sourceType.declarationId,
          \t\targuments: substitutedArguments,
          \t\tinstantiationId: None,
          \t\tspan: sourceType.span,
          \t}
          \treturn ResolvedType { state: withTypes(state, List.append(state.types, value)), id: id }
          }

          fn attachInstantiatedMember(
          \tstateValue: SemanticState,
          \tinstantiationId: Int,
          \tsourceMember: SemanticMember,
          \ttypeIds: List<Int>,
          ) -> SemanticState {
          \tlet mut state = stateValue
          \tlet id = List.length(state.instantiatedMembers)
          \tlet member = SemanticInstantiatedMember {
          \t\tid: id,
          \t\tinstantiationId: instantiationId,
          \t\tsourceMemberId: sourceMember.id,
          \t\ttypeIds: typeIds,
          \t}
          \tstate = withInstantiatedMembers(state, List.append(state.instantiatedMembers, member))
          \tlet value = instantiationAt(state.instantiations, instantiationId)
          \treturn replaceInstantiation(state, SemanticInstantiation {
          \t\tid: value.id,
          \t\tdeclarationId: value.declarationId,
          \t\targumentTypeIds: value.argumentTypeIds,
          \t\tmemberIds: List.append(value.memberIds, id),
          \t\ttargetType: value.targetType,
          \t\tspan: value.span,
          \t})
          }

          fn setInstantiationTarget(state: SemanticState, instantiationId: Int, targetType: Int) -> SemanticState {
          \tlet value = instantiationAt(state.instantiations, instantiationId)
          \treturn replaceInstantiation(state, SemanticInstantiation {
          \t\tid: value.id,
          \t\tdeclarationId: value.declarationId,
          \t\targumentTypeIds: value.argumentTypeIds,
          \t\tmemberIds: value.memberIds,
          \t\ttargetType: Some(targetType),
          \t\tspan: value.span,
          \t})
          }

          fn internInstantiation(stateValue: SemanticState, typeId: Int) -> SemanticState {
          \tlet typeValue = typeAt(stateValue.types, typeId)
          \tlet declarationId = match typeValue.declarationId { Some(value) => value, None => -1 }
          \tif declarationId < 0 {
          \t\treturn stateValue
          \t}
          \tlet existing = instantiationIndex(stateValue, declarationId, typeValue.arguments)
          \tif existing >= 0 {
          \t\treturn attachInstantiationToType(stateValue, typeId, existing)
          \t}
          \tlet declaration = declarationAt(stateValue.declarations, declarationId)
          \tlet instantiationId = List.length(stateValue.instantiations)
          \tlet placeholder = SemanticInstantiation {
          \t\tid: instantiationId,
          \t\tdeclarationId: declarationId,
          \t\targumentTypeIds: typeValue.arguments,
          \t\tmemberIds: [],
          \t\ttargetType: None,
          \t\tspan: typeValue.span,
          \t}
          \tlet mut state = withInstantiations(stateValue, List.append(stateValue.instantiations, placeholder))
          \tstate = attachInstantiationToType(state, typeId, instantiationId)
          \tfor memberId in declaration.memberIds {
          \t\tlet sourceMember = memberAt(state.members, memberId)
          \t\tlet mut substituted: List<Int> = []
          \t\tfor sourceTypeId in sourceMember.typeIds {
          \t\t\tlet resolved = substituteType(sourceTypeId, declaration, typeValue.arguments, state)
          \t\t\tstate = resolved.state
          \t\t\tsubstituted = List.append(substituted, resolved.id)
          \t\t}
          \t\tstate = attachInstantiatedMember(state, instantiationId, sourceMember, substituted)
          \t}
          \tmatch declaration.targetType {
          \t\tSome(sourceTarget) => {
          \t\t\tlet resolved = substituteType(sourceTarget, declaration, typeValue.arguments, state)
          \t\t\tstate = resolved.state
          \t\t\tstate = setInstantiationTarget(state, instantiationId, resolved.id)
          \t\t\tlet target = typeAt(state.types, resolved.id)
          \t\t\tif declaration.kind == "alias" && target.declarationId == Some(declaration.id) && intListsEqual(target.arguments, typeValue.arguments) {
          \t\t\t\tstate = addDiagnostic(state, semanticArenaDiagnostic(
          \t\t\t\t\t"L2042",
          \t\t\t\t\t"Recursive generic alias " + declaration.name,
          \t\t\t\t\ttypeValue.span,
          \t\t\t\t\tSome("Break the alias cycle with a concrete data declaration."),
          \t\t\t\t))
          \t\t\t}
          \t\t}
          \t\tNone => {}
          \t}
          \treturn state
          }

          fn containsOpenType(typeId: Int, state: SemanticState) -> Bool {
          \tlet value = typeAt(state.types, typeId)
          \tif value.kind == "type-parameter" {
          \t\treturn true
          \t}
          \tfor argumentId in value.arguments {
          \t\tif containsOpenType(argumentId, state) {
          \t\t\treturn true
          \t\t}
          \t}
          \treturn false
          }

          fn shouldInstantiate(typeId: Int, state: SemanticState) -> Bool {
          \tlet value = typeAt(state.types, typeId)
          \tif value.kind != "named" || value.instantiationId != None {
          \t\treturn false
          \t}
          \tlet declarationId = match value.declarationId { Some(item) => item, None => -1 }
          \tif declarationId < 0 {
          \t\treturn false
          \t}
          \tlet declaration = declarationAt(state.declarations, declarationId)
          \treturn List.length(declaration.typeParameters) > 0
          \t\t&& List.length(declaration.typeParameters) == List.length(value.arguments)
          \t\t&& !containsOpenType(typeId, state)
          }

          fn buildInstantiations(stateValue: SemanticState) -> SemanticState {
          \tlet mut state = stateValue
          \tlet mut index = 0
          \tlet mut steps = 0
          \twhile index < List.length(state.types) && steps < 4096 {
          \t\tif shouldInstantiate(index, state) {
          \t\t\tstate = internInstantiation(state, index)
          \t\t}
          \t\tindex = index + 1
          \t\tsteps = steps + 1
          \t}
          \tif index < List.length(state.types) {
          \t\tstate = addDiagnostic(state, semanticArenaDiagnostic(
          \t\t\t"L9001",
          \t\t\t"Generic instantiation exceeded the bounded expansion limit",
          \t\t\ttoSemanticSpan(fallbackSpan()),
          \t\t\tSome("Report the generic type graph that exceeded the self-host checker limit."),
          \t\t))
          \t}
          \treturn state
          }

          `;
          const semanticMarker = 'fn semanticAccepted(diagnostics: List<SemanticDiagnostic>) -> Bool {';
          if (!source.includes(semanticMarker)) throw new Error('Semantic instantiation insertion marker is missing');
          source = source.replace(semanticMarker, genericFunctions + semanticMarker);
          source = source.replace(
            '\t\tfor declaration in declarations {\n\t\t\tstate = processDeclaration(parsed, declaration, state)\n\t\t}\n\t}\n\treturn Ok(FrontendSemanticResult {',
            '\t\tfor declaration in declarations {\n\t\t\tstate = processDeclaration(parsed, declaration, state)\n\t\t}\n\t\tstate = buildInstantiations(state)\n\t}\n\treturn Ok(FrontendSemanticResult {',
          );
          source = source.replace(
            '\t\ttypes: state.types,\n\t\tdiagnostics: state.diagnostics,',
            '\t\ttypes: state.types,\n\t\tinstantiations: state.instantiations,\n\t\tinstantiatedMembers: state.instantiatedMembers,\n\t\tdiagnostics: state.diagnostics,',
          );
          await writeFile(path, source);

          const englishPath = 'docs/self-hosting-differential.md';
          let english = await readFile(englishPath, 'utf8');
          if (!english.includes('## Generic instantiation table')) english += '\n\n## Generic instantiation table\n\nThe second semantic slice interns local generic data type applications by declaration ID and canonical argument type IDs. Each instantiation owns substituted member type IDs or an underlying target type. A placeholder is registered before substitution so recursive records and aliases terminate deterministically. Repeated applications reuse one instantiation ID; recursive generic aliases produce `L2042` instead of expanding without bound.\n';
          await writeFile(englishPath, english);

          const japanesePath = 'docs/self-hosting-differential_ja.md';
          let japanese = await readFile(japanesePath, 'utf8');
          if (!japanese.includes('## Generic instantiation table')) japanese += '\n\n## Generic instantiation table\n\n意味論第2段階では、同一moduleのgeneric data type適用をdeclaration IDとcanonical argument type ID列でinternします。各instantiationは置換済みmember type IDまたはunderlying target typeを保持します。置換前にplaceholderを登録するためrecursive record／aliasも決定的に停止し、同一適用は1つのinstantiation IDを再利用します。Recursive generic aliasは無限展開せず`L2042`を返します。\n';
          await writeFile(japanesePath, japanese);
          NODE
      - run: npm ci
      - run: npm run build
      - name: Run generic instantiation Host tests
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-generic-instantiation.test.js
      - name: Run data type semantic regression
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-semantic-data-types.test.js
      - name: Run complete Stage 0 tests
        run: node packages/cli/dist/src/main.js test selfhost/mvp
      - run: git diff --check
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/implement-selfhost-generic-instantiation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfhost/mvp/src/frontend-semantic-model.virune selfhost/mvp/src/frontend-semantic.virune packages/compiler/test/selfhost-generic-instantiation.test.ts docs/self-hosting-differential.md docs/self-hosting-differential_ja.md .github/workflows/implement-selfhost-generic-instantiation.yml
          git commit -m "compiler(selfhost): add generic instantiation table"
          git push origin HEAD:agent/selfhost-generic-instantiation
