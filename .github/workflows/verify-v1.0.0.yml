name: Verify v1.0.0 public release

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/verify-v1.0.0-trigger'

permissions:
  attestations: read
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'ops/verify-v1.0.0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: 1.0.0
      TAG: v1.0.0
      EXPECTED_COMMIT: dcaf89b2f557fde38cdfd9bceb7d23af3ba8ed51
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dcaf89b2f557fde38cdfd9bceb7d23af3ba8ed51
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Verify release identity and download public assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf .cache/public-release
          mkdir -p .cache/public-release
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,targetCommitish,assets > /tmp/release.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const release = JSON.parse(await readFile('/tmp/release.json', 'utf8'));
          const version = process.env.VERSION;
          const tag = process.env.TAG;
          if (release.tagName !== tag) throw new Error(`Expected release tag ${tag}.`);
          if (release.isDraft !== false) throw new Error('Stable release must not be a draft.');
          if (release.isPrerelease !== false) throw new Error('Stable release must not be marked as a prerelease.');
          const required = [
            'MANIFEST.json', 'README.md', 'README_ja.md', 'RELEASE-MANIFEST.json', 'SBOM.cdx.json', 'SHA256SUMS', 'THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_NOTICES_ja.md', 'package.json',
            `virune-${version}.tgz`, `virune-compiler-${version}.tgz`, `virune-formatter-${version}.tgz`, `virune-js-interop-${version}.tgz`, `virune-runtime-${version}.tgz`, `virune-stdlib-${version}.tgz`, `virune-vscode-${version}.vsix`,
          ];
          const names = new Set(release.assets.map(asset => asset.name));
          for (const name of required) if (!names.has(name)) throw new Error(`Release is missing ${name}.`);
          NODE
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$actual" = "$EXPECTED_COMMIT" || {
            echo "Tag $TAG points to $actual, expected $EXPECTED_COMMIT" >&2
            exit 1
          }
          gh release download "$TAG" --dir .cache/public-release --clobber
      - name: Verify checksums, manifest and CycloneDX SBOM
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { validateDownloadedRelease } from './scripts/verify-public-release.mjs';
          const integrity = await validateDownloadedRelease('.cache/public-release', process.env.VERSION);
          await writeFile('/tmp/integrity.json', `${JSON.stringify(integrity, null, '\t')}\n`);
          NODE
      - name: Verify public CLI and generated project
        shell: bash
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          prefix="$root/prefix"
          project="$root/project"
          cli_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/virune-$VERSION.tgz"
          npm install --global "$cli_url" --prefix "$prefix" --no-audit --no-fund
          executable="$prefix/bin/virune"
          test "$("$executable" --version)" = "virune $VERSION"
          "$executable" init "$project"
          PROJECT="$project" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          const generated = JSON.parse(await readFile(resolve(process.env.PROJECT, 'package.json'), 'utf8'));
          const urls = [...Object.values(generated.dependencies ?? {}), ...Object.values(generated.devDependencies ?? {})];
          for (const url of urls) {
            if (typeof url !== 'string' || !url.includes(`/releases/download/v${process.env.VERSION}/`) || !url.includes(process.env.VERSION)) {
              throw new Error(`Generated project contains a non-release dependency: ${String(url)}`);
            }
          }
          NODE
          npm --prefix "$project" install --no-audit --no-fund
          npm --prefix "$project" run check
          npm --prefix "$project" run build
          npm --prefix "$project" run start | tee /tmp/virune-start.log
          grep -F 'Hello from Virune' /tmp/virune-start.log
      - name: Verify provenance and CycloneDX attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for asset in .cache/public-release/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
          gh attestation verify .cache/public-release/SBOM.cdx.json --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom
      - name: Verify public VSIX in a clean profile
        shell: bash
        run: |
          rm -rf release
          mkdir -p release
          cp ".cache/public-release/virune-vscode-$VERSION.vsix" release/
          xvfb-run -a node scripts/vsix-smoke.mjs
      - name: Finalize public verification report
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const release = JSON.parse(await readFile('/tmp/release.json', 'utf8'));
          const integrity = JSON.parse(await readFile('/tmp/integrity.json', 'utf8'));
          const report = {
            schemaVersion: 1,
            version: process.env.VERSION,
            tag: process.env.TAG,
            tagCommit: process.env.EXPECTED_COMMIT,
            expectedCommit: process.env.EXPECTED_COMMIT,
            repository: process.env.GITHUB_REPOSITORY,
            release: {
              htmlUrl: release.url,
              prerelease: release.isPrerelease,
              draft: release.isDraft,
              targetCommitish: release.targetCommitish,
            },
            assets: integrity.assets,
            manifest: integrity.manifest,
            sbom: integrity.sbom,
            installation: {
              cliUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/virune-${process.env.VERSION}.tgz`,
              versionOutput: `virune ${process.env.VERSION}`,
              generatedProject: { dependencySource: 'immutable release assets', check: 'passed', build: 'passed', run: 'passed' },
            },
            attestations: { provenance: 'passed', cyclonedx: 'passed' },
            vsix: { file: `virune-vscode-${process.env.VERSION}.vsix`, cleanInstall: 'passed', activation: 'passed', languageServer: 'passed', uninstall: 'passed' },
            verifiedAt: new Date().toISOString(),
            passed: true,
          };
          await writeFile('.cache/public-release/public-release-report.json', `${JSON.stringify(report, null, '\t')}\n`);
          NODE
      - name: Upload public verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-release-verification-v1.0.0
          path: .cache/public-release/
          if-no-files-found: error
          retention-days: 365
