name: Implement self-host executable declaration AST

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.head_ref == 'agent/selfhost-executable-declaration-ast' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-executable-declaration-ast
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Implement executable declaration parser
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'selfhost/mvp/src/frontend-parser-core.virune';
          let source = await readFile(path, 'utf8');
          const functionStart = source.indexOf('fn parseFunction(');
          const functionEnd = source.indexOf('\nfn parseComposite(', functionStart);
          if (functionStart < 0 || functionEnd < 0) throw new Error('parseFunction boundaries not found');

          const implementation = `fn modifierPresent(\n\tstateValue: CoreState,\n\ttokens: List<FrontendToken>,\n\tkeywordIndex: Int,\n\tmodifier: String,\n) -> Bool {\n\tlet mut index = stateValue.index\n\tlet mut found = false\n\twhile index < keywordIndex {\n\t\tif tokenAt(tokens, index).text == modifier {\n\t\t\tfound = true\n\t\t}\n\t\tindex = index + 1\n\t}\n\treturn found\n}\n\nfn parseTypeParametersNode(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet mut state = stateValue\n\tlet mut children: List<Int> = []\n\tif isText(state, tokens, "<") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected < to begin type parameters", state.index)\n\t}\n\twhile !atEnd(state, tokens) && !isText(state, tokens, ">") {\n\t\tlet before = state.index\n\t\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\t\tlet name = if validName then currentText(state, tokens) else ""\n\t\tif validName {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a type parameter name", state.index)\n\t\t\tif !atEnd(state, tokens) && !isText(state, tokens, ",") && !isText(state, tokens, ">") {\n\t\t\t\tstate = advance(state)\n\t\t\t}\n\t\t}\n\t\tlet parameter = addNode(state, tokens, "TypeParameter", name, before, state.index, [], [])\n\t\tstate = parameter.state\n\t\tchildren = List.append(children, parameter.id)\n\t\tif isText(state, tokens, ",") {\n\t\t\tstate = advance(state)\n\t\t} else if !isText(state, tokens, ">") {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected , or > after a type parameter", state.index)\n\t\t}\n\t\tif state.index <= before {\n\t\t\tstate = advance(state)\n\t\t}\n\t}\n\tif isText(state, tokens, ">") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected > to end type parameters", state.index)\n\t}\n\treturn addNode(state, tokens, "TypeParameters", "", start, state.index, children, [])\n}\n\nfn parseParametersNode(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet mut state = stateValue\n\tlet mut children: List<Int> = []\n\tif isText(state, tokens, "(") {\n\t\tstate = skipNewLines(advance(state), tokens)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected ( to begin parameters", state.index)\n\t}\n\twhile !atEnd(state, tokens) && !isText(state, tokens, ")") {\n\t\tlet before = state.index\n\t\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\t\tlet name = if validName then currentText(state, tokens) else ""\n\t\tif validName {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a parameter name", state.index)\n\t\t}\n\t\tif isText(state, tokens, ":") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected : after a parameter name", state.index)\n\t\t}\n\t\tlet typeValue = parseTypeReferenceNode(state, tokens)\n\t\tstate = typeValue.state\n\t\tlet mut parameterChildren: List<Int> = []\n\t\tif typeValue.id >= 0 {\n\t\t\tparameterChildren = List.append(parameterChildren, typeValue.id)\n\t\t}\n\t\tlet parameter = addNode(state, tokens, "Parameter", name, before, state.index, parameterChildren, [])\n\t\tstate = parameter.state\n\t\tchildren = List.append(children, parameter.id)\n\t\tif isText(state, tokens, ",") {\n\t\t\tstate = skipNewLines(advance(state), tokens)\n\t\t} else if !isText(state, tokens, ")") {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected , or ) after a parameter", state.index)\n\t\t\twhile !atEnd(state, tokens)\n\t\t\t\t&& !isText(state, tokens, ",")\n\t\t\t\t&& !isText(state, tokens, ")")\n\t\t\t\t&& currentKind(state, tokens) != FrontendTokenKind.NewLine {\n\t\t\t\tstate = advance(state)\n\t\t\t}\n\t\t\tif isText(state, tokens, ",") {\n\t\t\t\tstate = skipNewLines(advance(state), tokens)\n\t\t\t}\n\t\t}\n\t\tif state.index <= before {\n\t\t\tstate = advance(state)\n\t\t}\n\t}\n\tif isText(state, tokens, ")") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected ) to end parameters", state.index)\n\t}\n\treturn addNode(state, tokens, "Parameters", "", start, state.index, children, [])\n}\n\nfn parseReturnTypeNode(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet typeValue = parseTypeReferenceNode(stateValue, tokens)\n\tlet mut children: List<Int> = []\n\tif typeValue.id >= 0 {\n\t\tchildren = List.append(children, typeValue.id)\n\t}\n\treturn addNode(typeValue.state, tokens, "ReturnType", "", start, typeValue.state.index, children, [])\n}\n\nfn parseUsesClauseNode(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet mut state = advance(stateValue)\n\tlet mut children: List<Int> = []\n\tlet mut done = false\n\twhile !atEnd(state, tokens) && !done {\n\t\tlet before = state.index\n\t\tlet validEffect = currentKind(state, tokens) == FrontendTokenKind.Identifier || isText(state, tokens, "*")\n\t\tlet name = if validEffect then currentText(state, tokens) else ""\n\t\tif validEffect {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an effect name", state.index)\n\t\t\tdone = true\n\t\t}\n\t\tif validEffect {\n\t\t\tlet effect = addNode(state, tokens, "Effect", name, before, state.index, [], [])\n\t\t\tstate = effect.state\n\t\t\tchildren = List.append(children, effect.id)\n\t\t}\n\t\tif isText(state, tokens, ",") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tdone = true\n\t\t}\n\t}\n\treturn addNode(state, tokens, "UsesClause", "uses", start, state.index, children, [])\n}\n\nfn parseFunction(\n\tstateValue: CoreState,\n\ttokens: List<FrontendToken>,\n\tdocumentation: List<String>,\n) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet keywordIndex = declarationKeywordIndex(stateValue, tokens)\n\tlet publicValue = modifierPresent(stateValue, tokens, keywordIndex, "pub")\n\tlet asyncValue = modifierPresent(stateValue, tokens, keywordIndex, "async")\n\tlet mut state = withIndex(stateValue, keywordIndex + 1)\n\tlet name = currentText(state, tokens)\n\tif currentKind(state, tokens) == FrontendTokenKind.Identifier {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a function name", state.index)\n\t}\n\tlet mut children: List<Int> = []\n\tif publicValue || asyncValue {\n\t\tlet modifierText = if publicValue && asyncValue then "public async" else if publicValue then "public" else "async"\n\t\tlet modifiers = addNode(state, tokens, "FunctionModifiers", modifierText, start, keywordIndex, [], [])\n\t\tstate = modifiers.state\n\t\tchildren = List.append(children, modifiers.id)\n\t}\n\tif isText(state, tokens, "<") {\n\t\tlet typeParameters = parseTypeParametersNode(state, tokens)\n\t\tstate = typeParameters.state\n\t\tchildren = List.append(children, typeParameters.id)\n\t}\n\tlet parameters = parseParametersNode(state, tokens)\n\tstate = parameters.state\n\tchildren = List.append(children, parameters.id)\n\tif isText(state, tokens, "->") {\n\t\tlet returnType = parseReturnTypeNode(advance(state), tokens)\n\t\tstate = returnType.state\n\t\tchildren = List.append(children, returnType.id)\n\t}\n\tif isText(state, tokens, "uses") {\n\t\tlet usesClause = parseUsesClauseNode(state, tokens)\n\t\tstate = usesClause.state\n\t\tchildren = List.append(children, usesClause.id)\n\t}\n\tif isText(state, tokens, "{") {\n\t\tlet body = parseBlock(state, tokens)\n\t\tstate = body.state\n\t\tchildren = List.append(children, body.id)\n\t} else if isText(state, tokens, "=>") {\n\t\tlet expression = parseExpression(advance(state), tokens, 1, false)\n\t\tstate = consumeLineEnd(expression.state, tokens, "an expression-bodied function")\n\t\tif expression.id >= 0 {\n\t\t\tchildren = List.append(children, expression.id)\n\t\t}\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a function body", state.index)\n\t\tstate = synchronizeLine(state, tokens)\n\t}\n\treturn addNode(state, tokens, "FunctionDeclaration", name, start, state.index, children, documentation)\n}\n\nfn parseTestDeclaration(\n\tstateValue: CoreState,\n\ttokens: List<FrontendToken>,\n) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet keywordIndex = declarationKeywordIndex(stateValue, tokens)\n\tlet asyncValue = modifierPresent(stateValue, tokens, keywordIndex, "async")\n\tlet mut state = withIndex(stateValue, keywordIndex + 1)\n\tlet validName = currentKind(state, tokens) == FrontendTokenKind.StringLiteral\n\tlet name = if validName then currentText(state, tokens) else ""\n\tif validName {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a test name string", state.index)\n\t}\n\tlet mut children: List<Int> = []\n\tif asyncValue {\n\t\tlet modifiers = addNode(state, tokens, "TestModifiers", "async", start, keywordIndex, [], [])\n\t\tstate = modifiers.state\n\t\tchildren = List.append(children, modifiers.id)\n\t}\n\tif isText(state, tokens, "{") {\n\t\tlet body = parseBlock(state, tokens)\n\t\tstate = body.state\n\t\tchildren = List.append(children, body.id)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a test body", state.index)\n\t\tstate = synchronizeLine(state, tokens)\n\t}\n\treturn addNode(state, tokens, "TestDeclaration", name, start, state.index, children, [])\n}\n\nfn parseTopLevelValueDeclaration(\n\tstateValue: CoreState,\n\ttokens: List<FrontendToken>,\n\tdocumentation: List<String>,\n) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet keywordIndex = declarationKeywordIndex(stateValue, tokens)\n\tlet publicValue = modifierPresent(stateValue, tokens, keywordIndex, "pub")\n\tlet keyword = tokenAt(tokens, keywordIndex).text\n\tlet mut state = withIndex(stateValue, keywordIndex + 1)\n\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\tlet name = if validName then currentText(state, tokens) else ""\n\tif validName {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a top-level binding name", state.index)\n\t}\n\tlet mut bindingChildren: List<Int> = []\n\tif isText(state, tokens, ":") {\n\t\tlet annotation = parseTypeReferenceNode(advance(state), tokens)\n\t\tstate = annotation.state\n\t\tif annotation.id >= 0 {\n\t\t\tbindingChildren = List.append(bindingChildren, annotation.id)\n\t\t}\n\t}\n\tlet bindingText = (if publicValue then "public " else "") + keyword + " " + name\n\tlet binding = addNode(state, tokens, "TopLevelBinding", bindingText, keywordIndex, state.index, bindingChildren, [])\n\tstate = binding.state\n\tif isText(state, tokens, "=") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected = in a top-level value declaration", state.index)\n\t}\n\tlet initializer = parseExpression(state, tokens, 1, false)\n\tstate = consumeLineEnd(initializer.state, tokens, "a top-level value declaration")\n\tlet mut children: List<Int> = [binding.id]\n\tif initializer.id >= 0 {\n\t\tchildren = List.append(children, initializer.id)\n\t}\n\treturn addNode(state, tokens, "TopLevelValueDeclaration", name, start, state.index, children, documentation)\n}`;
          source = source.slice(0, functionStart) + implementation + '\n\n' + source.slice(functionEnd + 1);

          source = source.replace(
            'if kind == "TopLevelValueDeclaration" {\n\t\treturn parseLineDeclaration(state, tokens, kind, docs.documentation)\n\t}\n\tif kind == "TestDeclaration" {\n\t\treturn parseComposite(state, tokens, kind, [])\n\t}',
            'if kind == "TopLevelValueDeclaration" {\n\t\treturn parseTopLevelValueDeclaration(state, tokens, docs.documentation)\n\t}\n\tif kind == "TestDeclaration" {\n\t\treturn parseTestDeclaration(state, tokens)\n\t}',
          );
          await writeFile(path, source);

          const englishPath = 'docs/self-hosting-frontend.md';
          let english = await readFile(englishPath, 'utf8');
          if (!english.includes('### Executable declaration AST')) {
            english += '\n\n### Executable declaration AST\n\nFunctions now own deterministic modifier, type-parameter, parameter, return-type, uses-clause, and body children. Block bodies reuse the detailed statement parser and expression bodies reuse the precedence parser. Tests own an optional async modifier and a detailed block. Top-level `let` and `const` declarations own a `TopLevelBinding` with an optional detailed type reference plus the initializer expression. Header recovery preserves progress to later declarations.\n';
          }
          await writeFile(englishPath, english);

          const japanesePath = 'docs/self-hosting-frontend_ja.md';
          let japanese = await readFile(japanesePath, 'utf8');
          if (!japanese.includes('### Executable declaration AST')) {
            japanese += '\n\n### Executable declaration AST\n\nFunctionはmodifier、type parameter、parameter、return type、uses clause、bodyを決定的なchildとして保持します。Block bodyは詳細statement parserを、expression bodyはprecedence parserを再利用します。Testは任意のasync modifierと詳細Blockを持ちます。Top-level `let`／`const`は任意の詳細type referenceを持つ`TopLevelBinding`とinitializer expressionを保持します。Header recoveryは後続declarationへの進行を維持します。\n';
          }
          await writeFile(japanesePath, japanese);
          NODE
      - run: npm ci
      - run: npm run check
      - name: Run executable declaration Host test
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-executable-declaration-ast.test.js
      - name: Run Stage 0 self-host tests
        run: node packages/cli/dist/src/main.js test selfhost/mvp
      - run: git diff --check
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/implement-selfhost-executable-declaration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfhost/mvp/src/frontend-parser-core.virune packages/compiler/test/selfhost-executable-declaration-ast.test.ts selfhost/mvp/src/frontend-executable-declaration.spec.virune docs/self-hosting-frontend.md docs/self-hosting-frontend_ja.md .github/workflows/implement-selfhost-executable-declaration.yml
          git commit -m "compiler(selfhost): add executable declaration AST"
          git push origin HEAD:agent/selfhost-executable-declaration-ast
