name: Temporary self-host postfix member parser repair

on:
  pull_request:
    branches:
      - feat/selfhost-multiline-binary
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/selfhost-postfix-member-parser
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply repaired postfix parser and single-arena tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow_path = '.github/workflows/tmp-selfhost-postfix-member-parser-pr.yml'
          previous = ''
          for ancestor in ('HEAD^', 'HEAD^^', 'HEAD^^^'):
              candidate = subprocess.check_output(
                  ['git', 'show', f'{ancestor}:{workflow_path}'],
                  text=True,
              )
              if "Path('packages/compiler/test/selfhost-postfix-member-parser.test.ts').write_text" in candidate:
                  previous = candidate
                  break
          if previous == '':
              raise RuntimeError('original postfix parser workflow was not found')

          opener = "          python - <<'PY'\n"
          start = previous.index(opener) + len(opener)
          end = previous.index("\n          PY", start)
          script = previous[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          ) + "\n"

          marker = "replacement = '''fn parsePostfix"
          replacement_start = script.index(marker)
          outer_loop = script.index(r'\twhile true {', replacement_start)
          script = (
              script[:outer_loop]
              + r'\twhile tokenAt(current).text == "[" || tokenAt(current).text == "." || tokenAt(current).text == "(" {'
              + script[outer_loop + len(r'\twhile true {'):]
          )
          outer_break = "\\t\\tbreak\n\\t}\n\\treturn Ok("
          if outer_break not in script:
              raise RuntimeError('outer postfix loop terminator was not found')
          script = script.replace(
              outer_break,
              "\\t}\n\\treturn Ok(",
              1,
          )

          source_start = script.index("const source = [")
          source_end_marker = "].join('\\\\n');"
          source_end = script.index(source_end_marker, source_start) + len(source_end_marker)
          source_replacement = "\n".join([
              "const source = [",
              r"\t'pub fn inspect(values: List<Int>, index: Int) -> Int {',",
              r"\t'\treturn combine(',",
              r"\t'\t\tdeclarationAt(values, index).name,',",
              r"\t'\t\tcreate().child()(1).name,',",
              r"\t'\t\tvalues[0].name,',",
              r"\t'\t\t(create()).name',",
              r"\t'\t)',",
              r"\t'}',",
              r"\t'',",
              r"].join('\\n');",
          ])
          script = script[:source_start] + source_replacement + script[source_end:]

          repair_script = Path('/tmp/apply-postfix-member-parser.py')
          repair_script.write_text(script)
          subprocess.run(['python', str(repair_script)], check=True)
          PY
      - run: npm run build
      - run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-postfix-member-parser.test.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/parser.virune packages/compiler/test/selfhost-postfix-member-parser.test.ts .github/workflows/tmp-selfhost-postfix-member-parser-pr.yml
          git commit -m "feat(selfhost): parse arbitrary postfix member chains"
          git push origin HEAD:feat/selfhost-postfix-member-parser
