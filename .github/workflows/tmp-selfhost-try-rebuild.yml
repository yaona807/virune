name: Temporary self-host final diagnostic validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/selfhost-try-rebuild-run-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate parenthesized match propagation in checker
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/feat/selfhost-member-chain-integration)" = '3ac188fa0dda88862b726311e16c9f76288376bd'
          git checkout -B final-diagnostic-validation 3ac188fa0dda88862b726311e16c9f76288376bd
          python - <<'PY'
          from pathlib import Path

          path = Path('selfhost/mvp/src/checker.virune')
          source = path.read_text()
          old = '''\tlet checked = match annotation {
          \t\tSome(expectedType) => checkExpectedExpression(sourceExpressionId, expectedType, context, expressions)
          \t\tNone => checkExpression(sourceExpressionId, context, expressions)
          \t}?
          '''
          new = '''\tlet checked = (match annotation {
          \t\tSome(expectedType) => checkExpectedExpression(sourceExpressionId, expectedType, context, expressions)
          \t\tNone => checkExpression(sourceExpressionId, context, expressions)
          \t})?
          '''
          count = source.count(old)
          if count != 1:
              raise RuntimeError(f'expected one target match-propagation expression, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = 'selfhost/mvp/src/checker.virune'
          npm ci
          npm run build
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/compiler/dist/test/selfhost-full-language-inventory.test.js')
          source = path.read_text()
          replacements = [
              ('timeout: 420_000', 'timeout: 720_000'),
              ('timeout: 420000', 'timeout: 720000'),
          ]
          for old, new in replacements:
              if old in source:
                  path.write_text(source.replace(old, new, 1))
                  break
          else:
              raise RuntimeError('inventory internal timeout not found in generated test')
          PY
          node --test --test-timeout=720000 packages/compiler/dist/test/selfhost-full-language-inventory.test.js
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.cache/ci-timings/selfhost-full-language-inventory.json')
          inventory = json.loads(path.read_text())
          remaining = [
              item for item in inventory.get('firstDiagnostics', [])
              if item.get('code') == 'L0002'
              and item.get('message') == 'Expected a line end after a let statement'
              and item.get('sourcePath') == 'src/checker.virune'
          ]
          if remaining:
              raise RuntimeError('parenthesized match did not remove the targeted L0002 diagnostic')
          print('SELFHOST_AFTER_PARENTHESIZED_MATCH_JSON')
          print(json.dumps(inventory, separators=(',', ':')))
          PY
