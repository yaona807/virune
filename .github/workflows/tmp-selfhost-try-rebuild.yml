name: Temporary self-host generic Json validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/selfhost-try-rebuild-run-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate grammar-safe generic Json support
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/feat/selfhost-member-chain-integration)" = 'b0fd10cb7f1b45a7ed8b205d220a1f3d743c3347'
          git checkout -B generic-json-validation b0fd10cb7f1b45a7ed8b205d220a1f3d743c3347
          python - <<'PY'
          from pathlib import Path

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one target, found {count}')
              return value.replace(old, new, 1)

          parser_path = Path('selfhost/mvp/src/parser.virune')
          parser = parser_path.read_text()
          old_loop = 'while tokenAt(current).text == "[" || tokenAt(current).text == "." || tokenAt(current).text == "(" || tokenAt(current).text == "?" {'
          new_loop = old_loop[:-2] + ' || tokenAt(current).text == "<" {'
          parser = replace_once(parser, old_loop, new_loop, 'postfix loop')
          anchor = new_loop + '\n\t\tif tokenAt(current).text == "?" {\n'
          generic_case = new_loop + '''
          \t\tif tokenAt(current).text == "<" {
          \t\t\tlet base = expressionAt(arena, expressionId, tokenAt(current).span)?
          \t\t\tlet mut scan = advance(current)
          \t\t\tlet mut depth = 1
          \t\t\tlet mut typeText = ""
          \t\t\tlet mut valid = true
          \t\t\twhile depth > 0 {
          \t\t\t\tlet token = tokenAt(scan)
          \t\t\t\tif token.kind == MvpTokenKind.EndOfFile || token.kind == MvpTokenKind.NewLine || token.text == "{" || token.text == "}" {
          \t\t\t\t\tvalid = false
          \t\t\t\t\tbreak
          \t\t\t\t}
          \t\t\t\tif token.text == "<" {
          \t\t\t\t\tdepth = depth + 1
          \t\t\t\t\ttypeText = typeText + token.text
          \t\t\t\t\tscan = advance(scan)
          \t\t\t\t\tcontinue
          \t\t\t\t}
          \t\t\t\tif token.text == ">" {
          \t\t\t\t\tdepth = depth - 1
          \t\t\t\t\tif depth == 0 {
          \t\t\t\t\t\tbreak
          \t\t\t\t\t}
          \t\t\t\t\ttypeText = typeText + token.text
          \t\t\t\t\tscan = advance(scan)
          \t\t\t\t\tcontinue
          \t\t\t\t}
          \t\t\t\ttypeText = typeText + token.text
          \t\t\t\tscan = advance(scan)
          \t\t\t}
          \t\t\tif !valid || tokenAt(advance(scan)).text != "(" {
          \t\t\t\tbreak
          \t\t\t}
          \t\t\tlet close = tokenAt(scan)
          \t\t\tlet added = addExpression(advance(scan), arena, MvpExpression {
          \t\t\t\tkind: "typeApply",
          \t\t\t\ttext: typeText,
          \t\t\t\tliteralType: None,
          \t\t\t\tchildren: [expressionId],
          \t\t\t\tspan: span(base.span.start, close.span.end),
          \t\t\t})
          \t\t\tcurrent = added.cursor
          \t\t\texpressionId = added.expressionId
          \t\t\tarena = added.expressions
          \t\t\tcontinue
          \t\t}
          \t\tif tokenAt(current).text == "?" {
          '''
          parser = replace_once(parser, anchor, generic_case, 'generic postfix insertion')
          parser = replace_once(
              parser,
              '\tvalidateImports(imports)?\n',
              '\tlet importValidation = validateImports(imports)?\n',
              'validateImports source normalization',
          )
          parser_path.write_text(parser)

          checker_path = Path('selfhost/mvp/src/checker.virune')
          checker = checker_path.read_text()
          checker = replace_once(
              checker,
              '''fn checkIdentifier(node: MvpExpression, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tif standardConstructorName(node.text) == "None" {
          ''',
              '''fn checkIdentifier(node: MvpExpression, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tif node.text == "Json" {
          \t\treturn Ok(checkedLocal(node, node.text, MvpType.NamedType("JsonNamespace"), expressions))
          \t}
          \tif standardConstructorName(node.text) == "None" {
          ''',
              'Json namespace identifier',
          )
          checker = replace_once(
              checker,
              '''fn checkField(node: MvpExpression, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet sourceId = childAt(node, 0)?
          \tlet target = checkExpression(sourceId, context, expressions)?
          \treturn resolvedField(node, node.text, target)
          }
          ''',
              '''fn sourceQualifiedName(expressionId: Int, context: CheckContext) -> Result<String?, MvpDiagnostic> {
          \tlet node = sourceExpressionAt(context, expressionId)?
          \tif node.kind == "identifier" {
          \t\treturn Ok(Some(node.text))
          \t}
          \tif node.kind == "field" {
          \t\tlet sourceId = childAt(node, 0)?
          \t\tlet prefixValue = sourceQualifiedName(sourceId, context)?
          \t\treturn match prefixValue {
          \t\t\tSome(prefix) => Ok(Some(prefix + "." + node.text))
          \t\t\tNone => Ok(None)
          \t\t}
          \t}
          \treturn Ok(None)
          }

          fn genericJsonFunctionType(qualifiedName: String, typeArgument: String) -> MvpType? {
          \tlet argumentType = typeFromName(typeArgument)
          \tif qualifiedName == "Json.decode" {
          \t\treturn Some(MvpType.NamedType("fn(JsonValue)->Result<" + typeName(argumentType) + ",List<JsonError>>"))
          \t}
          \tif qualifiedName == "Json.encode" {
          \t\treturn Some(MvpType.NamedType("fn(" + typeName(argumentType) + ")->Result<String,List<JsonError>>"))
          \t}
          \treturn None
          }

          fn checkTypeApply(node: MvpExpression, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet sourceId = childAt(node, 0)?
          \tlet qualifiedNameValue = sourceQualifiedName(sourceId, context)?
          \tlet qualifiedName = match qualifiedNameValue {
          \t\tSome(value) => value
          \t\tNone => ""
          \t}
          \tlet valueTypeValue = genericJsonFunctionType(qualifiedName, node.text)
          \tif match valueTypeValue { Some(_) => false, None => true } {
          \t\treturn Err(errorDiagnostic("L1010", "Unknown generic function " + qualifiedName, node.span))
          \t}
          \tlet valueType = match valueTypeValue {
          \t\tSome(value) => value
          \t\tNone => MvpType.ErrorType
          \t}
          \treturn Ok(addHir(expressions, MvpHirExpression {
          \t\tkind: "function",
          \t\ttext: qualifiedName,
          \t\tvalueType: valueType,
          \t\tchildren: [],
          \t\tspan: node.span,
          \t}, valueType))
          }

          fn checkField(node: MvpExpression, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet sourceId = childAt(node, 0)?
          \tlet ownerNameValue = sourceQualifiedName(sourceId, context)?
          \tlet ownerName = match ownerNameValue {
          \t\tSome(value) => value
          \t\tNone => ""
          \t}
          \tif ownerName == "Json" && node.text == "parse" {
          \t\tlet valueType = MvpType.NamedType("fn(String)->Result<JsonValue,List<JsonError>>")
          \t\treturn Ok(addHir(expressions, MvpHirExpression {
          \t\t\tkind: "function",
          \t\t\ttext: "Json.parse",
          \t\t\tvalueType: valueType,
          \t\t\tchildren: [],
          \t\t\tspan: node.span,
          \t\t}, valueType))
          \t}
          \tlet target = checkExpression(sourceId, context, expressions)?
          \treturn resolvedField(node, node.text, target)
          }
          ''',
              'generic Json checker helpers',
          )
          checker = replace_once(
              checker,
              '''\tif node.kind == "field" {
          \t\treturn checkField(node, context, expressions)
          \t}
          ''',
              '''\tif node.kind == "typeApply" {
          \t\treturn checkTypeApply(node, context, expressions)
          \t}
          \tif node.kind == "field" {
          \t\treturn checkField(node, context, expressions)
          \t}
          ''',
              'typeApply checker dispatch',
          )
          checker_path.write_text(checker)
          PY
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' selfhost/mvp/src/checker.virune selfhost/mvp/src/parser.virune | sort)"
          git diff --check
          npm ci
          npm run build
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/compiler/dist/test/selfhost-full-language-inventory.test.js')
          source = path.read_text()
          for old, new in [('timeout: 720_000', 'timeout: 900_000'), ('timeout: 720000', 'timeout: 900000')]:
              if old in source:
                  path.write_text(source.replace(old, new, 1))
                  break
          else:
              raise RuntimeError('720-second inventory timeout not found')
          PY
          node --test --test-timeout=900000 packages/compiler/dist/test/selfhost-full-language-inventory.test.js
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('.cache/ci-timings/selfhost-full-language-inventory.json').read_text())
          l0002 = [item for item in inventory.get('firstDiagnostics', []) if item.get('code') == 'L0002']
          if l0002:
              raise RuntimeError('L0002 diagnostics remain: ' + json.dumps(l0002, separators=(',', ':')))
          print('SELFHOST_GENERIC_JSON_INVENTORY_JSON')
          print(json.dumps(inventory, separators=(',', ':')))
          PY
