name: Temporary self-host member-chain conflict diagnosis

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/selfhost-try-rebuild-run-20260804
          fetch-depth: 0
      - name: Reproduce and print member-chain conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/feat/selfhost-try-propagation)" = 'f505238e9cc8ecc24d8cb4b8ddbcaf2300d7417b'
          git checkout -B member-chain-diagnosis f505238e9cc8ecc24d8cb4b8ddbcaf2300d7417b
          set +e
          git cherry-pick --no-commit a1eb1ddc2501cd23b8ae16f452576f0b3afbf3da
          status=$?
          set -e
          echo "CHERRY_PICK_STATUS=$status"
          git status --short
          echo 'UNMERGED_PATHS'
          git diff --name-only --diff-filter=U
          for path in $(git diff --name-only --diff-filter=U); do
            echo "CONFLICT_MARKERS:$path"
            sed -n '/^<<<<<<< /,/^>>>>>>> /p' "$path"
            echo "COMBINED_DIFF:$path"
            git diff --cc -- "$path"
          done
          exit 1
