name: Temporary self-host PR 265 final patch runner

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/selfhost-try-rebuild-run-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Patch validated checker syntax and inventory timeout
        shell: bash
        run: |
          set -euo pipefail
          expected_feature_head='3ac188fa0dda88862b726311e16c9f76288376bd'
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/feat/selfhost-member-chain-integration)" = "$expected_feature_head"
          git checkout -B feat/selfhost-member-chain-integration origin/feat/selfhost-member-chain-integration
          python - <<'PY'
          from pathlib import Path

          checker_path = Path('selfhost/mvp/src/checker.virune')
          checker = checker_path.read_text()
          old_checker = '''\tlet checked = match annotation {
          \t\tSome(expectedType) => checkExpectedExpression(sourceExpressionId, expectedType, context, expressions)
          \t\tNone => checkExpression(sourceExpressionId, context, expressions)
          \t}?
          '''
          new_checker = '''\tlet checked = (match annotation {
          \t\tSome(expectedType) => checkExpectedExpression(sourceExpressionId, expectedType, context, expressions)
          \t\tNone => checkExpression(sourceExpressionId, context, expressions)
          \t})?
          '''
          if checker.count(old_checker) != 1:
              raise RuntimeError(f'expected one checker target, found {checker.count(old_checker)}')
          checker_path.write_text(checker.replace(old_checker, new_checker, 1))

          test_path = Path('packages/compiler/test/selfhost-full-language-inventory.test.ts')
          test_source = test_path.read_text()
          old_timeout = '{ timeout: 420_000 }'
          new_timeout = '{ timeout: 720_000 }'
          if test_source.count(old_timeout) != 1:
              raise RuntimeError(f'expected one inventory timeout target, found {test_source.count(old_timeout)}')
          test_path.write_text(test_source.replace(old_timeout, new_timeout, 1))
          PY
          expected_paths="$(printf '%s\n' \
            packages/compiler/test/selfhost-full-language-inventory.test.ts \
            selfhost/mvp/src/checker.virune | sort)"
          actual_paths="$(git diff --name-only | sort)"
          test "$actual_paths" = "$expected_paths"
          git diff --check
          npm ci
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/compiler/test/selfhost-full-language-inventory.test.ts selfhost/mvp/src/checker.virune
          git commit -m 'fix(selfhost): unblock full-language checker inventory'
          git push --force-with-lease=refs/heads/feat/selfhost-member-chain-integration:"$expected_feature_head" origin HEAD:feat/selfhost-member-chain-integration
