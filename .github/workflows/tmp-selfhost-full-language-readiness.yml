name: Temporary self-host full-language readiness push probe

on:
  push:
    branches:
      - feat/selfhost-full-language-readiness
    paths:
      - .github/workflows/tmp-selfhost-full-language-readiness.yml

concurrency:
  group: selfhost-full-language-readiness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Evaluate transport
        id: transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          allowed=(
            .github/scripts/tmp-apply-full-language-readiness.py
            .github/workflows/tmp-selfhost-full-language-readiness-pr.yml
            .github/workflows/tmp-selfhost-full-language-readiness.yml
          )
          unexpected=()
          for path in "${changed[@]}"; do
            found=false
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then found=true; break; fi
            done
            if [[ "$found" == false ]]; then unexpected+=("$path"); fi
          done
          if [[ ${#unexpected[@]} -eq 0 && ${#changed[@]} -ge 1 ]]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            printf 'Readiness source commit already exists or branch diff is unexpected: %s\n' "${changed[*]}"
          fi

      - name: Set up Node.js
        if: steps.transport.outputs.apply == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.transport.outputs.apply == 'true'
        run: npm ci

      - name: Verify and apply readiness patch
        if: steps.transport.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/tmp-apply-full-language-readiness.py

      - name: Type-check
        if: steps.transport.outputs.apply == 'true'
        run: npm run check

      - name: Run focused contextual typing regression
        if: steps.transport.outputs.apply == 'true'
        run: npm run selfhost:focused:built -- --case=qualified-builtins-variants

      - name: Run project compiler capability regression
        if: steps.transport.outputs.apply == 'true'
        run: npm run selfhost:focused:built -- --case=project-compiler-contract

      - name: Run bootstrap readiness regression
        if: steps.transport.outputs.apply == 'true'
        run: npm run selfhost:focused:built -- --case=bootstrap-stage-runner

      - name: Verify documentation
        if: steps.transport.outputs.apply == 'true'
        run: npm run docs:check

      - name: Switch capability to diagnostic probe mode
        if: steps.transport.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('selfhost/mvp/src/project-compiler-contract.virune')
          text = path.read_text()
          old = '''\t\tready: true,
\t\trequestSchema: "virune.selfhost.project-compiler.request.v1",
\t\tresultSchema: "virune.selfhost.project-compiler.result.v2",
\t\tblockers: [],'''
          new = '''\t\tready: false,
\t\trequestSchema: "virune.selfhost.project-compiler.request.v1",
\t\tresultSchema: "virune.selfhost.project-compiler.result.v2",
\t\tblockers: ["diagnostic-probe-pending-full-language-inventory"],'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one ready capability block after applying the readiness patch')
          path.write_text(text.replace(old, new))
          PY

      - name: Run canonical full-language diagnostic probe
        if: steps.transport.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { runFullLanguageInventory } from './packages/compiler/dist/src/selfhost/full-language-inventory-runner.js';

          const inventory = await runFullLanguageInventory({ repositoryRoot: process.cwd() });
          console.log(`SELFHOST_FULL_LANGUAGE_PROBE ${JSON.stringify(inventory)}`);
          if (inventory.capability.ready) {
            throw new Error('Diagnostic probe must keep the capability non-ready');
          }
          NODE

      - name: Verify probe diff
        if: steps.transport.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python <<'PY'
          import subprocess
          expected = sorted([
              'docs/self-hosting-project-compiler-integration.md',
              'docs/self-hosting-project-compiler-integration_ja.md',
              'docs/self-hosting-stage1-stage2-bootstrap.md',
              'docs/self-hosting-stage1-stage2-bootstrap_ja.md',
              'packages/compiler/test/selfhost-bootstrap-stage-runner.test.ts',
              'packages/compiler/test/selfhost-full-language-inventory.test.ts',
              'packages/compiler/test/selfhost-project-compiler-contract.test.ts',
              'packages/compiler/test/selfhost-qualified-builtins-variants.test.ts',
              'selfhost/mvp/src/checker.virune',
              'selfhost/mvp/src/project-compiler-contract.virune',
          ])
          actual = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected probe diff: expected={expected}, actual={actual}')
          PY
