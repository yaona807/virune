name: Diagnose self-host parser parity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'agent/selfhost-parser-parity' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case:
          - valid-data-declarations
          - valid-conditional-parallel
          - valid-type-references
          - invalid-parameter-colon
    env:
      PARITY_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-parser-parity
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select case and add progress markers
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const corpusPath = '.github/self-hosting/parser-parity-corpus-v1.json';
          const corpus = JSON.parse(await readFile(corpusPath, 'utf8'));
          corpus.cases = corpus.cases.filter(item => item.id === process.env.PARITY_CASE);
          if (corpus.cases.length !== 1) throw new Error(`Missing parity case ${process.env.PARITY_CASE}`);
          console.log(`PARITY_SELECTED ${process.env.PARITY_CASE}`);
          await writeFile(corpusPath, `${JSON.stringify(corpus, null, 2)}\n`);

          const testPath = 'packages/compiler/test/selfhost-parser-parity.test.ts';
          let source = await readFile(testPath, 'utf8');
          const caseMarker = '\t\tfor (const fixture of corpus.cases) {\n\t\t\tconst legacy = parseLegacySyntax(fixture.source);';
          const caseReplacement = '\t\tfor (const fixture of corpus.cases) {\n\t\t\tconsole.log(`PARITY_CASE ${fixture.id}`);\n\t\t\tconst legacy = parseLegacySyntax(fixture.source);';
          const mutationMarker = '\t\t\tfor (const mutation of fixture.mutations) {\n\t\t\t\tconst mutatedSource = mutate(fixture.source, mutation);';
          const mutationReplacement = '\t\t\tfor (const mutation of fixture.mutations) {\n\t\t\t\tconsole.log(`PARITY_MUTATION ${fixture.id}:${mutation}`);\n\t\t\t\tconst mutatedSource = mutate(fixture.source, mutation);';
          if (!source.includes(caseMarker) || !source.includes(mutationMarker)) throw new Error('Parity progress marker target is missing');
          source = source.replace(caseMarker, caseReplacement).replace(mutationMarker, mutationReplacement);
          await writeFile(testPath, source);
          NODE
      - run: npm run build
      - name: Run isolated parity case
        run: timeout --signal=TERM --kill-after=10s 90s node --test --test-timeout=80000 packages/compiler/dist/test/selfhost-parser-parity.test.js
