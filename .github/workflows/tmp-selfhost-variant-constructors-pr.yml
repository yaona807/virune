name: Temporary self-host variant constructor implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/selfhost-variant-constructors
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply checker, emitter, and regression-test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_function(source: str, name: str, replacement: str) -> str:
              marker = f"fn {name}("
              start = source.index(marker)
              end = source.index("\nfn ", start + len(marker))
              return source[:start] + replacement.rstrip() + source[end:]

          checker_path = Path('selfhost/mvp/src/checker.virune')
          checker = checker_path.read_text()
          import_marker = '\toptionalElementType,\n'
          if import_marker not in checker:
              raise SystemExit('Unable to locate optionalElementType import')
          checker = checker.replace(import_marker, import_marker + '\toptionalType,\n', 1)

          checker = replace_function(checker, 'checkIdentifier', '''fn checkIdentifier(node: MvpExpression, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tif standardConstructorName(node.text) == "None" {
          \t\treturn Err(errorDiagnostic("L2020", "Cannot infer the Optional type of None without an expected type", node.span))
          \t}
          \treturn match findBinding(context.bindings, node.text) {
          \t\tSome(value) => Ok(addHir(expressions, MvpHirExpression {
          \t\t\tkind: "local",
          \t\t\ttext: node.text,
          \t\t\tvalueType: value.valueType,
          \t\t\tchildren: [],
          \t\t\tspan: node.span,
          \t\t}, value.valueType))
          \t\tNone => Err(errorDiagnostic("L1010", "Unknown name " + node.text, node.span))
          \t}
          }''')

          checker = replace_function(checker, 'checkArguments', '''fn checkArguments(node: MvpExpression, expected: List<MvpType>, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedArguments, MvpDiagnostic> {
          \tif List.length(node.children) != List.length(expected) {
          \t\treturn Err(errorDiagnostic("L2012", "Expected " + Debug.format(List.length(expected)) + " arguments, received " + Debug.format(List.length(node.children)), node.span))
          \t}
          \tlet mut expressionIds: List<Int> = []
          \tlet mut arena = expressions
          \tlet mut index = 0
          \twhile index < List.length(node.children) {
          \t\tlet sourceId = childAt(node, index)?
          \t\tlet expectedType = expectedAt(expected, index, node.span)?
          \t\tlet checked = checkExpectedExpression(sourceId, expectedType, context, arena)?
          \t\texpressionIds = List.append(expressionIds, checked.expressionId)
          \t\tarena = checked.expressions
          \t\tindex = index + 1
          \t}
          \treturn Ok(CheckedArguments { expressionIds: expressionIds, expressions: arena })
          }''')

          checker = replace_function(checker, 'checkCall', '''fn checkCall(node: MvpExpression, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet constructorName = standardConstructorName(node.text)
          \tif constructorName == "Some" {
          \t\tif List.length(node.children) != 1 {
          \t\t\treturn Err(errorDiagnostic("L2012", "Some expects 1 argument, received " + Debug.format(List.length(node.children)), node.span))
          \t\t}
          \t\tlet sourceId = childAt(node, 0)?
          \t\tlet checked = checkExpression(sourceId, context, expressions)?
          \t\treturn match optionalType(checked.valueType) {
          \t\t\tSome(valueType) => Ok(checkedVariant(node, constructorName, valueType, [checked.expressionId], checked.expressions))
          \t\t\tNone => Err(errorDiagnostic("L2020", "Cannot infer an Optional type for Some from " + typeName(checked.valueType), node.span))
          \t\t}
          \t}
          \tif constructorName == "Ok" || constructorName == "Err" {
          \t\treturn Err(errorDiagnostic("L2020", "Cannot infer the complete Result type for " + constructorName + " without an expected type", node.span))
          \t}
          \tif constructorName == "None" {
          \t\treturn Err(errorDiagnostic("L2012", "None is a value and does not accept arguments", node.span))
          \t}
          \treturn match findSignature(context.signatures, node.text) {
          \t\tSome(value) => checkKnownCall(node, value, context, expressions)
          \t\tNone => Err(errorDiagnostic("L1010", "Unknown name " + node.text, node.span))
          \t}
          }''')

          helpers = '''fn standardConstructorName(value: String) -> String {
          \tif value == "Some" || value == "Option.Some" {
          \t\treturn "Some"
          \t}
          \tif value == "None" || value == "Option.None" {
          \t\treturn "None"
          \t}
          \tif value == "Ok" || value == "Result.Ok" {
          \t\treturn "Ok"
          \t}
          \tif value == "Err" || value == "Result.Err" {
          \t\treturn "Err"
          \t}
          \treturn ""
          }

          fn checkedVariant(node: MvpExpression, constructorName: String, valueType: MvpType, childIds: List<Int>, expressions: List<MvpHirExpression>) -> CheckedExpression {
          \treturn addHir(expressions, MvpHirExpression {
          \t\tkind: "variant",
          \t\ttext: constructorName,
          \t\tvalueType: valueType,
          \t\tchildren: childIds,
          \t\tspan: node.span,
          \t}, valueType)
          }

          fn resultPayloadType(expectedType: MvpType, constructorName: String) -> MvpType? {
          \tlet resultName = match expectedType {
          \t\tNamedType(name) => name
          \t\t_ => ""
          \t}
          \tif !String.contains(resultName, "Result<") {
          \t\treturn None
          \t}
          \tlet requestedIndex = if constructorName == "Ok" then 0 else if constructorName == "Err" then 1 else -1
          \tif requestedIndex < 0 {
          \t\treturn None
          \t}
          \treturn match genericArgument(resultName, requestedIndex) {
          \t\tSome(name) => Some(typeFromName(name))
          \t\tNone => None
          \t}
          }

          fn checkExpectedVariant(node: MvpExpression, expectedType: MvpType, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet constructorName = standardConstructorName(node.text)
          \tif constructorName == "None" {
          \t\tif node.kind != "identifier" || List.isNotEmpty(node.children) {
          \t\t\treturn Err(errorDiagnostic("L2012", "None is a value and does not accept arguments", node.span))
          \t\t}
          \t\treturn match optionalElementType(expectedType) {
          \t\t\tSome(_) => Ok(checkedVariant(node, constructorName, expectedType, [], expressions))
          \t\t\tNone => Err(errorDiagnostic("L2043", "None requires an Optional expected type, received " + typeName(expectedType), node.span))
          \t\t}
          \t}
          \tif constructorName == "Some" {
          \t\tif node.kind != "call" || List.length(node.children) != 1 {
          \t\t\treturn Err(errorDiagnostic("L2012", "Some expects 1 argument, received " + Debug.format(List.length(node.children)), node.span))
          \t\t}
          \t\tlet payloadType = optionalElementType(expectedType)
          \t\tif match payloadType { Some(_) => false, None => true } {
          \t\t\treturn Err(errorDiagnostic("L2043", "Some requires an Optional expected type, received " + typeName(expectedType), node.span))
          \t\t}
          \t\tlet expectedPayload = match payloadType { Some(value) => value, None => MvpType.ErrorType }
          \t\tlet sourceId = childAt(node, 0)?
          \t\tlet checked = checkExpectedExpression(sourceId, expectedPayload, context, expressions)?
          \t\treturn Ok(checkedVariant(node, constructorName, expectedType, [checked.expressionId], checked.expressions))
          \t}
          \tif constructorName == "Ok" || constructorName == "Err" {
          \t\tif node.kind != "call" || List.length(node.children) != 1 {
          \t\t\treturn Err(errorDiagnostic("L2012", constructorName + " expects 1 argument, received " + Debug.format(List.length(node.children)), node.span))
          \t\t}
          \t\tlet payloadType = resultPayloadType(expectedType, constructorName)
          \t\tif match payloadType { Some(_) => false, None => true } {
          \t\t\treturn Err(errorDiagnostic("L2043", constructorName + " requires a Result expected type, received " + typeName(expectedType), node.span))
          \t\t}
          \t\tlet expectedPayload = match payloadType { Some(value) => value, None => MvpType.ErrorType }
          \t\tlet sourceId = childAt(node, 0)?
          \t\tlet checked = checkExpectedExpression(sourceId, expectedPayload, context, expressions)?
          \t\treturn Ok(checkedVariant(node, constructorName, expectedType, [checked.expressionId], checked.expressions))
          \t}
          \treturn Err(errorDiagnostic("L9001", "Unknown standard variant constructor " + node.text, node.span))
          }

          fn checkExpectedConditional(node: MvpExpression, expectedType: MvpType, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet conditionSourceId = childAt(node, 0)?
          \tlet consequentSourceId = childAt(node, 1)?
          \tlet alternateSourceId = childAt(node, 2)?
          \tlet condition = checkExpression(conditionSourceId, context, expressions)?
          \tif !typesCompatible(condition.valueType, MvpType.BoolType) {
          \t\tlet source = sourceExpressionAt(context, conditionSourceId)?
          \t\treturn Err(typeMismatch(condition.valueType, MvpType.BoolType, source.span))
          \t}
          \tlet consequent = checkExpectedExpression(consequentSourceId, expectedType, context, condition.expressions)?
          \tlet alternate = checkExpectedExpression(alternateSourceId, expectedType, context, consequent.expressions)?
          \treturn Ok(addHir(alternate.expressions, MvpHirExpression {
          \t\tkind: "if",
          \t\ttext: node.text,
          \t\tvalueType: expectedType,
          \t\tchildren: [condition.expressionId, consequent.expressionId, alternate.expressionId],
          \t\tspan: node.span,
          \t}, expectedType))
          }

          fn checkExpectedMatchArm(armSourceId: Int, targetType: MvpType, expectedType: MvpType, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet arm = sourceExpressionAt(context, armSourceId)?
          \tif arm.kind != "matchArm" {
          \t\treturn Err(errorDiagnostic("L9001", "Match expression contains a non-arm child", arm.span))
          \t}
          \tlet patternSourceId = childAt(arm, 0)?
          \tlet bodySourceId = childAt(arm, 1)?
          \tlet checkedPattern = checkPattern(patternSourceId, targetType, context, expressions)?
          \tlet checkedBody = checkExpectedExpression(bodySourceId, expectedType, CheckContext {
          \t\tsignatures: context.signatures,
          \t\tbindings: checkedPattern.bindings,
          \t\treturnType: context.returnType,
          \t\tsourceExpressions: context.sourceExpressions,
          \t\tsourceStatements: context.sourceStatements,
          \t}, checkedPattern.expressions)?
          \treturn Ok(addHir(checkedBody.expressions, MvpHirExpression {
          \t\tkind: "matchArm",
          \t\ttext: arm.text,
          \t\tvalueType: expectedType,
          \t\tchildren: [checkedPattern.expressionId, checkedBody.expressionId],
          \t\tspan: arm.span,
          \t}, expectedType))
          }

          fn checkExpectedMatch(node: MvpExpression, expectedType: MvpType, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet targetSourceId = childAt(node, 0)?
          \tlet checkedTarget = checkExpression(targetSourceId, context, expressions)?
          \tlet mut childIds: List<Int> = [checkedTarget.expressionId]
          \tlet mut arena = checkedTarget.expressions
          \tlet mut index = 1
          \twhile index < List.length(node.children) {
          \t\tlet armSourceId = childAt(node, index)?
          \t\tlet checkedArm = checkExpectedMatchArm(armSourceId, checkedTarget.valueType, expectedType, context, arena)?
          \t\tchildIds = List.append(childIds, checkedArm.expressionId)
          \t\tarena = checkedArm.expressions
          \t\tindex = index + 1
          \t}
          \treturn Ok(addHir(arena, MvpHirExpression {
          \t\tkind: "match",
          \t\ttext: node.text,
          \t\tvalueType: expectedType,
          \t\tchildren: childIds,
          \t\tspan: node.span,
          \t}, expectedType))
          }

          fn checkExpectedExpression(expressionId: Int, expectedType: MvpType, context: CheckContext, expressions: List<MvpHirExpression>) -> Result<CheckedExpression, MvpDiagnostic> {
          \tlet node = sourceExpressionAt(context, expressionId)?
          \tlet constructorName = standardConstructorName(node.text)
          \tif constructorName != "" && (node.kind == "identifier" || node.kind == "call") {
          \t\treturn checkExpectedVariant(node, expectedType, context, expressions)
          \t}
          \tif node.kind == "if" {
          \t\treturn checkExpectedConditional(node, expectedType, context, expressions)
          \t}
          \tif node.kind == "match" {
          \t\treturn checkExpectedMatch(node, expectedType, context, expressions)
          \t}
          \tlet checked = checkExpression(expressionId, context, expressions)?
          \tif !typesCompatible(checked.valueType, expectedType) {
          \t\treturn Err(typeMismatch(checked.valueType, expectedType, node.span))
          \t}
          \treturn Ok(checked)
          }'''
          unary_marker = '\nfn checkUnary('
          if unary_marker not in checker:
              raise SystemExit('Unable to locate checkUnary insertion point')
          checker = checker.replace(unary_marker, '\n' + helpers.strip() + '\n\nfn checkUnary(', 1)

          checker = replace_function(checker, 'checkLet', '''fn checkLet(name: String, mutable: Bool, annotation: MvpType?, sourceExpressionId: Int, statementSpan: MvpSpan, context: CheckContext, statements: List<MvpHirStatement>, expressions: List<MvpHirExpression>) -> Result<CheckedStatement, MvpDiagnostic> {
          \tif match findBinding(context.bindings, name) { Some(_) => true, None => false } {
          \t\treturn Err(errorDiagnostic("L1007", "Local name " + name + " shadows an existing name", statementSpan))
          \t}
          \tlet checked = match annotation {
          \t\tSome(expectedType) => checkExpectedExpression(sourceExpressionId, expectedType, context, expressions)
          \t\tNone => checkExpression(sourceExpressionId, context, expressions)
          \t}?
          \tlet expected = match annotation { Some(value) => value, None => checked.valueType }
          \treturn Ok(addHirStatement(
          \t\tstatements,
          \t\tchecked.expressions,
          \t\tList.append(context.bindings, Binding { name: name, valueType: expected, mutable: mutable }),
          \t\tMvpHirStatement.HirLet(name, mutable, expected, checked.expressionId, statementSpan),
          \t))
          }''')

          checker = replace_function(checker, 'checkAssignment', '''fn checkAssignment(name: String, sourceExpressionId: Int, statementSpan: MvpSpan, context: CheckContext, statements: List<MvpHirStatement>, expressions: List<MvpHirExpression>) -> Result<CheckedStatement, MvpDiagnostic> {
          \tlet found = findBinding(context.bindings, name)
          \tif match found { Some(_) => false, None => true } {
          \t\treturn Err(errorDiagnostic("L1009", "Unknown name " + name, statementSpan))
          \t}
          \tlet binding = match found {
          \t\tSome(value) => value
          \t\tNone => Binding { name: name, valueType: MvpType.ErrorType, mutable: false }
          \t}
          \tif !binding.mutable {
          \t\treturn Err(errorDiagnostic("L2010", "Cannot assign to immutable name " + name, statementSpan))
          \t}
          \tlet checked = checkExpectedExpression(sourceExpressionId, binding.valueType, context, expressions)?
          \treturn Ok(addHirStatement(
          \t\tstatements,
          \t\tchecked.expressions,
          \t\tcontext.bindings,
          \t\tMvpHirStatement.HirAssign(name, binding.valueType, checked.expressionId, statementSpan),
          \t))
          }''')

          checker = replace_function(checker, 'checkReturn', '''fn checkReturn(sourceExpressionId: Int, statementSpan: MvpSpan, context: CheckContext, statements: List<MvpHirStatement>, expressions: List<MvpHirExpression>) -> Result<CheckedStatement, MvpDiagnostic> {
          \tlet checked = checkExpectedExpression(sourceExpressionId, context.returnType, context, expressions)?
          \treturn Ok(addHirStatement(
          \t\tstatements,
          \t\tchecked.expressions,
          \t\tcontext.bindings,
          \t\tMvpHirStatement.HirReturn(checked.expressionId, statementSpan),
          \t))
          }''')
          checker_path.write_text(checker)

          emitter_path = Path('selfhost/mvp/src/emitter.virune')
          emitter = emitter_path.read_text()
          call_marker = '''fn emitCall(expression: MvpHirExpression, expressions: List<MvpHirExpression>) -> String {
          \tlet values = emitArguments(expression.children, expressions)
          \tif List.isEmpty(values) {
          \t\treturn expression.text + "($ctx)"
          \t}
          \treturn expression.text + "(" + String.join(values, ", ") + ", $ctx)"
          }'''
          if call_marker not in emitter:
              raise SystemExit('Unable to locate emitCall')
          variant_emitter = call_marker + '''

          fn emitVariant(expression: MvpHirExpression, expressions: List<MvpHirExpression>) -> String {
          \tif expression.text == "None" {
          \t\treturn "None"
          \t}
          \treturn expression.text + "(" + String.join(emitArguments(expression.children, expressions), ", ") + ")"
          }'''
          emitter = emitter.replace(call_marker, variant_emitter, 1)
          dispatch_marker = '''\tif expression.kind == "call" {
          \t\treturn emitCall(expression, expressions)
          \t}'''
          if dispatch_marker not in emitter:
              raise SystemExit('Unable to locate call dispatch')
          emitter = emitter.replace(dispatch_marker, '''\tif expression.kind == "variant" {
          \t\treturn emitVariant(expression, expressions)
          \t}
          ''' + dispatch_marker, 1)
          emitter_path.write_text(emitter)

          test_path = Path('packages/compiler/test/selfhost-variant-constructors.test.ts')
          test_path.write_text('''import assert from 'node:assert/strict';
          import test from 'node:test';
          import { execFile } from 'node:child_process';
          import { mkdir, mkdtemp, rm, writeFile } from 'node:fs/promises';
          import { dirname, join, relative, resolve } from 'node:path';
          import { promisify } from 'node:util';
          import { fileURLToPath, pathToFileURL } from 'node:url';
          import { buildProject } from '../src/project/project.js';
          import {
          \tcreateSelfhostMvpKernel,
          \ttype SelfhostMvpModule,
          } from '../src/selfhost/mvp-adapter.js';
          import { executeKernelOutputWithNode } from '../src/selfhost/node-executor.js';
          import type { KernelInputV1 } from '../src/selfhost/contract.js';

          const execFileAsync = promisify(execFile);
          const repositoryRoot = resolve(dirname(fileURLToPath(import.meta.url)), '../../../..');
          const mvpRoot = join(repositoryRoot, 'selfhost', 'mvp');
          const temporaryRoot = join(repositoryRoot, '.test-tmp');

          const input = (text: string): KernelInputV1 => ({
          \tcontractVersion: '1',
          \tlanguageVersion: '1.0',
          \tplatform: 'node',
          \tentryPath: 'src/main.virune',
          \tsources: [{ path: 'src/main.virune', text }],
          \tinteropManifest: { version: '1', modules: [] },
          \temit: { target: 'es2022', sourceMap: false, sourcesContent: true },
          });

          const runtimeSource = [
          \t'fn optionalValue(flag: Bool) -> Int? {',
          \t'\\tif flag {',
          \t'\\t\\treturn Option.Some(7)',
          \t'\\t}',
          \t'\\treturn Option.None',
          \t'}',
          \t'',
          \t'fn resultValue(flag: Bool) -> Result<Int, String> {',
          \t'\\tif flag {',
          \t'\\t\\treturn Result.Ok(9)',
          \t'\\t}',
          \t'\\treturn Result.Err("bad")',
          \t'}',
          \t'',
          \t'fn inferredValue() -> Int? {',
          \t'\\tlet value = Some(11)',
          \t'\\treturn value',
          \t'}',
          \t'',
          \t'pub fn main() -> Int {',
          \t'\\tlet optional = match optionalValue(true) {',
          \t'\\t\\tSome(value) => value',
          \t'\\t\\tNone => 0',
          \t'\\t}',
          \t'\\tlet result = match resultValue(true) {',
          \t'\\t\\tOk(value) => value',
          \t'\\t\\tErr(_) => 0',
          \t'\\t}',
          \t'\\tlet inferred = match inferredValue() {',
          \t'\\t\\tSome(value) => value',
          \t'\\t\\tNone => 0',
          \t'\\t}',
          \t'\\treturn optional + result + inferred',
          \t'}',
          \t'',
          ].join('\\n');

          const unresolvedNoneSource = [
          \t'pub fn main() -> Int {',
          \t'\\tlet missing = None',
          \t'\\treturn 0',
          \t'}',
          \t'',
          ].join('\\n');

          const unresolvedResultSource = [
          \t'pub fn main() -> Int {',
          \t'\\tlet unresolved = Ok(1)',
          \t'\\treturn 0',
          \t'}',
          \t'',
          ].join('\\n');

          test('Option and Result constructors resolve from expected types and execute', async () => {
          \tconst loaded = await loadMvpModule();
          \ttry {
          \t\tconst request = input(runtimeSource);
          \t\tconst output = await createSelfhostMvpKernel(loaded.module).compile(request);
          \t\tassert.equal(output.accepted, true, JSON.stringify(output.diagnostics, null, 2));
          \t\tassert.deepEqual(output.diagnostics, []);
          \t\tconst emittedCode = output.emittedModules.map(module => module.code).join('\\n');
          \t\tassert.match(emittedCode, /Some\\(7\\)/);
          \t\tassert.match(emittedCode, /return None;/);
          \t\tassert.match(emittedCode, /Ok\\(9\\)/);
          \t\tassert.match(emittedCode, /Err\\("bad"\\)/);
          \t\tassert.doesNotMatch(emittedCode, /(?:Some|Ok|Err)\\([^)]*, \\$ctx\\)/);
          \t\tconst runtime = await executeKernelOutputWithNode(request, output);
          \t\tassert.equal(runtime.returnValue, 27);
          \t\tassert.equal(runtime.panic, null);
          \t} finally {
          \t\tawait rm(loaded.root, { recursive: true, force: true });
          \t}
          });

          test('None without an expected Optional type reports an inference diagnostic', async () => {
          \tconst loaded = await loadMvpModule();
          \ttry {
          \t\tconst output = await createSelfhostMvpKernel(loaded.module).compile(input(unresolvedNoneSource));
          \t\tassert.equal(output.accepted, false);
          \t\tassert.equal(output.diagnostics[0]?.code, 'L2020');
          \t\tassert.match(output.diagnostics[0]?.message ?? '', /Cannot infer the Optional type of None/);
          \t} finally {
          \t\tawait rm(loaded.root, { recursive: true, force: true });
          \t}
          });

          test('Ok or Err without an expected Result type reports an inference diagnostic', async () => {
          \tconst loaded = await loadMvpModule();
          \ttry {
          \t\tconst output = await createSelfhostMvpKernel(loaded.module).compile(input(unresolvedResultSource));
          \t\tassert.equal(output.accepted, false);
          \t\tassert.equal(output.diagnostics[0]?.code, 'L2020');
          \t\tassert.match(output.diagnostics[0]?.message ?? '', /Cannot infer the complete Result type for Ok/);
          \t} finally {
          \t\tawait rm(loaded.root, { recursive: true, force: true });
          \t}
          });

          async function loadMvpModule(): Promise<{ readonly root: string; readonly module: SelfhostMvpModule }> {
          \tconst result = await buildProject(mvpRoot, { write: false });
          \tconst errors = result.diagnostics.filter(item => item.severity === 'error');
          \tassert.deepEqual(errors.map(item => item.code + ':' + item.message), []);

          \tawait mkdir(temporaryRoot, { recursive: true });
          \tconst root = await mkdtemp(join(temporaryRoot, 'selfhost-variant-constructors-'));
          \tconst configuredOutDir = resolve(mvpRoot, 'dist');
          \tconst outputPaths: string[] = [];
          \tfor (const built of result.modules) {
          \t\tif (built.output === undefined || built.outputPath === undefined) continue;
          \t\tconst outputPath = join(root, relative(configuredOutDir, built.outputPath));
          \t\tawait mkdir(dirname(outputPath), { recursive: true });
          \t\tawait writeFile(outputPath, built.output.code);
          \t\toutputPaths.push(outputPath);
          \t}
          \tfor (const outputPath of outputPaths.sort()) {
          \t\tawait execFileAsync(process.execPath, ['--check', outputPath]);
          \t}
          \tconst moduleUrl = pathToFileURL(join(root, 'main.js')).href + '?test=' + Date.now();
          \treturn { root, module: await import(moduleUrl) as SelfhostMvpModule };
          }
          ''')

          Path('.github/workflows/tmp-selfhost-variant-constructors-pr.yml').unlink()
          PY
      - run: npm run build
