name: Temporary frontend repetition refactor

on:
  push:
    branches: [refactor/frontend-repetition-evidence]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Apply atomic repetition evidence refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new))

          replace(
              'packages/compiler/src/ast/nodes.ts',
              """export interface ViewRepetition extends AstNode {
          \treadonly kind: 'ViewRepetition'; readonly itemName: string; readonly indexName?: string; readonly source: Expression; readonly body: ViewBlock;
          \titemSymbolId?: SymbolId; indexSymbolId?: SymbolId; sourceKind?: 'native-list' | 'external-array';
          }
          """,
              """export interface ViewRepetitionEvidence {
          \treadonly sourceKind: 'native-list' | 'external-array';
          \treadonly itemSymbolId: SymbolId;
          \treadonly indexSymbolId: SymbolId | undefined;
          }
          export interface ViewRepetition extends AstNode {
          \treadonly kind: 'ViewRepetition'; readonly itemName: string; readonly indexName?: string; readonly source: Expression; readonly body: ViewBlock;
          \tcheckedEvidence?: ViewRepetitionEvidence;
          }
          """,
          )

          replace(
              'packages/compiler/src/checker/checker.ts',
              """\tprivate checkViewRepetition(repetition: A.ViewRepetition, scope: Scope): void {
          \t\tconst sourceTypeId = this.checkExpression(repetition.source, scope);
          \t\tconst sourceType = this.arena.get(sourceTypeId);
          \t\tlet itemType = this.arena.error;
          \t\tif (sourceType.kind === 'list') {
          \t\t\trepetition.sourceKind = 'native-list';
          \t\t\titemType = sourceType.element;
          \t\t} else if (sourceType.kind === 'foreign' && sourceType.snapshot.category === 'array') {
          \t\t\tconst provider = this.currentInteropProvider(sourceType.snapshot);
          \t\t\tlet element: ForeignTypeSnapshot | undefined;
          \t\t\tif (provider?.resolveArrayElement !== undefined) {
          \t\t\t\ttry { element = provider.resolveArrayElement(sourceType.ref); } catch { element = undefined; }
          \t\t\t}
          \t\t\tif (provider !== undefined && this.isCurrentForeignSnapshot(element, provider, false)) {
          \t\t\t\tthis.requireEffects(['JavaScript'], repetition.span);
          \t\t\t\trepetition.sourceKind = 'external-array';
          \t\t\t\titemType = this.arena.foreign(element);
          \t\t\t}
          \t\t}
          \t\tif (repetition.sourceKind === undefined) this.diagnostics.error('L4310', 'View repetition requires a native List or proven External Array source', repetition.source.span);

          \t\tconst childScope = new Scope(scope);
          \t\tconst item = this.#factory.create(repetition.itemName, 'variable', itemType, repetition.span, { declaration: repetition });
          \t\tif (!childScope.define(item)) this.diagnostics.error('L1008', `View repetition item ${repetition.itemName} shadows an existing name`, repetition.span);
          \t\telse { repetition.itemSymbolId = item.id; this.#symbols.set(item.id, item); }
          \t\tif (repetition.indexName !== undefined) {
          \t\t\tconst index = this.#factory.create(repetition.indexName, 'variable', this.arena.int, repetition.span, { declaration: repetition });
          \t\t\tif (!childScope.define(index)) this.diagnostics.error('L1008', `View repetition index ${repetition.indexName} shadows an existing name`, repetition.span);
          \t\t\telse { repetition.indexSymbolId = index.id; this.#symbols.set(index.id, index); }
          \t\t}
          \t\tthis.checkViewBlock(repetition.body, childScope, true);
          \t}
          """,
              """\tprivate checkViewRepetition(repetition: A.ViewRepetition, scope: Scope): void {
          \t\tconst sourceTypeId = this.checkExpression(repetition.source, scope);
          \t\tconst sourceType = this.arena.get(sourceTypeId);
          \t\tlet sourceKind: A.ViewRepetitionEvidence['sourceKind'] | undefined;
          \t\tlet itemType = this.arena.error;
          \t\tif (sourceType.kind === 'list') {
          \t\t\tsourceKind = 'native-list';
          \t\t\titemType = sourceType.element;
          \t\t} else if (sourceType.kind === 'foreign' && sourceType.snapshot.category === 'array') {
          \t\t\tconst provider = this.currentInteropProvider(sourceType.snapshot);
          \t\t\tlet element: ForeignTypeSnapshot | undefined;
          \t\t\tif (provider?.resolveArrayElement !== undefined) {
          \t\t\t\ttry { element = provider.resolveArrayElement(sourceType.ref); } catch { element = undefined; }
          \t\t\t}
          \t\t\tif (provider !== undefined && this.isCurrentForeignSnapshot(element, provider, false)) {
          \t\t\t\tthis.requireEffects(['JavaScript'], repetition.span);
          \t\t\t\tsourceKind = 'external-array';
          \t\t\t\titemType = this.arena.foreign(element);
          \t\t\t}
          \t\t}
          \t\tif (sourceKind === undefined) this.diagnostics.error('L4310', 'View repetition requires a native List or proven External Array source', repetition.source.span);

          \t\tconst childScope = new Scope(scope);
          \t\tconst item = this.#factory.create(repetition.itemName, 'variable', itemType, repetition.span, { declaration: repetition });
          \t\tlet itemSymbolId: SymbolId | undefined;
          \t\tif (!childScope.define(item)) this.diagnostics.error('L1008', `View repetition item ${repetition.itemName} shadows an existing name`, repetition.span);
          \t\telse { itemSymbolId = item.id; this.#symbols.set(item.id, item); }
          \t\tlet indexSymbolId: SymbolId | undefined;
          \t\tif (repetition.indexName !== undefined) {
          \t\t\tconst index = this.#factory.create(repetition.indexName, 'variable', this.arena.int, repetition.span, { declaration: repetition });
          \t\t\tif (!childScope.define(index)) this.diagnostics.error('L1008', `View repetition index ${repetition.indexName} shadows an existing name`, repetition.span);
          \t\t\telse { indexSymbolId = index.id; this.#symbols.set(index.id, index); }
          \t\t}
          \t\tif (sourceKind !== undefined && itemSymbolId !== undefined && (repetition.indexName === undefined || indexSymbolId !== undefined)) {
          \t\t\trepetition.checkedEvidence = { sourceKind, itemSymbolId, indexSymbolId };
          \t\t}
          \t\tthis.checkViewBlock(repetition.body, childScope, true);
          \t}
          """,
          )

          replace(
              'packages/compiler/src/interop/jsx-view-validation.ts',
              """function renderViewRepetition(repetition: A.ViewRepetition, context: RenderContext): string | undefined {
          \tif (repetition.itemSymbolId === undefined || repetition.sourceKind === undefined) return fail(context, repetition.span, 'View repetition reached JSX validation without checked repetition evidence');
          \tif (repetition.indexName !== undefined && repetition.indexSymbolId === undefined) return fail(context, repetition.span, 'View repetition index reached JSX validation without a checked binding');
          \tconst source = repetition.sourceKind === 'external-array'
          \t\t? renderExternalRepetitionSource(repetition.source, context)
          \t\t: renderNativeRepetitionSource(repetition, context);
          \tif (source === undefined) return undefined;
          \tconst sourceName = `$viruneViewSource${repetition.id}`;
          \tconst lengthName = `$viruneViewLength${repetition.id}`;
          \tconst indexName = `$viruneViewIndex${repetition.id}`;
          \tconst itemName = `$viruneViewItem${repetition.id}`;
          \tconst childrenName = `$viruneViewChildren${repetition.id}`;
          \tconst previousItem = context.repetitionValues.get(repetition.itemSymbolId);
          \tconst hadItem = context.repetitionValues.has(repetition.itemSymbolId);
          \tcontext.repetitionValues.set(repetition.itemSymbolId, itemName);
          \tlet previousIndex: string | undefined;
          \tlet hadIndex = false;
          \tif (repetition.indexSymbolId !== undefined) {
          \t\tpreviousIndex = context.repetitionValues.get(repetition.indexSymbolId);
          \t\thadIndex = context.repetitionValues.has(repetition.indexSymbolId);
          \t\tcontext.repetitionValues.set(repetition.indexSymbolId, indexName);
          \t}
          \tconst body = renderRepetitionBlock(repetition.body, childrenName, context, 2);
          \tif (hadItem) context.repetitionValues.set(repetition.itemSymbolId, previousItem!);
          \telse context.repetitionValues.delete(repetition.itemSymbolId);
          \tif (repetition.indexSymbolId !== undefined) {
          \t\tif (hadIndex) context.repetitionValues.set(repetition.indexSymbolId, previousIndex!);
          \t\telse context.repetitionValues.delete(repetition.indexSymbolId);
          \t}
          \tif (body === undefined) return undefined;
          \tconst holeGuard = repetition.sourceKind === 'external-array' ? `\\n\\t\\tif (!Object.prototype.hasOwnProperty.call(${sourceName}, ${indexName})) continue;` : '';
          \tconst bodyText = body.length === 0 ? '' : `\\n${body}`;
          \treturn `(() => {\\n\\tconst ${sourceName} = ${source};\\n\\tconst ${lengthName} = ${sourceName}.length;\\n\\tconst ${childrenName} = [];\\n\\tfor (let ${indexName} = 0; ${indexName} < ${lengthName}; ${indexName}++) {${holeGuard}\\n\\t\\tconst ${itemName} = ${sourceName}[${indexName}] as (typeof ${sourceName})[number];${bodyText}\\n\\t}\\n\\treturn ${childrenName};\\n})()`;
          }
          """,
              """function renderViewRepetition(repetition: A.ViewRepetition, context: RenderContext): string | undefined {
          \tconst evidence = repetition.checkedEvidence;
          \tif (evidence === undefined) return fail(context, repetition.span, 'View repetition reached JSX validation without checked repetition evidence');
          \tif ((repetition.indexName === undefined) !== (evidence.indexSymbolId === undefined)) return fail(context, repetition.span, 'View repetition checked evidence does not match its source index binding');
          \tconst source = evidence.sourceKind === 'external-array'
          \t\t? renderExternalRepetitionSource(repetition.source, context)
          \t\t: renderNativeRepetitionSource(repetition, evidence, context);
          \tif (source === undefined) return undefined;
          \tconst sourceName = `$viruneViewSource${repetition.id}`;
          \tconst lengthName = `$viruneViewLength${repetition.id}`;
          \tconst indexName = `$viruneViewIndex${repetition.id}`;
          \tconst itemName = `$viruneViewItem${repetition.id}`;
          \tconst childrenName = `$viruneViewChildren${repetition.id}`;
          \tconst previousItem = context.repetitionValues.get(evidence.itemSymbolId);
          \tconst hadItem = context.repetitionValues.has(evidence.itemSymbolId);
          \tcontext.repetitionValues.set(evidence.itemSymbolId, itemName);
          \tlet previousIndex: string | undefined;
          \tlet hadIndex = false;
          \tif (evidence.indexSymbolId !== undefined) {
          \t\tpreviousIndex = context.repetitionValues.get(evidence.indexSymbolId);
          \t\thadIndex = context.repetitionValues.has(evidence.indexSymbolId);
          \t\tcontext.repetitionValues.set(evidence.indexSymbolId, indexName);
          \t}
          \tconst body = renderRepetitionBlock(repetition.body, childrenName, context, 2);
          \tif (hadItem) context.repetitionValues.set(evidence.itemSymbolId, previousItem!);
          \telse context.repetitionValues.delete(evidence.itemSymbolId);
          \tif (evidence.indexSymbolId !== undefined) {
          \t\tif (hadIndex) context.repetitionValues.set(evidence.indexSymbolId, previousIndex!);
          \t\telse context.repetitionValues.delete(evidence.indexSymbolId);
          \t}
          \tif (body === undefined) return undefined;
          \tconst holeGuard = evidence.sourceKind === 'external-array' ? `\\n\\t\\tif (!Object.prototype.hasOwnProperty.call(${sourceName}, ${indexName})) continue;` : '';
          \tconst bodyText = body.length === 0 ? '' : `\\n${body}`;
          \treturn `(() => {\\n\\tconst ${sourceName} = ${source};\\n\\tconst ${lengthName} = ${sourceName}.length;\\n\\tconst ${childrenName} = [];\\n\\tfor (let ${indexName} = 0; ${indexName} < ${lengthName}; ${indexName}++) {${holeGuard}\\n\\t\\tconst ${itemName} = ${sourceName}[${indexName}] as (typeof ${sourceName})[number];${bodyText}\\n\\t}\\n\\treturn ${childrenName};\\n})()`;
          }
          """,
          )

          replace(
              'packages/compiler/src/interop/jsx-view-validation.ts',
              """function renderNativeRepetitionSource(repetition: A.ViewRepetition, context: RenderContext): string | undefined {
          \tif (repetition.source.kind === 'ListExpression' && repetition.source.items.length > 0) {
          \t\tconst items: string[] = [];
          \t\tfor (const item of repetition.source.items) {
          \t\t\tconst rendered = renderViewValue(item, context);
          \t\t\tif (rendered === undefined) return undefined;
          \t\t\titems.push(rendered);
          \t\t}
          \t\treturn `[${items.join(', ')}]`;
          \t}
          \tif (repetition.itemSymbolId === undefined) return fail(context, repetition.span, 'native View repetition item has no checked binding');
          \tconst symbol = context.semantic.symbols.get(repetition.itemSymbolId);
          \tif (symbol === undefined) return fail(context, repetition.span, 'native View repetition item binding is unavailable to JSX validation');
          \tconst probe = renderTypeProbe(symbol.typeId, context, repetition.span);
          \treturn probe === undefined ? undefined : `[${probe}]`;
          }
          """,
              """function renderNativeRepetitionSource(repetition: A.ViewRepetition, evidence: A.ViewRepetitionEvidence, context: RenderContext): string | undefined {
          \tif (repetition.source.kind === 'ListExpression' && repetition.source.items.length > 0) {
          \t\tconst items: string[] = [];
          \t\tfor (const item of repetition.source.items) {
          \t\t\tconst rendered = renderViewValue(item, context);
          \t\t\tif (rendered === undefined) return undefined;
          \t\t\titems.push(rendered);
          \t\t}
          \t\treturn `[${items.join(', ')}]`;
          \t}
          \tconst symbol = context.semantic.symbols.get(evidence.itemSymbolId);
          \tif (symbol === undefined) return fail(context, repetition.span, 'native View repetition item binding is unavailable to JSX validation');
          \tconst probe = renderTypeProbe(symbol.typeId, context, repetition.span);
          \treturn probe === undefined ? undefined : `[${probe}]`;
          }
          """,
          )

          replace(
              'packages/compiler/src/codegen/emitter.ts',
              """\tprivate viewRepetitionExpression(repetition: A.ViewRepetition, contextName: string): string {
          \t\tif (repetition.sourceKind === undefined || repetition.itemSymbolId === undefined || (repetition.indexName !== undefined && repetition.indexSymbolId === undefined)) return panicEmitter('View repetition reached emission without checked repetition evidence');
          \t\tconst target = `$viewChildren${this.#temporary++}`;
          \t\treturn [
          \t\t\t'(() => {',
          \t\t\t`\\tconst ${target} = [];`,
          \t\t\t...this.viewRepetitionLines(repetition, target, contextName, 1),
          \t\t\t`\\treturn ${target};`,
          \t\t\t'})()',
          \t\t].join('\\n');
          \t}

          \tprivate viewRepetitionLines(repetition: A.ViewRepetition, target: string, contextName: string, indent: number): string[] {
          \t\tif (repetition.sourceKind === undefined || repetition.itemSymbolId === undefined || (repetition.indexName !== undefined && repetition.indexSymbolId === undefined)) return panicEmitter('View repetition reached emission without checked repetition evidence');
          \t\tconst prefix = '\\t'.repeat(indent);
          \t\tconst sourceName = `$viewSource${this.#temporary++}`;
          \t\tconst lengthName = `$viewLength${this.#temporary++}`;
          \t\tconst sourceIndexName = `$viewIndex${this.#temporary++}`;
          \t\tconst itemName = this.nameOf(repetition.itemSymbolId, repetition.itemName);
          \t\tconst lines = [
          \t\t\t`${prefix}const ${sourceName} = ${this.expression(repetition.source, contextName)};`,
          \t\t\t`${prefix}const ${lengthName} = ${sourceName}.length;`,
          \t\t\t`${prefix}for (let ${sourceIndexName} = 0; ${sourceIndexName} < ${lengthName}; ${sourceIndexName}++) {`,
          \t\t];
          \t\tif (repetition.sourceKind === 'external-array') lines.push(`${prefix}\\tif (!Object.prototype.hasOwnProperty.call(${sourceName}, ${sourceIndexName})) continue;`);
          \t\tlines.push(`${prefix}\\tconst ${itemName} = ${sourceName}[${sourceIndexName}];`);
          \t\tif (repetition.indexName !== undefined && repetition.indexSymbolId !== undefined) lines.push(`${prefix}\\tconst ${this.nameOf(repetition.indexSymbolId, repetition.indexName)} = ${sourceIndexName};`);
          \t\tlines.push(...this.viewRepetitionBlockLines(repetition.body, target, contextName, indent + 1));
          \t\tlines.push(`${prefix}}`);
          \t\treturn lines;
          \t}
          """,
              """\tprivate checkedViewRepetitionEvidence(repetition: A.ViewRepetition): A.ViewRepetitionEvidence {
          \t\tconst evidence = repetition.checkedEvidence;
          \t\tif (evidence === undefined || (repetition.indexName === undefined) !== (evidence.indexSymbolId === undefined)) return panicEmitter('View repetition reached emission without matching checked repetition evidence');
          \t\treturn evidence;
          \t}

          \tprivate viewRepetitionExpression(repetition: A.ViewRepetition, contextName: string): string {
          \t\tthis.checkedViewRepetitionEvidence(repetition);
          \t\tconst target = `$viewChildren${this.#temporary++}`;
          \t\treturn [
          \t\t\t'(() => {',
          \t\t\t`\\tconst ${target} = [];`,
          \t\t\t...this.viewRepetitionLines(repetition, target, contextName, 1),
          \t\t\t`\\treturn ${target};`,
          \t\t\t'})()',
          \t\t].join('\\n');
          \t}

          \tprivate viewRepetitionLines(repetition: A.ViewRepetition, target: string, contextName: string, indent: number): string[] {
          \t\tconst evidence = this.checkedViewRepetitionEvidence(repetition);
          \t\tconst prefix = '\\t'.repeat(indent);
          \t\tconst sourceName = `$viewSource${this.#temporary++}`;
          \t\tconst lengthName = `$viewLength${this.#temporary++}`;
          \t\tconst sourceIndexName = `$viewIndex${this.#temporary++}`;
          \t\tconst itemName = this.nameOf(evidence.itemSymbolId, repetition.itemName);
          \t\tconst lines = [
          \t\t\t`${prefix}const ${sourceName} = ${this.expression(repetition.source, contextName)};`,
          \t\t\t`${prefix}const ${lengthName} = ${sourceName}.length;`,
          \t\t\t`${prefix}for (let ${sourceIndexName} = 0; ${sourceIndexName} < ${lengthName}; ${sourceIndexName}++) {`,
          \t\t];
          \t\tif (evidence.sourceKind === 'external-array') lines.push(`${prefix}\\tif (!Object.prototype.hasOwnProperty.call(${sourceName}, ${sourceIndexName})) continue;`);
          \t\tlines.push(`${prefix}\\tconst ${itemName} = ${sourceName}[${sourceIndexName}];`);
          \t\tif (repetition.indexName !== undefined) lines.push(`${prefix}\\tconst ${this.nameOf(evidence.indexSymbolId, repetition.indexName)} = ${sourceIndexName};`);
          \t\tlines.push(...this.viewRepetitionBlockLines(repetition.body, target, contextName, indent + 1));
          \t\tlines.push(`${prefix}}`);
          \t\treturn lines;
          \t}
          """,
          )

          replace(
              'packages/compiler/test/frontend-component-view.test.ts',
              """\tassert.equal(repetition.sourceKind, 'native-list');
          \tassert.ok(repetition.itemSymbolId !== undefined);
          \tassert.ok(repetition.indexSymbolId !== undefined);
          """,
              """\tassert.equal(repetition.checkedEvidence?.sourceKind, 'native-list');
          \tassert.ok(repetition.checkedEvidence?.itemSymbolId !== undefined);
          \tassert.ok(repetition.checkedEvidence?.indexSymbolId !== undefined);
          """,
          )

          replace(
              'packages/compiler/test/frontend-component-view.test.ts',
              """test('View repetition rejects unsupported native collection sources', () => {
          \tassert.ok(errorCodes(`component SetView(items: Set<Int>) uses JavaScript {
          \treturn view {
          \t\tfor item in items {
          \t\t\tspan()
          \t\t}
          \t}
          }
          `).includes('L4310'));
          });
          """,
              """test('View repetition rejects unsupported native collection sources', () => {
          \tconst codes = errorCodes(`component SetView(items: Set<Int>) uses JavaScript {
          \treturn view {
          \t\tfor item, index in items {
          \t\t\tspan(value: item, position: index)
          \t\t}
          \t}
          }
          `);
          \tassert.ok(codes.includes('L4310'));
          \tassert.ok(!codes.includes('L1009'));
          });
          """,
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Focused frontend tests
        run: node --test packages/compiler/dist/test/frontend-component-view.test.js packages/compiler/dist/test/frontend-preserved-jsx-emission.test.js
      - name: Commit refactor and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-frontend-repetition-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/compiler/src/ast/nodes.ts packages/compiler/src/checker/checker.ts packages/compiler/src/interop/jsx-view-validation.ts packages/compiler/src/codegen/emitter.ts packages/compiler/test/frontend-component-view.test.ts .github/workflows/temporary-frontend-repetition-refactor.yml
          git commit -m "refactor(frontend): make repetition evidence atomic"
          git push origin HEAD:refactor/frontend-repetition-evidence
