name: Temporary frontend repetition refactor follow-up

on:
  push:
    branches: [refactor/frontend-repetition-evidence]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Apply review fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new))

          replace(
              'packages/compiler/src/checker/checker.ts',
              """\tprivate checkViewRepetition(repetition: A.ViewRepetition, scope: Scope): void {
          \t\tconst sourceTypeId = this.checkExpression(repetition.source, scope);
          """,
              """\tprivate checkViewRepetition(repetition: A.ViewRepetition, scope: Scope): void {
          \t\tdelete repetition.checkedEvidence;
          \t\tconst sourceTypeId = this.checkExpression(repetition.source, scope);
          """,
          )

          replace(
              'packages/compiler/test/frontend-component-view.test.ts',
              """test('View repetition rejects unsupported native collection sources', () => {
          \tconst codes = errorCodes(`component SetView(items: Set<Int>) uses JavaScript {
          \treturn view {
          \t\tfor item, index in items {
          \t\t\tspan(value: item, position: index)
          \t\t}
          \t}
          }
          `);
          \tassert.ok(codes.includes('L4310'));
          \tassert.ok(!codes.includes('L1009'));
          });
          """,
              """test('View repetition rejects unsupported native collection sources', () => {
          \tconst parsed = parseSource(source(`component SetView(items: Set<Int>) uses JavaScript {
          \treturn view {
          \t\tfor item, index in items {
          \t\t\tspan(value: item, position: index)
          \t\t}
          \t}
          }
          `));
          \tassert.ok(parsed.ast);
          \tassert.deepEqual(parsed.diagnostics.filter(item => item.severity === 'error'), []);
          \tconst component = parsed.ast.declarations.find((declaration): declaration is ComponentDeclaration => declaration.kind === 'ComponentDeclaration');
          \tassert.ok(component);
          \tconst returned = component.body.statements[0] as ReturnStatement;
          \tconst view = returned.value as ViewExpression;
          \tconst repetition = view.body.children[0];
          \tassert.equal(repetition?.kind, 'ViewRepetition');
          \tif (repetition?.kind !== 'ViewRepetition') throw new Error('expected ViewRepetition');
          \trepetition.checkedEvidence = { sourceKind: 'native-list', itemSymbolId: 999999, indexSymbolId: 999998 };
          \tconst semantic = checkModule(parsed.ast, { containingFile: parsed.source.path });
          \tconst codes = semantic.diagnostics.items.filter(item => item.severity === 'error').map(item => item.code);
          \tassert.ok(codes.includes('L4310'));
          \tassert.ok(!codes.includes('L1009'));
          \tassert.equal(repetition.checkedEvidence, undefined);
          });
          """,
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Focused frontend tests
        run: node --test packages/compiler/dist/test/frontend-component-view.test.js packages/compiler/dist/test/frontend-preserved-jsx-emission.test.js
      - name: Commit review fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-frontend-repetition-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/compiler/src/checker/checker.ts packages/compiler/test/frontend-component-view.test.ts .github/workflows/temporary-frontend-repetition-refactor.yml
          git commit -m "test(frontend): reject stale repetition evidence"
          git push origin HEAD:refactor/frontend-repetition-evidence
