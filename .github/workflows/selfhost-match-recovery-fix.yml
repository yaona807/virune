name: Self-host match recovery repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/selfhost-match-pattern-ast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-match-pattern-ast
      - name: Preserve the next arm after a missing arrow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('selfhost/mvp/src/frontend-parser-core.virune')
          text = path.read_text()
          old = '''\t\tif isText(state, tokens, "=>") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected => after a match pattern", state.index)\n\t\t\tstate = synchronizeMatchArm(state, tokens)\n\t\t}\n\t\tif !atEnd(state, tokens) && !isText(state, tokens, "}") {'''
          new = '''\t\tlet mut hasArrow = false\n\t\tif isText(state, tokens, "=>") {\n\t\t\tstate = advance(state)\n\t\t\thasArrow = true\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected => after a match pattern", state.index)\n\t\t\tstate = synchronizeMatchArm(state, tokens)\n\t\t}\n\t\tif hasArrow && !atEnd(state, tokens) && !isText(state, tokens, "}") {'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('match recovery block not found')
          path.write_text(text)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/frontend-parser-core.virune
          git commit -m "fix(selfhost): preserve match arms after missing arrows"
          git push origin HEAD:agent/selfhost-match-pattern-ast
