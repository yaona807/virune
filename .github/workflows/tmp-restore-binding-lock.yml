name: Temporary restore binding lockfile

on:
  push:
    branches: [build/update-fast-uri-lock]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: build/update-fast-uri-lock
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Restore unrelated fixture lockfile and validate root audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- corpus/bindings/package-lock.json
          npm ci
          npm audit --audit-level=moderate
          rm .github/workflows/tmp-restore-binding-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/bindings/package-lock.json .github/workflows/tmp-restore-binding-lock.yml
          git diff --cached --check
          git commit -m "chore: restore unrelated binding corpus lockfile"
          git push origin HEAD:build/update-fast-uri-lock
