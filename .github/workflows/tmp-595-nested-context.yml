name: Temporary issue 595 nested context patch

on:
  push:
    branches: [fix/595-contextual-object-callback]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/595-contextual-object-callback
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Apply nested fresh-context fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | python3
          npm ci
          npm run check
          node --test packages/js-interop/dist/test/contextual-object-callback.test.js packages/js-interop/dist/test/contextual-object-callback-fail-closed.test.js packages/js-interop/dist/test/contextual-external-callable.test.js packages/js-interop/dist/test/contextual-operations.test.js
          rm .github/workflows/tmp-595-nested-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/compiler/src/codegen/emitter.ts packages/js-interop/test/contextual-object-callback.test.ts .github/workflows/tmp-595-nested-context.yml
          git diff --cached --check
          git commit -m "fix(interop): give nested sync callbacks fresh context"
          git push origin HEAD:fix/595-contextual-object-callback
