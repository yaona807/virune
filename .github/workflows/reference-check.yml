name: Reference check

on:
  pull_request:
    paths:
      - 'spec/**'
      - 'scripts/build-reference.mjs'
      - 'scripts/build-reference.test.mjs'
      - '.github/actions-policy.json'
      - '.github/workflows/reference-check.yml'
      - '.github/workflows/reference-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'spec/**'
      - 'scripts/build-reference.mjs'
      - 'scripts/build-reference.test.mjs'
      - '.github/actions-policy.json'
      - '.github/workflows/reference-check.yml'
      - '.github/workflows/reference-pages.yml'

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Test Reference boundary handling
        run: node --test scripts/build-reference.test.mjs
      - name: Verify deterministic Reference projection
        run: node scripts/build-reference.mjs --check --source-sha="$GITHUB_SHA"
