name: Reference check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'spec/**'
      - 'scripts/build-reference.mjs'
      - 'scripts/build-reference.test.mjs'
      - 'scripts/verify-spec.mjs'
      - '.github/actions-policy.json'
      - '.github/workflows/reference-check.yml'
      - '.github/workflows/reference-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'spec/**'
      - 'scripts/build-reference.mjs'
      - 'scripts/build-reference.test.mjs'
      - 'scripts/verify-spec.mjs'
      - '.github/actions-policy.json'
      - '.github/workflows/reference-check.yml'
      - '.github/workflows/reference-pages.yml'

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REFERENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.REFERENCE_SOURCE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Reference boundary handling
        run: node --test scripts/build-reference.test.mjs
      - name: Verify deterministic Reference projection
        run: node scripts/build-reference.mjs --check --source-sha="$REFERENCE_SOURCE_SHA"
      - name: Build exact-head preview
        if: github.event_name == 'pull_request'
        run: node scripts/build-reference.mjs --source-sha="$REFERENCE_SOURCE_SHA" --output=.cache/reference/site
      - name: Upload exact-head preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-preview
          path: .cache/reference/site
          if-no-files-found: error
          retention-days: 7
