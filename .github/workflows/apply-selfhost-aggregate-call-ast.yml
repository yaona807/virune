name: Apply self-host aggregate and call AST patch

on:
  push:
    branches:
      - agent/selfhost-aggregate-call-ast
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[aggregate-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/selfhost-aggregate-call-ast
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/apply-selfhost-aggregate-call-ast.mjs
      - name: Commit generated implementation
        run: |
          rm scripts/apply-selfhost-aggregate-call-ast.mjs
          rm .github/workflows/apply-selfhost-aggregate-call-ast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfhost/mvp/src/frontend-parser-core.virune \
            selfhost/mvp/src/frontend-aggregate-call-expression.spec.virune \
            packages/compiler/test/selfhost-aggregate-call-expression-ast.test.ts \
            docs/self-hosting-frontend.md \
            docs/self-hosting-frontend_ja.md \
            scripts/apply-selfhost-aggregate-call-ast.mjs \
            .github/workflows/apply-selfhost-aggregate-call-ast.yml
          git commit -m "compiler(selfhost): add aggregate and call expression AST [aggregate-generated]"
          git push origin HEAD:agent/selfhost-aggregate-call-ast
