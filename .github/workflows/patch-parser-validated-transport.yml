name: Patch parser validated transport

on:
  push:
    branches:
      - agent/selfhost-frontend-parser-core
    paths:
      - .github/workflows/patch-parser-validated-transport.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-frontend-parser-core
          fetch-depth: 0
      - name: Decode transport by validated payload attempts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('selfhost/mvp/src/frontend-parser-core.virune')
          content = path.read_text(encoding='utf-8')
          start = content.index('fn unwrapModuleTransport(')
          end = content.index('\n\n@jsExport\npub fn parseFrontendCore', start)
          replacement = '''fn decodeFrontend(source: String) -> Result<FrontendLexResult, List<JsonError>> {
          \tlet mut current = lexFrontendJson(source)?
          \tlet mut depth = 0
          \twhile depth < 8 {
          \t\tlet decoded = Json.decode<FrontendLexResult>(current)
          \t\tmatch decoded {
          \t\t\tOk(value) => return Ok(value)
          \t\t\tErr(_) => {
          \t\t\t\tcurrent = Json.decode<String>(current)?
          \t\t\t\tdepth = depth + 1
          \t\t\t}
          \t\t}
          \t}
          \treturn Json.decode<FrontendLexResult>(current)
          }'''
          path.write_text(content[:start] + replacement + content[end:], encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git rm .github/workflows/patch-parser-validated-transport.yml
          git add selfhost/mvp/src/frontend-parser-core.virune
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(selfhost): validate each lexer transport layer"
          git push origin HEAD:agent/selfhost-frontend-parser-core
