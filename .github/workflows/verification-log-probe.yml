name: Verification failed log probe

on:
  push:
    branches:
      - 'release-verification/v1.0.0-rc.1'
    paths:
      - '.github/verification-log-probe-request.json'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download failed verification log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run view 30199414354 --repo "$GITHUB_REPOSITORY" --log-failed > .github/verification-failed-log.txt 2>&1 || true
      - name: Commit failed log
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/verification-failed-log.txt
          git commit -m "ci: record public verification failure log"
          git push origin HEAD
