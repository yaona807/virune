name: Selfhost PR155 sync main

on:
  push:
    branches:
      - selfhost/local-must-use-analysis
    paths:
      - .github/workflows/selfhost-pr155-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfhost/local-must-use-analysis
          fetch-depth: 0
      - name: Merge latest main and preserve both semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          cat > selfhost/mvp/src/main.virune <<'VIRUNE'
          //! Minimal vertical self-host compiler slice.
          //!
          //! Each stage exposes only a Result-based JSON boundary. Internal compiler
          //! models remain private to their implementation modules, while the TypeScript
          //! Host adapts the final payload to Kernel Contract v1. Data types, type
          //! operations, symbol scopes, module visibility, pattern coverage, and local
          //! must-use analysis cross module boundaries only as JSON.

          import { checkMvpJson } from "./checker.virune"
          import { emitMvpJson } from "./emitter.virune"
          import { lexFrontend } from "./frontend-lexer.virune"
          import { checkFrontendMustUseJson } from "./frontend-must-use.virune"
          import { parseFrontendCore } from "./frontend-parser-core.virune"
          import { checkFrontendPatternCoverageJson } from "./frontend-pattern-coverage.virune"
          import { checkFrontendDataTypesJson } from "./frontend-semantic.virune"
          import { checkFrontendModuleVisibilityJson } from "./frontend-symbol-visibility.virune"
          import { buildFrontendSymbolScopeJson } from "./frontend-symbol-scope.virune"
          import { checkFrontendTypeOperationsJson } from "./frontend-type-operations.virune"
          import { lexMvpJson } from "./lexer.virune"
          import { parseMvpJson } from "./parser.virune"

          @jsExport
          pub fn compileMvp(source: String) -> Result<String, List<JsonError>> {
          	let lexed = lexMvpJson(source)?
          	let parsed = parseMvpJson(lexed)?
          	let checked = checkMvpJson(parsed)?
          	return emitMvpJson(checked)
          }

          @jsExport
          pub fn lexFrontendContract(source: String) -> Result<String, List<JsonError>> {
          	return lexFrontend(source)
          }

          @jsExport
          pub fn parseFrontendContract(source: String) -> Result<String, List<JsonError>> {
          	return parseFrontendCore(source)
          }

          @jsExport
          pub fn checkFrontendDataTypesContract(source: String) -> Result<String, List<JsonError>> {
          	return checkFrontendDataTypesJson(source)
          }

          @jsExport
          pub fn checkFrontendTypeOperationsContract(request: String) -> Result<String, List<JsonError>> {
          	return checkFrontendTypeOperationsJson(request)
          }

          @jsExport
          pub fn buildFrontendSymbolScopeContract(request: String) -> Result<String, List<JsonError>> {
          	return buildFrontendSymbolScopeJson(request)
          }

          @jsExport
          pub fn checkFrontendModuleVisibilityContract(request: String) -> Result<String, List<JsonError>> {
          	return checkFrontendModuleVisibilityJson(request)
          }

          @jsExport
          pub fn checkFrontendPatternCoverageContract(request: String) -> Result<String, List<JsonError>> {
          	return checkFrontendPatternCoverageJson(request)
          }

          @jsExport
          pub fn checkFrontendMustUseContract(request: String) -> Result<String, List<JsonError>> {
          	return checkFrontendMustUseJson(request)
          }
          VIRUNE
          git add selfhost/mvp/src/main.virune
          git rm -f .github/workflows/selfhost-pr155-sync-main.yml
          if test -f .github/workflows/selfhost-pr155-validate.yml; then
            git rm -f .github/workflows/selfhost-pr155-validate.yml
          fi
          git commit -m "merge main into selfhost local must-use analysis"
          git push origin HEAD:selfhost/local-must-use-analysis
