name: Selfhost PR147 coverage validation fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/selfhost-pr147-coverage-validation-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfhost/closed-pattern-coverage
      - name: Harden guarded and invalid-space coverage handling
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('selfhost/mvp/src/frontend-pattern-coverage.virune')
          source = source_path.read_text()
          old = '''\t\t} else if !arm.guarded {
\t\t\tif containsString(seen, keyValue) {
\t\t\t\tdiagnostics = List.append(diagnostics, patternError(
\t\t\t\t\t"L3002",
\t\t\t\t\t"Unreachable duplicate pattern " + keyValue,
\t\t\t\t\tarm.span,
\t\t\t\t\tSome("Remove the duplicate arm or add a guard that can distinguish it."),
\t\t\t\t))
\t\t\t\treachable = false
\t\t\t} else {
\t\t\t\tseen = List.append(seen, keyValue)
\t\t\t}
\t\t\tif keyValue == "*" {
\t\t\t\twildcard = true
\t\t\t} else if closedSpace(space.kind) {
\t\t\t\tcoveredCaseId = caseId(space.cases, keyValue)
\t\t\t\tif coveredCaseId < 0 {
\t\t\t\t\tdiagnostics = List.append(diagnostics, patternError(
\t\t\t\t\t\t"L2040",
\t\t\t\t\t\t"Unknown pattern case " + keyValue + " for " + check.target,
\t\t\t\t\t\tarm.span,
\t\t\t\t\t\tSome("Use a constructor or literal that belongs to the target pattern space."),
\t\t\t\t\t))
\t\t\t\t} else if !containsInt(covered, coveredCaseId) {
\t\t\t\t\tcovered = List.append(covered, coveredCaseId)
\t\t\t\t}
\t\t\t}
\t\t}
'''
          new = '''\t\t} else {
\t\t\tlet mut knownCaseId = -1
\t\t\tif keyValue != "*" && closedSpace(space.kind) {
\t\t\t\tknownCaseId = caseId(space.cases, keyValue)
\t\t\t\tif knownCaseId < 0 {
\t\t\t\t\tdiagnostics = List.append(diagnostics, patternError(
\t\t\t\t\t\t"L2040",
\t\t\t\t\t\t"Unknown pattern case " + keyValue + " for " + check.target,
\t\t\t\t\t\tarm.span,
\t\t\t\t\t\tSome("Use a constructor or literal that belongs to the target pattern space."),
\t\t\t\t\t))
\t\t\t\t\treachable = false
\t\t\t\t}
\t\t\t}
\t\t\tif !arm.guarded {
\t\t\t\tif containsString(seen, keyValue) {
\t\t\t\t\tdiagnostics = List.append(diagnostics, patternError(
\t\t\t\t\t\t"L3002",
\t\t\t\t\t\t"Unreachable duplicate pattern " + keyValue,
\t\t\t\t\t\tarm.span,
\t\t\t\t\t\tSome("Remove the duplicate arm or add a guard that can distinguish it."),
\t\t\t\t\t))
\t\t\t\t\treachable = false
\t\t\t\t} else {
\t\t\t\t\tseen = List.append(seen, keyValue)
\t\t\t\t}
\t\t\t\tif keyValue == "*" {
\t\t\t\t\twildcard = true
\t\t\t\t} else if knownCaseId >= 0 {
\t\t\t\t\tcoveredCaseId = knownCaseId
\t\t\t\t\tif !containsInt(covered, coveredCaseId) {
\t\t\t\t\t\tcovered = List.append(covered, coveredCaseId)
\t\t\t\t\t}
\t\t\t\t}
\t\t\t}
\t\t}
'''
          if old not in source:
              raise SystemExit('expected coverage block not found')
          source = source.replace(old, new, 1)
          old_exhaustive = '''\tif wildcard {
\t\texhaustive = true
'''
          new_exhaustive = '''\tif wildcard {
\t\texhaustive = space.kind != "invalid"
'''
          if old_exhaustive not in source:
              raise SystemExit('expected wildcard exhaustiveness block not found')
          source_path.write_text(source.replace(old_exhaustive, new_exhaustive, 1))

          test_path = Path('packages/compiler/test/selfhost-pattern-coverage.test.ts')
          tests = test_path.read_text()
          old_checks = '''\t\t\tchecks: [
\t\t\t\tcheck('MissingType', [wildcard(71)], 70),
\t\t\t\tcheck('StatusTarget', [{ kind: 'constructor', name: null, guarded: false, span: span(73) }], 72),
\t\t\t],
'''
          new_checks = '''\t\t\tchecks: [
\t\t\t\tcheck('MissingType', [wildcard(71)], 70),
\t\t\t\tcheck('StatusTarget', [{ kind: 'constructor', name: null, guarded: false, span: span(73) }], 72),
\t\t\t\tcheck('StatusTarget', [constructor('Missing', 75, true)], 74),
\t\t\t],
'''
          if old_checks not in tests:
              raise SystemExit('expected negative checks block not found')
          tests = tests.replace(old_checks, new_checks, 1)
          old_assertions = '''\t\tassert.equal(result.checks[0]?.targetTypeId, null);
\t\tassert.equal(result.checks[1]?.arms[0]?.reachable, false);
'''
          new_assertions = '''\t\tassert.equal(result.checks[0]?.targetTypeId, null);
\t\tassert.equal(result.checks[0]?.exhaustive, false);
\t\tassert.equal(result.checks[1]?.arms[0]?.reachable, false);
\t\tassert.equal(result.checks[2]?.arms[0]?.reachable, false);
'''
          if old_assertions not in tests:
              raise SystemExit('expected negative assertions block not found')
          test_path.write_text(tests.replace(old_assertions, new_assertions, 1))

          Path('.github/workflows/selfhost-pr147-coverage-validation-fix.yml').unlink()
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/frontend-pattern-coverage.virune packages/compiler/test/selfhost-pattern-coverage.test.ts .github/workflows/selfhost-pr147-coverage-validation-fix.yml
          git commit -m "compiler(selfhost): validate guarded pattern cases"
          git push origin HEAD:selfhost/closed-pattern-coverage
