name: Apply inline View callback fix

on:
  push:
    branches:
      - fix/frontend-inline-zero-arg-callback

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/frontend-inline-zero-arg-callback
      - name: Apply focused checker and regression changes
        shell: python
        run: |
          from pathlib import Path

          checker = Path('packages/compiler/src/checker/checker.ts')
          checker_text = checker.read_text()
          old = "const boundary = this.nativeCallableBoundary(typeId, property.value);"
          new = "const boundary = this.nativeCallableBoundary(typeId, property.value, true);"
          if checker_text.count(old) != 1:
              raise SystemExit(f'expected one checker target, found {checker_text.count(old)}')
          checker.write_text(checker_text.replace(old, new))

          tests = Path('packages/js-interop/test/frontend-view-callable-props.test.ts')
          tests_text = tests.read_text()
          marker = "test('TypeScript JSX whole-usage proof rejects incompatible projected callbacks', async () => {"
          if tests_text.count(marker) != 1:
              raise SystemExit(f'expected one test insertion marker, found {tests_text.count(marker)}')
          regression = r'''test('zero-argument inline View callback props reuse the existing callable shim with captures', async () => {
          	const result = await compile(`component Page() uses JavaScript {
          	let label = "captured"
          	return view {
          		button(onClick: fn() -> Unit {
          			discard label
          			return Unit
          		})
          	}
          }
          `, true);
          	assert.deepEqual(errors(result), []);
          	assert.ok(result.output);
          	assert.match(result.output.code, /<button onClick=\{\$viruneProjectCallable\(/u);
          	assert.ok(result.output.code.includes('label'));
          	assert.equal(result.semantic?.frontendCallableProjections.length, 1);
          	assert.deepEqual(result.semantic?.frontendCallableProjections[0]?.descriptor, {
          		version: 'virune-callable-shim/v1',
          		parameters: [],
          		result: 'Unit',
          		async: false,
          		effects: [],
          		contextMode: 'root-argument',
          	});
          });

          '''
          tests.write_text(tests_text.replace(marker, regression + marker))
      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/compiler/src/checker/checker.ts packages/js-interop/test/frontend-view-callable-props.test.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(frontend): project inline zero-argument callbacks"
          git push origin HEAD:fix/frontend-inline-zero-arg-callback
