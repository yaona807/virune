name: Self-host lambda generated binding repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/selfhost-lambda-ast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-lambda-ast
      - name: Rename strict-mode reserved binding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('selfhost/mvp/src/frontend-lambda-parser.virune')
          text = path.read_text()
          text = text.replace('let arguments = parseTypeList(state, tokens, ">", depth + 1)', 'let genericArguments = parseTypeList(state, tokens, ">", depth + 1)')
          text = text.replace('state = arguments.state', 'state = genericArguments.state')
          text = text.replace('[named.id, arguments.id]', '[named.id, genericArguments.id]')
          path.write_text(text)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/frontend-lambda-parser.virune
          git commit -m "fix(selfhost): avoid generated arguments binding"
          git push origin HEAD:agent/selfhost-lambda-ast
