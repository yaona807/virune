name: Returned native callable branch edit

on:
  push:
    branches:
      - feat/interop-returned-native-callable
    paths:
      - .github/workflows/returned-native-callable-branch-edit.yml

permissions:
  contents: write

jobs:
  edit-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interop-returned-native-callable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply focused one-level callable-result implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          types = 'packages/compiler/src/interop/types.ts'
          replace(types,
          """export interface NativeCallableTypeTemplate {\n\treadonly parameters: readonly (NativeCallablePrimitiveKind | { readonly kind: 'foreign'; readonly type: ForeignTypeRef })[];\n\treadonly result: NativeCallablePrimitiveKind | { readonly kind: 'foreign'; readonly type: ForeignTypeRef } | 'Never';\n\treadonly async: boolean;\n}\n""",
          """export interface NativeCallableTypeTemplate {\n\treadonly parameters: readonly (NativeCallablePrimitiveKind | { readonly kind: 'foreign'; readonly type: ForeignTypeRef })[];\n\treadonly result: NativeCallablePrimitiveKind\n\t\t| { readonly kind: 'foreign'; readonly type: ForeignTypeRef }\n\t\t| {\n\t\t\treadonly kind: 'callable';\n\t\t\treadonly callable: {\n\t\t\t\treadonly parameters: readonly NativeCallablePrimitiveKind[];\n\t\t\t\treadonly result: NativeCallablePrimitiveKind;\n\t\t\t\treadonly async: false;\n\t\t\t};\n\t\t}\n\t\t| 'Never';\n\treadonly async: boolean;\n}\n""")
          replace(types,
          """export type ContextualCallableResult =\n\t| { readonly kind: 'void' }\n\t| { readonly kind: 'value'; readonly value: ContextualCallablePrimitiveKind }\n\t| { readonly kind: 'promise'; readonly value: ContextualCallablePrimitiveKind | 'void' }\n\t| { readonly kind: 'external' }\n\t| { readonly kind: 'deferred' };\n""",
          """export type ContextualCallableResult =\n\t| { readonly kind: 'void' }\n\t| { readonly kind: 'value'; readonly value: ContextualCallablePrimitiveKind }\n\t| { readonly kind: 'promise'; readonly value: ContextualCallablePrimitiveKind | 'void' }\n\t| {\n\t\treadonly kind: 'callable';\n\t\treadonly callable: {\n\t\t\treadonly parameters: readonly ContextualCallablePrimitiveKind[];\n\t\t\treadonly result:\n\t\t\t\t| { readonly kind: 'void' }\n\t\t\t\t| { readonly kind: 'value'; readonly value: ContextualCallablePrimitiveKind };\n\t\t};\n\t}\n\t| { readonly kind: 'external' }\n\t| { readonly kind: 'deferred' };\n""")
          replace(types,
          """interface NativeCallableBoundaryDescriptorV2 {\n\treadonly version: 'virune-callable-shim/v2';\n\treadonly parameters: readonly 'External'[];\n\treadonly result: 'External' | 'Never';\n\treadonly async: boolean;\n\treadonly effects: readonly string[];\n\treadonly contextMode: 'root-argument';\n}\n\nexport type NativeCallableBoundaryDescriptor = NativeCallableBoundaryDescriptorV1 | NativeCallableBoundaryDescriptorV2;\n""",
          """interface NativeCallableBoundaryDescriptorV2 {\n\treadonly version: 'virune-callable-shim/v2';\n\treadonly parameters: readonly 'External'[];\n\treadonly result: 'External' | 'Never';\n\treadonly async: boolean;\n\treadonly effects: readonly string[];\n\treadonly contextMode: 'root-argument';\n}\n\ninterface NativeCallableBoundaryDescriptorV3 {\n\treadonly version: 'virune-callable-shim/v3';\n\treadonly parameters: readonly NativeCallablePrimitiveKind[];\n\treadonly result: NativeCallableBoundaryDescriptorV1;\n\treadonly async: false;\n\treadonly effects: readonly string[];\n\treadonly contextMode: 'root-argument';\n}\n\nexport type NativeCallableBoundaryDescriptor = NativeCallableBoundaryDescriptorV1 | NativeCallableBoundaryDescriptorV2 | NativeCallableBoundaryDescriptorV3;\n""")

          operation = 'packages/compiler/src/interop/operation.ts'
          replace(operation,
          "if (descriptor.version !== 'virune-callable-shim/v1' && descriptor.version !== 'virune-callable-shim/v2') throw new Error('Unknown native callable boundary descriptor version');",
          "if (descriptor.version !== 'virune-callable-shim/v1' && descriptor.version !== 'virune-callable-shim/v2' && descriptor.version !== 'virune-callable-shim/v3') throw new Error('Unknown native callable boundary descriptor version');")
          anchor = """\tif (descriptor.parameters.some(parameter => parameter !== 'External') || (descriptor.result !== 'External' && descriptor.result !== 'Never')) {\n\t\tthrow new Error('Native callable boundary v2 only supports External callbacks');\n\t}\n"""
          insert = """\tif (descriptor.version === 'virune-callable-shim/v3') {\n\t\tif (descriptor.async !== false) throw new Error('Native callable boundary v3 must be synchronous');\n\t\tconst parameters = descriptor.parameters.map(parameter => {\n\t\t\tassertKnown(CALLABLE_PRIMITIVES, parameter, 'native callable primitive');\n\t\t\treturn parameter;\n\t\t});\n\t\tif (descriptor.result.version !== 'virune-callable-shim/v1' || descriptor.result.async !== false) throw new Error('Native callable boundary v3 result must be a synchronous v1 callable');\n\t\tconst result = canonicalCallableDescriptor(descriptor.result);\n\t\tif (result.version !== 'virune-callable-shim/v1' || result.async !== false) throw new Error('Native callable boundary v3 result must canonicalize to a synchronous v1 callable');\n\t\treturn Object.freeze({ version: 'virune-callable-shim/v3', parameters: Object.freeze(parameters), result, async: false, effects: Object.freeze(canonicalEffects), contextMode: 'root-argument' });\n\t}\n""" + anchor
          replace(operation, anchor, insert)

          checker = 'packages/compiler/src/checker/checker.ts'
          replace(checker,
          "private nativeCallableBoundary(typeId: TypeId, expression: A.Expression, allowInlineZeroArgument = false): Extract<NativeCallableBoundaryDescriptor, { readonly version: 'virune-callable-shim/v1' }> | undefined {",
          "private nativeCallableBoundary(typeId: TypeId, expression: A.Expression, allowInlineZeroArgument = false): Exclude<NativeCallableBoundaryDescriptor, { readonly version: 'virune-callable-shim/v2' }> | undefined {")
          old_tail = """\t\tconst result = this.nativeCallablePrimitive(type.result);\n\t\tif (result === undefined) return undefined;\n\t\treturn Object.freeze({\n\t\t\tversion: 'virune-callable-shim/v1',\n\t\t\tparameters: Object.freeze(parameters),\n\t\t\tresult,\n\t\t\tasync: type.async,\n\t\t\teffects: Object.freeze([...new Set(type.effects)].sort(compareText)),\n\t\t\tcontextMode: 'root-argument',\n\t\t});\n"""
          new_tail = """\t\tconst result = this.nativeCallablePrimitive(type.result);\n\t\tconst effects = Object.freeze([...new Set(type.effects)].sort(compareText));\n\t\tif (result !== undefined) {\n\t\t\treturn Object.freeze({\n\t\t\t\tversion: 'virune-callable-shim/v1',\n\t\t\t\tparameters: Object.freeze(parameters),\n\t\t\t\tresult,\n\t\t\t\tasync: type.async,\n\t\t\t\teffects,\n\t\t\t\tcontextMode: 'root-argument',\n\t\t\t});\n\t\t}\n\t\tif (type.async) return undefined;\n\t\tconst nested = this.arena.get(type.result);\n\t\tif (nested.kind !== 'function' || nested.async || nested.typeParameters.length !== 0 || nested.effects.some(effect => effect === '*' || !this.#effects.has(effect))) return undefined;\n\t\tconst nestedParameters: NativeCallablePrimitiveKind[] = [];\n\t\tfor (const parameter of nested.parameters) {\n\t\t\tconst primitive = this.nativeCallablePrimitive(parameter);\n\t\t\tif (primitive === undefined) return undefined;\n\t\t\tnestedParameters.push(primitive);\n\t\t}\n\t\tconst nestedResult = this.nativeCallablePrimitive(nested.result);\n\t\tif (nestedResult === undefined) return undefined;\n\t\tconst nestedBoundary = Object.freeze({\n\t\t\tversion: 'virune-callable-shim/v1' as const,\n\t\t\tparameters: Object.freeze(nestedParameters),\n\t\t\tresult: nestedResult,\n\t\t\tasync: false,\n\t\t\teffects: Object.freeze([...new Set(nested.effects)].sort(compareText)),\n\t\t\tcontextMode: 'root-argument' as const,\n\t\t});\n\t\treturn Object.freeze({\n\t\t\tversion: 'virune-callable-shim/v3',\n\t\t\tparameters: Object.freeze(parameters),\n\t\t\tresult: nestedBoundary,\n\t\t\tasync: false,\n\t\t\teffects,\n\t\t\tcontextMode: 'root-argument',\n\t\t});\n"""
          replace(checker, old_tail, new_tail)
          replace(checker,
          """\t\tconst boundary = this.nativeCallableBoundary(typeId, expression, allowInlineZeroArgument);\n\t\tconst argument: InteropArgumentType = boundary === undefined\n\t\t\t? this.interopArgumentType(typeId, expression, expression.span)\n\t\t\t: { kind: 'native-callable', callable: { parameters: boundary.parameters, result: boundary.result, async: boundary.async } };\n\t\treturn { expression, argument, ...(boundary === undefined ? {} : { boundary }), point: this.semanticPoint() };\n""",
          """\t\tconst boundary = this.nativeCallableBoundary(typeId, expression, allowInlineZeroArgument);\n\t\tconst callable: import('../interop/types.js').NativeCallableTypeTemplate | undefined = boundary === undefined\n\t\t\t? undefined\n\t\t\t: boundary.version === 'virune-callable-shim/v3'\n\t\t\t\t? { parameters: boundary.parameters, result: { kind: 'callable', callable: { parameters: boundary.result.parameters, result: boundary.result.result, async: false } }, async: false }\n\t\t\t\t: { parameters: boundary.parameters, result: boundary.result, async: boundary.async };\n\t\tconst argument: InteropArgumentType = callable === undefined\n\t\t\t? this.interopArgumentType(typeId, expression, expression.span)\n\t\t\t: { kind: 'native-callable', callable };\n\t\treturn { expression, argument, ...(boundary === undefined ? {} : { boundary }), point: this.semanticPoint() };\n""")
          replace(checker,
          "if (preparedEntry.boundary.version === 'virune-callable-shim/v1') {",
          "if (preparedEntry.boundary.version === 'virune-callable-shim/v1' || preparedEntry.boundary.version === 'virune-callable-shim/v3') {")
          replace(checker,
          "if (boundary.version === 'virune-callable-shim/v1') {",
          "if (boundary.version === 'virune-callable-shim/v1' || boundary.version === 'virune-callable-shim/v3') {",
          expected=1)
          replace(checker,
          """\t\tif (boundary.parameters.length !== parameters.length || result.kind === 'deferred') return false;\n\t\tif (boundary.version === 'virune-callable-shim/v2') {\n""",
          """\t\tif (boundary.parameters.length !== parameters.length || result.kind === 'deferred') return false;\n\t\tif (boundary.version === 'virune-callable-shim/v3') {\n\t\t\tif (boundary.async || result.kind !== 'callable' || parameters.some(parameter => typeof parameter !== 'string')) return false;\n\t\t\tif (boundary.parameters.some((parameter, index) => !callableParameterMatchesContext(parameter, parameters[index] as ContextualCallablePrimitiveKind))) return false;\n\t\t\treturn this.callableBoundaryMatchesContext(boundary.result, result.callable.parameters, result.callable.result);\n\t\t}\n\t\tif (boundary.version === 'virune-callable-shim/v2') {\n""")
          replace(checker,
          """\tif (value.kind !== 'value' && value.kind !== 'promise') return undefined;\n""",
          """\tif (value.kind === 'callable') {\n\t\tif (!hasExactEnumerableKeys(value, ['callable', 'kind']) || !isRecord(value.callable) || !hasExactEnumerableKeys(value.callable, ['parameters', 'result']) || !Array.isArray(value.callable.parameters)) return undefined;\n\t\tconst parameters: ContextualCallablePrimitiveKind[] = [];\n\t\tfor (const parameter of value.callable.parameters) {\n\t\t\tif (!isContextualCallablePrimitive(parameter)) return undefined;\n\t\t\tparameters.push(parameter);\n\t\t}\n\t\tconst result = canonicalContextualCallableResult(value.callable.result);\n\t\tif (result === undefined || (result.kind !== 'void' && result.kind !== 'value')) return undefined;\n\t\treturn Object.freeze({ kind: 'callable', callable: Object.freeze({ parameters: Object.freeze(parameters), result }) });\n\t}\n\tif (value.kind !== 'value' && value.kind !== 'promise') return undefined;\n""")
          replace(checker,
          "if (boundary === undefined || boundary.parameters.includes('Int')) continue;",
          "if (boundary === undefined || boundary.version !== 'virune-callable-shim/v1' || boundary.parameters.includes('Int')) continue;")
          replace(checker,
          "\t\t\tthis.requireEffects(boundary.effects, argument.span);\n\t\t\tthis.#callableProjections.push({",
          "\t\t\tthis.requireEffects(boundary.effects, argument.span);\n\t\t\tif (boundary.version === 'virune-callable-shim/v3') this.requireEffects(boundary.result.effects, argument.span);\n\t\t\tthis.#callableProjections.push({")

          provider = 'packages/js-interop/src/index.ts'
          replace(provider,
          """\t\tif (value === 'Never') return allowNever ? 'never' : undefined;\n\t\tif (typeof value === 'string') return allowNever ? typescriptCallableResultName(value) : typescriptCallbackParameterName(value);\n\t\tconst source = this.lookupType(value.type);\n""",
          """\t\tif (value === 'Never') return allowNever ? 'never' : undefined;\n\t\tif (typeof value === 'string') return allowNever ? typescriptCallableResultName(value) : typescriptCallbackParameterName(value);\n\t\tif (value.kind === 'callable') return allowNever ? this.renderNativeCallableType(value.callable, context) : undefined;\n\t\tconst source = this.lookupType(value.type);\n""")
          replace(provider,
          """\t\tlet result: ContextualCallableResult;\n\t\tif (callable === undefined) result = Object.freeze({ kind: 'deferred' });\n\t\telse if (callable.result === 'Never' || typeof callable.result !== 'string') result = Object.freeze({ kind: 'external' });\n\t\telse {\n\t\t\tconst resultType = checker.getReturnTypeOfSignature(signature);\n\t\t\tconst contextual = contextualCallbackResultForNativeCallable(resultType, checker, callable);\n\t\t\tif (contextual === undefined) return undefined;\n\t\t\tresult = contextual;\n\t\t}\n""",
          """\t\tlet result: ContextualCallableResult;\n\t\tif (callable === undefined) result = Object.freeze({ kind: 'deferred' });\n\t\telse if (callable.result === 'Never') result = Object.freeze({ kind: 'external' });\n\t\telse if (typeof callable.result !== 'string') {\n\t\t\tif (callable.result.kind !== 'callable') result = Object.freeze({ kind: 'external' });\n\t\t\telse {\n\t\t\t\tconst nested = contextualNestedPrimitiveCallable(checker.getReturnTypeOfSignature(signature), checker, location, callable.result.callable);\n\t\t\t\tif (nested === undefined) return undefined;\n\t\t\t\tresult = Object.freeze({ kind: 'callable', callable: nested });\n\t\t\t}\n\t\t} else {\n\t\t\tconst resultType = checker.getReturnTypeOfSignature(signature);\n\t\t\tconst contextual = contextualCallbackResultForNativeCallable(resultType, checker, callable);\n\t\t\tif (contextual === undefined) return undefined;\n\t\t\tresult = contextual;\n\t\t}\n""")
          helper_anchor = "function contextualCallbackResultForNativeCallable(type: ts.Type, checker: ts.TypeChecker, callable: NativeCallableTypeTemplate): ContextualCallableResult | undefined {"
          helper = """function contextualNestedPrimitiveCallable(\n\ttype: ts.Type,\n\tchecker: ts.TypeChecker,\n\tlocation: ts.Node,\n\tcallable: Extract<NativeCallableTypeTemplate['result'], { readonly kind: 'callable' }>['callable'],\n): Extract<ContextualCallableResult, { readonly kind: 'callable' }>['callable'] | undefined {\n\tconst signatures = type.getCallSignatures();\n\tif (signatures.length !== 1 || type.getConstructSignatures().length !== 0) return undefined;\n\tconst signature = signatures[0]!;\n\tif ((signature.typeParameters?.length ?? 0) !== 0 || signature.parameters.length !== callable.parameters.length || callable.async !== false) return undefined;\n\tconst parameters: ContextualCallablePrimitiveKind[] = [];\n\tfor (const parameter of signature.parameters) {\n\t\tconst declaration = parameter.valueDeclaration ?? parameter.declarations?.[0] ?? location;\n\t\tconst primitive = contextualPrimitiveKind(checker.getTypeOfSymbolAtLocation(parameter, declaration));\n\t\tif (primitive === undefined) return undefined;\n\t\tparameters.push(primitive);\n\t}\n\tconst result = contextualCallbackResultForNativeCallable(checker.getReturnTypeOfSignature(signature), checker, callable);\n\tif (result === undefined || (result.kind !== 'void' && result.kind !== 'value')) return undefined;\n\treturn Object.freeze({ parameters: Object.freeze(parameters), result });\n}\n\n""" + helper_anchor
          replace(provider, helper_anchor, helper)

          emitter = 'packages/compiler/src/codegen/emitter.ts'
          replace(emitter,
          """\t\t\tbody = `return encodeFfiValue(${result}, ${this.callableFfiDescriptor(descriptor.result)});`;\n\t\t} else {\n""",
          """\t\t\tbody = `return encodeFfiValue(${result}, ${this.callableFfiDescriptor(descriptor.result)});`;\n\t\t} else if (descriptor.version === 'virune-callable-shim/v3') {\n\t\t\tconst validated = descriptor.parameters.map((parameter, index) => `validateFfiValue(${rawParameters[index]}, ${this.callableFfiDescriptor(parameter)}, ${javascriptStringLiteral(`$[${index}]`)})`);\n\t\t\tconst invocation = `$fn(${[...validated, 'rootTaskContext()'].join(', ')})`;\n\t\t\tbody = `const $result = ${invocation}; return ${this.callableProjection('$result', descriptor.result)};`;\n\t\t} else {\n""")

          test_path = 'packages/js-interop/test/callable-boundary-regressions.test.ts'
          old_test = """test('nested cleanup callable result remains fail closed until nested callable descriptors are supported', async () => {\n\tconst result = await compileFixture(\n\t\t'library',\n\t\t'export declare function register(callback: (value: string) => () => void): void;\\n',\n\t\t`import js { register } from \"./library.js\"\\n\\nfn cleanup() -> Unit {\\n\\treturn Unit\\n}\\n\\nfn factory(value: String) -> fn() -> Unit {\\n\\treturn cleanup\\n}\\n\\nfn main() -> Unit uses JavaScript {\\n\\tdiscard register(factory)\\n\\treturn Unit\\n}\\n`,\n\t);\n\tassert.ok(result.diagnostics.some(item => item.code === 'L4204' || item.code === 'L4206'));\n\tassert.equal(result.semantic?.interop.callableProjections?.length ?? 0, 0);\n});\n"""
          new_test = """test('projects one-level native cleanup callable results through the existing shim', async () => {\n\tconst result = await compileFixture(\n\t\t'library',\n\t\t'export declare function register(callback: (value: string) => () => void): void;\\n',\n\t\t`import js { register } from \"./library.js\"\\n\\nfn cleanup() -> Unit {\\n\\treturn Unit\\n}\\n\\nfn factory(value: String) -> fn() -> Unit {\\n\\treturn cleanup\\n}\\n\\nfn main() -> Unit uses JavaScript {\\n\\tdiscard register(factory)\\n\\treturn Unit\\n}\\n`,\n\t);\n\tassert.deepEqual(result.diagnostics.filter(item => item.severity === 'error'), []);\n\tconst projection = result.semantic?.interop.callableProjections?.[0];\n\tassert.ok(projection);\n\tassert.deepEqual(projection.descriptor, {\n\t\tversion: 'virune-callable-shim/v3',\n\t\tparameters: ['String'],\n\t\tresult: {\n\t\t\tversion: 'virune-callable-shim/v1',\n\t\t\tparameters: [],\n\t\t\tresult: 'Unit',\n\t\t\tasync: false,\n\t\t\teffects: [],\n\t\t\tcontextMode: 'root-argument',\n\t\t},\n\t\tasync: false,\n\t\teffects: [],\n\t\tcontextMode: 'root-argument',\n\t});\n\tassert.match(result.output?.code ?? '', /const \\$result = \\$fn\\(validateFfiValue\\(\\$raw0,/u);\n\tassert.match(result.output?.code ?? '', /\\$viruneProjectCallable\\(\\$result,/u);\n});\n\n test('deeper nested native callable results remain fail closed', async () => {\n\tconst result = await compileFixture(\n\t\t'library',\n\t\t'export declare function register(callback: () => () => () => void): void;\\n',\n\t\t`import js { register } from \"./library.js\"\\n\\nfn leaf() -> Unit {\\n\\treturn Unit\\n}\\n\\nfn middle() -> fn() -> Unit {\\n\\treturn leaf\\n}\\n\\nfn factory() -> fn() -> fn() -> Unit {\\n\\treturn middle\\n}\\n\\nfn main() -> Unit uses JavaScript {\\n\\tdiscard register(factory)\\n\\treturn Unit\\n}\\n`,\n\t);\n\tassert.ok(result.diagnostics.some(item => item.code === 'L4204' || item.code === 'L4206'));\n\tassert.equal(result.semantic?.interop.callableProjections?.length ?? 0, 0);\n});\n"""
          replace(test_path, old_test, new_test)
          PY
      - name: Build
        run: npm run build
      - name: Focused callable regressions
        run: node --test packages/js-interop/dist/test/callable-boundary-regressions.test.js
      - name: API check
        run: npm run api:check
      - name: ABI check
        run: npm run abi:check
      - name: Diff check
        run: git diff --check
      - name: Commit validated implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/compiler/src/interop/types.ts packages/compiler/src/interop/operation.ts packages/compiler/src/checker/checker.ts packages/compiler/src/codegen/emitter.ts packages/js-interop/src/index.ts packages/js-interop/test/callable-boundary-regressions.test.ts
          git rm .github/workflows/returned-native-callable-branch-edit.yml
          git commit -m 'feat(interop): project one-level returned native callables'
          git push origin HEAD:feat/interop-returned-native-callable
