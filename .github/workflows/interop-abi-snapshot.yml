name: Interop ABI snapshot probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate and verify public ABI snapshot
        run: |
          npm run abi:update
          npm run abi:check
      - name: Commit snapshot and retire probe
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/interop-abi-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/public-abi.snapshot.json .github/workflows/interop-abi-snapshot.yml
          git diff --cached --quiet && { echo "Expected ABI snapshot change" >&2; exit 1; }
          git commit -m "chore(abi): record classifier export"
          git push origin HEAD:"${HEAD_BRANCH}"
