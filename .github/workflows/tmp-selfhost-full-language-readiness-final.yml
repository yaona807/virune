name: Temporary publish dedicated self-host inventory CI branch

on:
  push:
    branches:
      - probe/selfhost-full-language-readiness-main
    paths:
      - '.github/workflows/tmp-selfhost-full-language-readiness-final.yml'

permissions:
  contents: write

concurrency:
  group: tmp-selfhost-inventory-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-phase2:
    name: Publish dedicated self-host inventory CI branch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_BASE_SHA: 7f414b6195cd6356482c3f0b42293318bb7b7caa
      TARGET_BRANCH: feat/ci-selfhost-inventory-job
      VIRUNE_CI_JOB: selfhost-inventory-phase2-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Materialize the four-file Phase 2 change
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi
          git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          git reset --hard "$EXPECTED_BASE_SHA"
          python - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          files = {
              "scripts/run-tests.mjs": "   const child = spawn(process.execPath, ['--test', '--test-timeout=120000', ...files], {
			cwd: process.cwd(),
			env,
			stdio: 'inherit',
		});
		child.once('error', reject);
		child.once('exit', code => resolve(code ?? 1));
	});
}

function runCommand(argumentsList, failureOutput) {
	const { NODE_TEST_CONTEXT: _ignored, ...env } = process.env;
	return new Promise((resolve, reject) => {
		const capture = typeof failureOutput === 'string';
		const child = spawn(process.execPath, argumentsList, {
			cwd: process.cwd(),
			env,
			stdio: capture ? ['ignore', 'pipe', 'pipe'] : 'inherit',
		});
		let output = '';
		if (capture) {
			child.stdout.setEncoding('utf8');
			child.stderr.setEncoding('utf8');
			child.stdout.on('data', chunk => { output += chunk; process.stdout.write(chunk); });
			child.stderr.on('data', chunk => { output += chunk; process.stderr.write(chunk); });
		}
		child.once('error', reject);
		child.once('exit', async code => {
			const exitCode = code ?? 1;
			if (capture && exitCode !== 0) {
				await mkdir(dirname(failureOutput), { recursive: true });
				await writeFile(failureOutput, output);
			}
			resolve(exitCode);
		});
	});
}
",
              "scripts/run-unit-tests.mjs": " ",
              "scripts/run-unit-tests.test.mjs": "",
              "scripts/run-unit-tests.mjs": " ",
              "scripts/run-unit-tests.test.mjs": ""
          }
          for path_text, encoded in files.items():
              path = Path(path_text)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(b64decode(encoded))

          ci_path = Path('.github/workflows/ci.yml')
          text = ci_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once("      - name: Verify metadata, policy and specifications\n        run: node scripts/run-ci-command.mjs --id metadata -- npm run verify:metadata\n", "      - name: Verify metadata, policy and specifications\n        run: node scripts/run-ci-command.mjs --id metadata -- npm run verify:metadata\n      - name: Verify unit-test lane selection\n        run: node --test scripts/run-unit-tests.test.mjs\n", 'metadata selection test')
          replace_once("  verify:\n    name: Core tests (Ubuntu 24.04 / Node.js 24)\n    needs: [classify, build]\n    if: needs.classify.outputs.docs_only != 'true'\n    runs-on: ubuntu-24.04\n    timeout-minutes: 150\n", "  verify:\n    name: Core tests (Ubuntu 24.04 / Node.js 24)\n    needs: [classify, build]\n    if: needs.classify.outputs.docs_only != 'true'\n    runs-on: ubuntu-24.04\n    timeout-minutes: 35\n", 'core timeout restoration')
          replace_once("run: node scripts/run-ci-command.mjs --id core-tests -- npm run test:core:built -- --failure-output-only", "run: node scripts/run-ci-command.mjs --id core-tests -- npm run test:core:built -- --failure-output-only --exclude-selfhost-inventory", 'core lane inventory exclusion')
          replace_once('\n  quality:\n', "\n  selfhost-inventory:\n    name: Self-host full-language inventory (Ubuntu 24.04 / Node.js 24)\n    needs: [classify, build]\n    if: needs.classify.outputs.docs_only != 'true'\n    runs-on: ubuntu-24.04\n    timeout-minutes: 150\n    env:\n      VIRUNE_CI_JOB: selfhost-inventory-ubuntu-node24\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7\n        with:\n          node-version: 24\n          cache: npm\n      - name: Install dependencies\n        run: node scripts/run-ci-command.mjs --id install -- npm ci\n      - name: Download compiled output\n        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8\n        with:\n          name: compiled-node-24-${{ github.sha }}\n          path: .cache\n      - name: Restore compiled output\n        run: node scripts/run-ci-command.mjs --id restore-compiled-output -- tar -xzf .cache/compiled-output.tgz -C .\n      - name: Run deterministic full-language inventory\n        run: >-\n          node scripts/run-ci-command.mjs --id selfhost-full-language-inventory --\n          node scripts/run-unit-tests.mjs\n          --file=packages/compiler/dist/test/selfhost-full-language-inventory.test.js\n          --failure-output-only\n      - name: Write timing summary\n        if: always()\n        run: node scripts/write-ci-summary.mjs\n      - name: Upload self-host inventory evidence\n        if: always()\n        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7\n        with:\n          name: ci-evidence-selfhost-inventory-ubuntu-node24-${{ github.sha }}\n          path: |\n            .cache/unit-test-failure.log\n            .cache/ci-timings/selfhost-full-language-inventory.json\n            .cache/ci-timings/\n            .cache/ci-failures/\n          if-no-files-found: warn\n          retention-days: 14\n\n  quality:\n", 'dedicated inventory job')
          replace_once("needs: [classify, metadata, build, verify, quality, semantic-fuzz, compatibility, browser]", "needs: [classify, metadata, build, verify, selfhost-inventory, quality, semantic-fuzz, compatibility, browser]", 'release job dependencies')
          replace_once("      needs.verify.result == 'success' &&\n      needs.quality.result == 'success' &&\n", "      needs.verify.result == 'success' &&\n      needs.selfhost-inventory.result == 'success' &&\n      needs.quality.result == 'success' &&\n", 'release inventory gate')
          ci_path.write_text(text)
          PY
          cat > "$RUNNER_TEMP/expected-phase2-files.txt" <<'EOF'
          .github/workflows/ci.yml
          scripts/run-tests.mjs
          scripts/run-unit-tests.mjs
          scripts/run-unit-tests.test.mjs
          EOF
          sort "$RUNNER_TEMP/expected-phase2-files.txt" -o "$RUNNER_TEMP/expected-phase2-files.txt"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-phase2-files.txt"
          diff -u "$RUNNER_TEMP/expected-phase2-files.txt" "$RUNNER_TEMP/actual-phase2-files.txt"
          git diff --check
      - name: Install dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Build and type-check project references
        run: node scripts/run-ci-command.mjs --id build -- npm run check
      - name: Verify the unit-test selector
        run: node --test scripts/run-unit-tests.test.mjs
      - name: Verify workflow and CI policies
        run: |
          npm run workflow:check
          npm run test:workflow-policy
          npm run test:ci-policy
      - name: Run the generic Core lane without the canonical inventory
        run: >-
          node scripts/run-ci-command.mjs --id core-tests-without-selfhost-inventory --
          npm run test:core:built -- --failure-output-only --exclude-selfhost-inventory
      - name: Commit and push the Phase 2 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$TARGET_BRANCH"
          git add --pathspec-from-file="$RUNNER_TEMP/expected-phase2-files.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged-phase2-files.txt"
          diff -u "$RUNNER_TEMP/expected-phase2-files.txt" "$RUNNER_TEMP/staged-phase2-files.txt"
          git diff --cached --check
          git commit \
            -m 'ci(selfhost): isolate full-language inventory' \
            -m 'Keep the canonical two-compile inventory as a dedicated release gate while removing it from the generic Core lane.' \
            -m 'Refs #283' \
            -m 'Refs #269' \
            -m 'Refs #88'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "SELFHOST_INVENTORY_PHASE2_COMMIT=$(git rev-parse HEAD)"
