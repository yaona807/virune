name: Temporary publish full-language readiness source branch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-selfhost-full-language-readiness-final.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: tmp-selfhost-full-language-readiness-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-permanent-branch:
    name: Publish exact permanent readiness branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BASE_SHA: 34a175dc1845eba083fece2694f6a47f65d1fcf5
      PROMOTION_RUN_ID: '31094316677'
      PROMOTION_ARTIFACT_NAME: selfhost-full-language-readiness-permanent-adae68cdac0f09e07796ad074b7f4e5548c77e9f
      PROMOTION_ARTIFACT_ID: '8964798498'
      PROMOTION_ARTIFACT_DIGEST: sha256:02d6e7dcfc6cf5a990a5b6ba020f81d16a5c2d2e7bd093aede127a7f20cdd9a1
      TARGET_BRANCH: feat/selfhost-full-language-readiness-main
      GH_TOKEN: ${{ github.token }}
      VIRUNE_CI_JOB: selfhost-full-language-readiness-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Restore and verify the permanent source artifact
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          test "$base_sha" = "$EXPECTED_BASE_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi
          artifact_root="$RUNNER_TEMP/readiness-promotion"
          mkdir -p "$artifact_root"
          gh run download "$PROMOTION_RUN_ID" \
            --repo yaona807/virune \
            --name "$PROMOTION_ARTIFACT_NAME" \
            --dir "$artifact_root"
          test -f "$artifact_root/manifest.json"
          test -f "$artifact_root/files.txt"
          test -f "$artifact_root/permanent-readiness-files.tar.gz"
          git reset --hard "$base_sha"
          python - <<'PY'
          from hashlib import sha256
          from json import loads
          from os import environ
          from pathlib import Path, PurePosixPath
          import tarfile

          artifact_root = Path(environ['RUNNER_TEMP']) / 'readiness-promotion'
          manifest = loads((artifact_root / 'manifest.json').read_text())
          files = (artifact_root / 'files.txt').read_text().splitlines()
          expected = [
              'docs/self-hosting-project-compiler-integration.md',
              'docs/self-hosting-project-compiler-integration_ja.md',
              'docs/self-hosting-stage1-stage2-bootstrap.md',
              'docs/self-hosting-stage1-stage2-bootstrap_ja.md',
              'packages/compiler/test/selfhost-bootstrap-stage-runner.test.ts',
              'packages/compiler/test/selfhost-full-language-inventory.test.ts',
              'packages/compiler/test/selfhost-project-compiler-contract.test.ts',
              'packages/compiler/test/selfhost-qualified-builtins-variants.test.ts',
              'selfhost/mvp/src/checker.virune',
              'selfhost/mvp/src/frontend-parser-core.virune',
              'selfhost/mvp/src/project-compiler-contract.virune',
          ]
          if manifest.get('claim') != 'selfhost-full-language-readiness-permanent-source-set':
              raise SystemExit('unexpected promotion artifact claim')
          if manifest.get('baseSha') != environ['EXPECTED_BASE_SHA']:
              raise SystemExit('promotion artifact base SHA mismatch')
          if manifest.get('fileCount') != 11 or files != expected:
              raise SystemExit('promotion artifact file list mismatch')
          evidence = manifest.get('sourceEvidence', {})
          expected_evidence = {
              'runId': 31090903027,
              'artifactId': 8964401598,
              'artifactDigest': 'sha256:b7f13c0589ae6a995b3e918c954d75f4bacf6ee64b08278ccd7040e2afba6a51',
              'sourceCount': 31,
              'parsedModules': 31,
              'checkedModules': 31,
              'emittedModules': 31,
              'diagnosticCount': 0,
          }
          if evidence != expected_evidence:
              raise SystemExit('promotion artifact readiness evidence mismatch')
          hashes = {entry['path']: entry['sha256'] for entry in manifest['files']}
          if list(hashes) != expected:
              raise SystemExit('promotion artifact manifest order mismatch')
          archive = artifact_root / 'permanent-readiness-files.tar.gz'
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              member_paths = [member.name for member in members if member.isfile()]
              if member_paths != expected:
                  raise SystemExit('promotion archive member list mismatch')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe promotion archive member: {member.name}')
              bundle.extractall('.', members=members)
          for path in expected:
              actual = sha256(Path(path).read_bytes()).hexdigest()
              if actual != hashes[path]:
                  raise SystemExit(f'promotion file digest mismatch: {path}')
          (Path(environ['RUNNER_TEMP']) / 'expected-readiness-files.txt').write_text(
              '\n'.join(sorted(expected)) + '\n'
          )
          PY
          git diff --name-only | sort > "$RUNNER_TEMP/actual-readiness-files.txt"
          diff -u "$RUNNER_TEMP/expected-readiness-files.txt" "$RUNNER_TEMP/actual-readiness-files.txt"
          git diff --check
      - name: Install dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Build and type-check project references
        run: node scripts/run-ci-command.mjs --id build -- npm run check
      - name: Run focused permanent readiness regressions
        run: >-
          node scripts/run-ci-command.mjs --id selfhost-readiness-focused --
          node --test --test-isolation=none
          packages/compiler/dist/test/selfhost-bootstrap-stage-runner.test.js
          packages/compiler/dist/test/selfhost-project-compiler-contract.test.js
          packages/compiler/dist/test/selfhost-qualified-builtins-variants.test.js
      - name: Commit and push exactly eleven permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$TARGET_BRANCH"
          git add --pathspec-from-file="$RUNNER_TEMP/expected-readiness-files.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged-readiness-files.txt"
          diff -u "$RUNNER_TEMP/expected-readiness-files.txt" "$RUNNER_TEMP/staged-readiness-files.txt"
          git diff --cached --check
          git commit \
            -m 'feat(selfhost): reach full-language readiness' \
            -m 'Promote the exact 31/31/31/31 zero-diagnostic source set, enable the project compiler capability, and synchronize readiness tests and documentation.' \
            -m 'Refs #283' \
            -m 'Refs #99' \
            -m 'Refs #88'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PERMANENT_READINESS_COMMIT=$(git rev-parse HEAD)"
