name: Temporary publish dedicated self-host inventory CI branch

on:
  push:
    branches:
      - probe/selfhost-full-language-readiness-main
    paths:
      - '.github/scripts/tmp-fix-full-language-readiness.py'
      - '.github/workflows/tmp-selfhost-full-language-readiness-final.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/tmp-fix-full-language-readiness.py'
      - '.github/workflows/tmp-selfhost-full-language-readiness-final.yml'

permissions:
  contents: write

concurrency:
  group: tmp-selfhost-inventory-phase2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-phase2:
    name: Publish dedicated self-host inventory CI branch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_BASE_SHA: 7f414b6195cd6356482c3f0b42293318bb7b7caa
      TARGET_BRANCH: feat/ci-selfhost-inventory-job
      PAYLOAD_SHA256: 8b493381c885b8da6cfa81d600e67760359552b48247ddc256564efb86a0849b
      VIRUNE_CI_JOB: selfhost-inventory-phase2-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Materialize the four-file Phase 2 change
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi
          test "$(sha256sum .github/scripts/tmp-fix-full-language-readiness.py | cut -d' ' -f1)" = "$PAYLOAD_SHA256"
          cp .github/scripts/tmp-fix-full-language-readiness.py "$RUNNER_TEMP/phase2-payload.tar.gz"
          git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          git reset --hard "$EXPECTED_BASE_SHA"
          python - <<'PY'
          from os import environ
          from pathlib import Path, PurePosixPath
          import shutil
          import subprocess
          import tarfile

          root = Path(environ['RUNNER_TEMP']) / 'phase2-payload'
          root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(Path(environ['RUNNER_TEMP']) / 'phase2-payload.tar.gz', 'r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe payload member: {member.name}')
              bundle.extractall(root, members=members)
          for relative in [
              'scripts/run-tests.mjs',
              'scripts/run-unit-tests.mjs',
              'scripts/run-unit-tests.test.mjs',
          ]:
              source = root / relative
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
          subprocess.run(['python', str(root / 'patch-ci.py')], check=True)
          PY
          cat > "$RUNNER_TEMP/expected-phase2-files.txt" <<'EOF'
          .github/workflows/ci.yml
          scripts/run-tests.mjs
          scripts/run-unit-tests.mjs
          scripts/run-unit-tests.test.mjs
          EOF
          sort "$RUNNER_TEMP/expected-phase2-files.txt" -o "$RUNNER_TEMP/expected-phase2-files.txt"
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort > "$RUNNER_TEMP/actual-phase2-files.txt"
          diff -u "$RUNNER_TEMP/expected-phase2-files.txt" "$RUNNER_TEMP/actual-phase2-files.txt"
          git diff --check
      - name: Install dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Build and type-check project references
        run: node scripts/run-ci-command.mjs --id build -- npm run check
      - name: Verify the unit-test selector
        run: node --test scripts/run-unit-tests.test.mjs
      - name: Verify workflow and CI policies
        run: |
          npm run workflow:check
          npm run test:workflow-policy
          npm run test:ci-policy
      - name: Run the generic Core lane without the canonical inventory
        run: >-
          node scripts/run-ci-command.mjs --id core-tests-without-selfhost-inventory --
          npm run test:core:built -- --failure-output-only --exclude-selfhost-inventory
      - name: Commit and push the Phase 2 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$TARGET_BRANCH"
          git add --pathspec-from-file="$RUNNER_TEMP/expected-phase2-files.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged-phase2-files.txt"
          diff -u "$RUNNER_TEMP/expected-phase2-files.txt" "$RUNNER_TEMP/staged-phase2-files.txt"
          git diff --cached --check
          git commit \
            -m 'ci(selfhost): isolate full-language inventory' \
            -m 'Keep the canonical two-compile inventory as a dedicated release gate while removing it from the generic Core lane.' \
            -m 'Refs #283' \
            -m 'Refs #269' \
            -m 'Refs #88'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "SELFHOST_INVENTORY_PHASE2_COMMIT=$(git rev-parse HEAD)"
