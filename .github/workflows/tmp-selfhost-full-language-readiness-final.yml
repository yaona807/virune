name: Temporary publish qualified variant emission branch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-selfhost-full-language-readiness-final.yml'

permissions:
  contents: write

concurrency:
  group: tmp-selfhost-qualified-variant-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-qualified-variant-fix:
    name: Publish qualified variant emission fix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_BASE_SHA: 9aa7a3a0930cb1889f41b52a378b4bda52e84f55
      TARGET_BRANCH: fix/selfhost-qualified-variant-emission
      VIRUNE_CI_JOB: selfhost-qualified-variant-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Materialize the exact emitter fix
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi
          git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          git reset --hard "$EXPECTED_BASE_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('selfhost/mvp/src/emitter.virune')
          text = path.read_text()
          old = (
              'fn emitVariant(expression: MvpHirExpression, expressions: List<MvpHirExpression>) -> String {\n'
              '\tif expression.text == "None" {\n'
              '\t\treturn "None"\n'
              '\t}\n'
              '\treturn expression.text + "(" + String.join(emitArguments(expression.children, expressions), ", ") + ")"\n'
              '}\n'
          )
          new = (
              'fn emitVariant(expression: MvpHirExpression, expressions: List<MvpHirExpression>) -> String {\n'
              '\tif expression.text == "None" {\n'
              '\t\treturn "None"\n'
              '\t}\n'
              '\tlet values = emitArguments(expression.children, expressions)\n'
              '\tif expression.text == "Some" || expression.text == "Ok" || expression.text == "Err" {\n'
              '\t\treturn expression.text + "(" + String.join(values, ", ") + ")"\n'
              '\t}\n'
              '\tlet typeId = match expression.valueType {\n'
              '\t\tNamedType(name) => ", " + Debug.format(name)\n'
              '\t\t_ => ""\n'
              '\t}\n'
              '\treturn "makeVariant(" + Debug.format(expression.text) + ", [" + String.join(values, ", ") + "]" + typeId + ")"\n'
              '}\n'
          )
          if text.count(old) != 1:
              raise SystemExit('qualified variant emitter anchor mismatch')
          path.write_text(text.replace(old, new))
          PY
          printf '%s\n' 'selfhost/mvp/src/emitter.virune' > "$RUNNER_TEMP/expected-files.txt"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          git diff --check
      - name: Install dependencies
        run: node scripts/run-ci-command.mjs --id install -- npm ci
      - name: Build and type-check project references
        run: node scripts/run-ci-command.mjs --id build -- npm run check
      - name: Run qualified variant runtime regressions
        run: >-
          node scripts/run-ci-command.mjs --id qualified-variant-runtime --
          node --test --test-isolation=none
          packages/compiler/dist/test/selfhost-member-chain-integration.test.js
          packages/compiler/dist/test/selfhost-qualified-builtins-variants.test.js
      - name: Commit and push the emitter fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$TARGET_BRANCH"
          git add --pathspec-from-file="$RUNNER_TEMP/expected-files.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/staged-files.txt"
          git diff --cached --check
          git commit \
            -m 'fix(selfhost): emit qualified variants through runtime ABI' \
            -m 'Preserve dedicated Option and Result constructors while emitting general enum and algebraic variants with makeVariant(tag, payloads, typeId).' \
            -m 'Refs #293' \
            -m 'Refs #283' \
            -m 'Refs #88'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "QUALIFIED_VARIANT_FIX_COMMIT=$(git rev-parse HEAD)"
