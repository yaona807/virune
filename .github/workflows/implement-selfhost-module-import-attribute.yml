name: Implement self-host module import attribute AST

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.head_ref == 'agent/selfhost-module-import-attribute-ast' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-module-import-attribute-ast
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Implement module import attribute parser
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'selfhost/mvp/src/frontend-parser-core.virune';
          let source = await readFile(path, 'utf8');
          const recordMarker = 'record DetailedDeclarationTransport derives Json {';
          if (!source.includes('record ParsedChildren {')) {
            const records = `record ParsedChildren {\n\tstate: CoreState\n\tchildren: List<Int>\n}\n\n`;
            source = source.replace(recordMarker, records + recordMarker);
          }

          const declarationMarker = 'fn parseDeclaration(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {';
          if (!source.includes('fn parseDetailedImport(')) {
            const helpers = `fn prependNodeChildren(\n\tstateValue: CoreState,\n\tid: Int,\n\tprefix: List<Int>,\n) -> CoreState {\n\tif id < 0 || List.length(prefix) == 0 {\n\t\treturn stateValue\n\t}\n\tlet mut nodes: List<FrontendAstNode> = []\n\tfor value in stateValue.nodes {\n\t\tif value.id == id {\n\t\t\tlet updated = frontendAstNode(\n\t\t\t\tvalue.id,\n\t\t\t\tvalue.kind,\n\t\t\t\tvalue.text,\n\t\t\t\tvalue.span,\n\t\t\t\tList.concat(prefix, value.children),\n\t\t\t\tvalue.documentation,\n\t\t\t)\n\t\t\tnodes = List.append(nodes, updated)\n\t\t} else {\n\t\t\tnodes = List.append(nodes, value)\n\t\t}\n\t}\n\treturn withNodes(stateValue, nodes)\n}\n\nfn parseAttribute(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet mut state = advance(stateValue)\n\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\tlet name = if validName then currentText(state, tokens) else ""\n\tif validName {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an attribute name", state.index)\n\t}\n\tlet mut children: List<Int> = []\n\tif isText(state, tokens, "(") {\n\t\tlet argumentsValue = parseCallArguments(state, tokens)\n\t\tstate = argumentsValue.state\n\t\tchildren = List.append(children, argumentsValue.id)\n\t}\n\tstate = skipNewLines(state, tokens)\n\treturn addNode(state, tokens, "Attribute", name, start, state.index, children, [])\n}\n\nfn parseImportItem(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet mut state = stateValue\n\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\tlet name = if validName then currentText(state, tokens) else ""\n\tif validName {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an import item name", state.index)\n\t\tif !atEnd(state, tokens) && !isText(state, tokens, "}") && !isText(state, tokens, ",") {\n\t\t\tstate = advance(state)\n\t\t}\n\t}\n\tlet mut text = name\n\tif isText(state, tokens, "as") {\n\t\tstate = advance(state)\n\t\tif currentKind(state, tokens) == FrontendTokenKind.Identifier {\n\t\t\ttext = name + " as " + currentText(state, tokens)\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an import alias after as", state.index)\n\t\t}\n\t}\n\treturn addNode(state, tokens, "ImportItem", text, start, state.index, [], [])\n}\n\nfn parseNamedImportItems(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedChildren {\n\tlet mut state = stateValue\n\tlet mut children: List<Int> = []\n\tif isText(state, tokens, "{") {\n\t\tstate = skipNewLines(advance(state), tokens)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected { to begin import items", state.index)\n\t\treturn ParsedChildren { state: synchronizeLine(state, tokens), children: children }\n\t}\n\twhile !atEnd(state, tokens) && !isText(state, tokens, "}") {\n\t\tlet before = state.index\n\t\tlet item = parseImportItem(state, tokens)\n\t\tstate = item.state\n\t\tif item.id >= 0 {\n\t\t\tchildren = List.append(children, item.id)\n\t\t}\n\t\tif isText(state, tokens, ",") {\n\t\t\tstate = skipNewLines(advance(state), tokens)\n\t\t} else if !isText(state, tokens, "}") {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected , or } after an import item", state.index)\n\t\t\twhile !atEnd(state, tokens)\n\t\t\t\t&& currentKind(state, tokens) != FrontendTokenKind.NewLine\n\t\t\t\t&& !isText(state, tokens, ",")\n\t\t\t\t&& !isText(state, tokens, "}") {\n\t\t\t\tstate = advance(state)\n\t\t\t}\n\t\t\tif isText(state, tokens, ",") {\n\t\t\t\tstate = skipNewLines(advance(state), tokens)\n\t\t\t}\n\t\t}\n\t\tif state.index <= before {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Parser made no progress in import items", state.index)\n\t\t\tif !atEnd(state, tokens) {\n\t\t\t\tstate = advance(state)\n\t\t\t}\n\t\t}\n\t}\n\tif isText(state, tokens, "}") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected } to end import items", state.index)\n\t}\n\treturn ParsedChildren { state: state, children: children }\n}\n\nfn parseImportSource(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet mut state = stateValue\n\tlet validSource = currentKind(state, tokens) == FrontendTokenKind.StringLiteral\n\tlet text = if validSource then currentText(state, tokens) else ""\n\tif validSource {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an import source string", state.index)\n\t}\n\treturn addNode(state, tokens, "ImportSource", text, start, state.index, [], [])\n}\n\nfn parseDetailedImport(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet start = stateValue.index\n\tlet mut state = stateValue\n\tlet publicImport = isText(state, tokens, "pub")\n\tif publicImport {\n\t\tstate = advance(state)\n\t}\n\tif isText(state, tokens, "import") {\n\t\tstate = advance(state)\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected import", state.index)\n\t}\n\tlet javascript = isText(state, tokens, "js")\n\tif javascript {\n\t\tstate = advance(state)\n\t}\n\tlet typeOnly = isText(state, tokens, "type")\n\tif typeOnly {\n\t\tstate = advance(state)\n\t}\n\tlet mut children: List<Int> = []\n\tlet mut form = if javascript then "javascript side-effect" else "virune"\n\tlet mut sourceAlreadyParsed = false\n\tif isText(state, tokens, "{") {\n\t\tlet items = parseNamedImportItems(state, tokens)\n\t\tstate = items.state\n\t\tchildren = items.children\n\t\tform = if javascript then "javascript named" else "virune"\n\t\tif isText(state, tokens, "from") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected from after import items", state.index)\n\t\t}\n\t} else if javascript && isText(state, tokens, "*") {\n\t\tlet itemStart = state.index\n\t\tstate = advance(state)\n\t\tif isText(state, tokens, "as") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected as in a namespace import", state.index)\n\t\t}\n\t\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\t\tlet name = if validName then currentText(state, tokens) else ""\n\t\tif validName {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a namespace import name", state.index)\n\t\t}\n\t\tlet item = addNode(state, tokens, "ImportItem", "* as " + name, itemStart, state.index, [], [])\n\t\tstate = item.state\n\t\tchildren = List.append(children, item.id)\n\t\tform = "javascript namespace"\n\t\tif isText(state, tokens, "from") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected from after a namespace import", state.index)\n\t\t}\n\t} else if javascript && currentKind(state, tokens) == FrontendTokenKind.Identifier {\n\t\tlet itemStart = state.index\n\t\tlet name = currentText(state, tokens)\n\t\tstate = advance(state)\n\t\tlet item = addNode(state, tokens, "ImportItem", "default as " + name, itemStart, state.index, [], [])\n\t\tstate = item.state\n\t\tchildren = List.append(children, item.id)\n\t\tform = "javascript default"\n\t\tif isText(state, tokens, "from") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected from after a default import", state.index)\n\t\t}\n\t} else if javascript && currentKind(state, tokens) == FrontendTokenKind.StringLiteral {\n\t\tlet sourceNode = parseImportSource(state, tokens)\n\t\tstate = sourceNode.state\n\t\tchildren = List.append(children, sourceNode.id)\n\t\tform = "javascript side-effect"\n\t\tsourceAlreadyParsed = true\n\t} else {\n\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected import items or a JavaScript import binding", state.index)\n\t}\n\tif !sourceAlreadyParsed {\n\t\tlet sourceNode = parseImportSource(state, tokens)\n\t\tstate = sourceNode.state\n\t\tchildren = List.append(children, sourceNode.id)\n\t}\n\tstate = consumeLineEnd(state, tokens, "an import declaration")\n\tlet visibility = if publicImport then " public" else ""\n\tlet typeText = if typeOnly then " type" else ""\n\treturn addNode(state, tokens, "ImportDeclaration", form + visibility + typeText, start, state.index, children, [])\n}\n\n`;
            source = source.replace(declarationMarker, helpers + declarationMarker);
          }

          const moduleStart = source.indexOf('fn parseModule(lexed: FrontendLexResult) -> FrontendParseResult {');
          const moduleEnd = source.indexOf('\nfn decodeFrontend(', moduleStart);
          if (moduleStart < 0 || moduleEnd < 0) throw new Error('parseModule boundaries not found');
          const moduleParser = `fn parseModule(lexed: FrontendLexResult) -> FrontendParseResult {\n\tlet tokens = lexed.tokens\n\tlet comments = lexed.comments\n\tlet mut state = CoreState {\n\t\tindex: 0,\n\t\tnodes: [],\n\t\tdiagnostics: convertDiagnostics(lexed.diagnostics),\n\t\tcommentIndex: 0,\n\t\tpendingDocumentation: [],\n\t\tmoduleDocumentation: [],\n\t\tsignificantSeen: false,\n\t}\n\tlet mut children: List<Int> = []\n\tstate = skipNewLines(state, tokens)\n\tif !atEnd(state, tokens) {\n\t\tstate = ingestCommentsBefore(\n\t\t\tstate,\n\t\t\tcomments,\n\t\t\ttokenAt(tokens, state.index).span.start.line,\n\t\t\ttokens,\n\t\t)\n\t}\n\tif isText(state, tokens, "unsafe") && tokenAt(tokens, state.index + 1).text == "module" {\n\t\tlet start = state.index\n\t\tlet docs = takeDocumentation(state, tokens, false)\n\t\tstate = withSignificant(docs.state, true)\n\t\tstate = consumeLineEnd(withIndex(state, state.index + 2), tokens, "unsafe module")\n\t\tlet directive = addNode(state, tokens, "UnsafeModule", "unsafe module", start, state.index, [], [])\n\t\tstate = directive.state\n\t\tchildren = List.append(children, directive.id)\n\t}\n\tlet mut done = false\n\twhile !atEnd(state, tokens) && !done {\n\t\tstate = skipNewLines(state, tokens)\n\t\tif atEnd(state, tokens) {\n\t\t\tdone = true\n\t\t} else {\n\t\t\tstate = ingestCommentsBefore(\n\t\t\t\tstate,\n\t\t\t\tcomments,\n\t\t\t\ttokenAt(tokens, state.index).span.start.line,\n\t\t\t\ttokens,\n\t\t\t)\n\t\t\tlet before = state.index\n\t\t\tlet mut attributeIds: List<Int> = []\n\t\t\twhile isText(state, tokens, "@") {\n\t\t\t\tlet attribute = parseAttribute(state, tokens)\n\t\t\t\tstate = attribute.state\n\t\t\t\tif attribute.id >= 0 {\n\t\t\t\t\tattributeIds = List.append(attributeIds, attribute.id)\n\t\t\t\t}\n\t\t\t}\n\t\t\tif isText(state, tokens, "import")\n\t\t\t\t|| (isText(state, tokens, "pub") && tokenAt(tokens, state.index + 1).text == "import") {\n\t\t\t\tif List.length(attributeIds) > 0 {\n\t\t\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Attributes cannot target an import declaration", state.index)\n\t\t\t\t}\n\t\t\t\tlet docs = takeDocumentation(state, tokens, false)\n\t\t\t\tstate = withSignificant(docs.state, true)\n\t\t\t\tlet imported = parseDetailedImport(state, tokens)\n\t\t\t\tstate = imported.state\n\t\t\t\tif imported.id >= 0 {\n\t\t\t\t\tchildren = List.append(children, imported.id)\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\tlet declaration = parseDeclaration(state, tokens)\n\t\t\t\tstate = prependNodeChildren(declaration.state, declaration.id, attributeIds)\n\t\t\t\tif declaration.id >= 0 {\n\t\t\t\t\tchildren = List.append(children, declaration.id)\n\t\t\t\t}\n\t\t\t}\n\t\t\tif state.index <= before {\n\t\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Parser made no progress at module scope", state.index)\n\t\t\t\tstate = synchronizeLine(advance(state), tokens)\n\t\t\t}\n\t\t}\n\t}\n\tstate = ingestCommentsBefore(state, comments, 2147483647, tokens)\n\tif List.length(state.pendingDocumentation) > 0 {\n\t\tstate = addDiagnosticAt(\n\t\t\tstate,\n\t\t\ttokens,\n\t\t\t"L0010",\n\t\t\t"Declaration documentation is not attached to a declaration",\n\t\t\tstate.index,\n\t\t)\n\t\tstate = withComments(state, state.commentIndex, [], state.moduleDocumentation)\n\t}\n\tlet root = addNode(\n\t\tstate,\n\t\ttokens,\n\t\t"Module",\n\t\t"",\n\t\t0,\n\t\tstate.index + 1,\n\t\tchildren,\n\t\tstate.moduleDocumentation,\n\t)\n\tstate = root.state\n\tlet mut accepted = true\n\tfor diagnostic in state.diagnostics {\n\t\tif diagnostic.severity == "error" {\n\t\t\taccepted = false\n\t\t}\n\t}\n\treturn FrontendParseResult {\n\t\taccepted: accepted,\n\t\troot: root.id,\n\t\tnodes: state.nodes,\n\t\tdiagnostics: state.diagnostics,\n\t}\n}`;
          source = source.slice(0, moduleStart) + moduleParser + '\n\n' + source.slice(moduleEnd + 1);
          await writeFile(path, source);

          const englishPath = 'docs/self-hosting-frontend.md';
          let english = await readFile(englishPath, 'utf8');
          if (!english.includes('### Module prefix AST')) {
            english += '\n\n### Module prefix AST\n\nThe Stage 0 frontend emits `UnsafeModule`, detailed Virune and JavaScript `ImportDeclaration` nodes, `ImportItem`, `ImportSource`, and declaration `Attribute` nodes. Import form, visibility, and type-only mode are encoded deterministically, while attribute argument lists reuse the existing expression parser and attribute IDs are attached to the target declaration. Malformed prefix constructs recover at line and declaration boundaries.\n';
          }
          await writeFile(englishPath, english);

          const japanesePath = 'docs/self-hosting-frontend_ja.md';
          let japanese = await readFile(japanesePath, 'utf8');
          if (!japanese.includes('### Module prefix AST')) {
            japanese += '\n\n### Module prefix AST\n\nStage 0 frontendは`UnsafeModule`、Virune／JavaScriptの詳細`ImportDeclaration`、`ImportItem`、`ImportSource`、declaration `Attribute`を生成します。Import形式、visibility、type-only modeを決定的に保持し、attribute argument listは既存expression parserを再利用して、attribute IDを対象declarationへ接続します。壊れたmodule prefix構文はlineおよびdeclaration境界で復旧します。\n';
          }
          await writeFile(japanesePath, japanese);
          NODE
      - run: npm ci
      - run: npm run check
      - name: Run module import attribute Host test
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-module-import-attribute-ast.test.js
      - name: Run Stage 0 self-host tests
        run: node packages/cli/dist/src/main.js test selfhost/mvp
      - run: git diff --check
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/implement-selfhost-module-import-attribute.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfhost/mvp/src/frontend-parser-core.virune packages/compiler/test/selfhost-module-import-attribute-ast.test.ts selfhost/mvp/src/frontend-module-import-attribute.spec.virune docs/self-hosting-frontend.md docs/self-hosting-frontend_ja.md .github/workflows/implement-selfhost-module-import-attribute.yml
          git commit -m "compiler(selfhost): add module import attribute AST"
          git push origin HEAD:agent/selfhost-module-import-attribute-ast
