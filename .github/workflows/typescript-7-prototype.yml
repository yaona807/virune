name: TypeScript 7 prototype

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: typescript-7-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify TypeScript 7 impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      formal_required: ${{ steps.changes.outputs.formal_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/classify-formal-ci-changes.mjs --lane typescript7 --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node scripts/classify-formal-ci-changes.mjs --lane typescript7 --force-full
          fi

  prototype:
    name: Build compiler 7 / Compiler API 6
    needs: classify
    if: needs.classify.outputs.formal_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Verify the migration prototype
        run: npm run prototype:typescript7
      - name: Upload prototype evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typescript-7-prototype-${{ github.sha }}
          path: .cache/typescript-7-prototype/
          if-no-files-found: error
          retention-days: 30

  required-typescript7-gate:
    name: Required TypeScript 7 gate
    needs: [classify, prototype]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Require reviewed TypeScript 7 disposition
        env:
          FORMAL_REQUIRED: ${{ needs.classify.outputs.formal_required }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PROTOTYPE_RESULT: ${{ needs.prototype.result }}
        run: >-
          node scripts/verify-formal-ci-gate.mjs
          --kind optional
          --label typescript7
          --required "$FORMAL_REQUIRED"
          --classify-result "$CLASSIFY_RESULT"
          --upstream-result "$PROTOTYPE_RESULT"
