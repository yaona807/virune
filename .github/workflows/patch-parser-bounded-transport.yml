name: Patch parser bounded transport

on:
  push:
    branches:
      - agent/selfhost-frontend-parser-core
    paths:
      - .github/workflows/patch-parser-bounded-transport.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-frontend-parser-core
          fetch-depth: 0
      - name: Normalize bounded JSON string transport
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('selfhost/mvp/src/frontend-parser-core.virune')
          content = path.read_text(encoding='utf-8')
          old = '''fn decodeFrontend(source: String) -> Result<FrontendLexResult, List<JsonError>> {
          \tlet transported = lexFrontendJson(source)?
          \tlet payload = Json.decode<String>(transported)?
          \treturn Json.decode<FrontendLexResult>(payload)
          }'''
          new = '''fn unwrapModuleTransport(value: String) -> Result<String, List<JsonError>> {
          \tlet mut current = value
          \tlet mut depth = 0
          \tlet mut done = false
          \twhile depth < 8 && !done {
          \t\tlet characters = String.codePoints(current)
          \t\tlet first = match List.get(characters, 0) {
          \t\t\tSome(character) => character
          \t\t\tNone => ""
          \t\t}
          \t\tif first == "\\\"" {
          \t\t\tcurrent = Json.decode<String>(current)?
          \t\t\tdepth = depth + 1
          \t\t} else {
          \t\t\tdone = true
          \t\t}
          \t}
          \treturn Ok(current)
          }

          fn decodeFrontend(source: String) -> Result<FrontendLexResult, List<JsonError>> {
          \tlet transported = lexFrontendJson(source)?
          \tlet payload = unwrapModuleTransport(transported)?
          \treturn Json.decode<FrontendLexResult>(payload)
          }'''
          if content.count(old) != 1:
              raise SystemExit(f'replacement count: {content.count(old)}')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git rm .github/workflows/patch-parser-bounded-transport.yml
          git add selfhost/mvp/src/frontend-parser-core.virune
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(selfhost): normalize bounded module transport"
          git push origin HEAD:agent/selfhost-frontend-parser-core
