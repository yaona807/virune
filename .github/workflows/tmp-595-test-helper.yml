name: Temporary issue 595 test helper patch

on:
  push:
    branches: [fix/595-contextual-object-callback]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/595-contextual-object-callback
          fetch-depth: 0
      - name: Fix exact optional object evidence helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/js-interop/test/contextual-object-callback-fail-closed.test.ts')
          text = path.read_text()
          old = """\tif (resolution === undefined) return undefined;
\tconst objectArgument = resolution.objectArguments?.[0];
\tconst entry = objectArgument?.object.entries.find(item => item.property === 'onEvent');
"""
          new = """\tif (resolution === undefined) return undefined;
\tconst objectArguments = resolution.objectArguments;
\tif (objectArguments === undefined) return resolution;
\tconst objectArgument = objectArguments[0];
\tconst entry = objectArgument?.object.entries.find(item => item.property === 'onEvent');
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one object evidence narrowing anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_map = "objectArguments: resolution.objectArguments?.map((item, index) => index === 0 ? {"
          new_map = "objectArguments: objectArguments.map((item, index) => index === 0 ? {"
          if text.count(old_map) != 1:
              raise SystemExit(f'expected one object evidence map anchor, found {text.count(old_map)}')
          path.write_text(text.replace(old_map, new_map, 1))
          PY
          rm .github/workflows/tmp-595-test-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/js-interop/test/contextual-object-callback-fail-closed.test.ts .github/workflows/tmp-595-test-helper.yml
          git diff --cached --check
          git commit -m "test(interop): narrow nested object evidence fixtures"
          git push origin HEAD:fix/595-contextual-object-callback
