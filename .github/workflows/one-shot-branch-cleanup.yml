name: One-shot closed branch cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/cleanup-stale-branches-20260729'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches whose pull requests are all closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLEANUP_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          API = "https://api.github.com"
          TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]
          CLEANUP_BRANCH = os.environ["CLEANUP_BRANCH"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          OWNER = REPO.split("/", 1)[0]
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "virune-one-shot-branch-cleanup",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{API}{path}", data=data, headers=HEADERS, method=method
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      raw = response.read()
                      body = json.loads(raw) if raw else None
                      return response.status, body
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      body = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      body = raw.decode("utf-8", errors="replace")
                  return error.code, body

          def get_json(path):
              status, body = request("GET", path)
              if status != 200:
                  raise RuntimeError(f"GET {path} failed: HTTP {status}: {body}")
              return body

          def get_all(path):
              items = []
              page = 1
              separator = "&" if "?" in path else "?"
              while True:
                  batch = get_json(f"{path}{separator}per_page=100&page={page}")
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1

          repo_info = get_json(f"/repos/{REPO}")
          default_branch = repo_info["default_branch"]
          pull_requests = get_all(f"/repos/{REPO}/pulls?state=all")
          branches = get_all(f"/repos/{REPO}/branches")

          deleted = []
          preserved = []
          failed = []

          def delete_branch(branch, reason=None):
              ref = urllib.parse.quote(f"heads/{branch}", safe="/")
              status, body = request("DELETE", f"/repos/{REPO}/git/refs/{ref}")
              if status == 204:
                  deleted.append(f"{branch}{f' ({reason})' if reason else ''}")
                  return True
              failed.append(f"{branch} (HTTP {status}: {body})")
              return False

          for item in branches:
              branch = item["name"]
              if branch in {default_branch, CLEANUP_BRANCH}:
                  preserved.append(branch)
                  continue

              if branch.startswith("release-candidate/v"):
                  tag = branch.removeprefix("release-candidate/")
                  encoded_tag = urllib.parse.quote(tag, safe="")
                  tag_status, _ = request("GET", f"/repos/{REPO}/git/ref/tags/{encoded_tag}")
                  release_status, _ = request(
                      "GET", f"/repos/{REPO}/releases/tags/{encoded_tag}"
                  )
                  if tag_status == 200 and release_status == 200:
                      delete_branch(branch, "published release candidate")
                      continue

              matches = [
                  pull
                  for pull in pull_requests
                  if pull.get("head", {}).get("repo", {}).get("full_name") == REPO
                  and pull.get("head", {}).get("ref") == branch
              ]
              if matches and all(pull.get("state") == "closed" for pull in matches):
                  delete_branch(branch)
              else:
                  preserved.append(branch)

          summary = {
              "default_branch": default_branch,
              "deleted": deleted,
              "preserved": preserved,
              "failed": failed,
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Branch cleanup result\n\n")
              output.write(f"- Default branch preserved: `{default_branch}`\n")
              output.write(f"- Deleted: {len(deleted)}\n")
              output.write(f"- Preserved: {len(preserved)}\n")
              output.write(f"- Failed: {len(failed)}\n\n")
              output.write("### Deleted branches\n")
              output.writelines(f"- `{branch}`\n" for branch in deleted or ["None"])
              output.write("\n### Preserved branches\n")
              output.writelines(f"- `{branch}`\n" for branch in preserved or ["None"])
              if failed:
                  output.write("\n### Failed deletions\n")
                  output.writelines(f"- `{branch}`\n" for branch in failed)

          status, body = request(
              "PATCH", f"/repos/{REPO}/pulls/{PR_NUMBER}", {"state": "closed"}
          )
          if status != 200:
              raise RuntimeError(f"Failed to close cleanup PR: HTTP {status}: {body}")

          cleanup_ref = urllib.parse.quote(f"heads/{CLEANUP_BRANCH}", safe="/")
          status, body = request("DELETE", f"/repos/{REPO}/git/refs/{cleanup_ref}")
          if status != 204:
              raise RuntimeError(
                  f"Failed to delete cleanup branch: HTTP {status}: {body}"
              )
          PY
