name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag matches package version
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Expected tag $expected, got $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Execute stable release gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:gate
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            .cache/release/release-evidence.json
            .cache/reproducible-release/
            release/
          if-no-files-found: error
          retention-days: 90
      - name: Attest release build provenance
        id: provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest release SBOM
        id: sbom-attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: release/SHA256SUMS
          sbom-path: release/SBOM.cdx.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; stable assets are immutable." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
