name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-candidate/v*'

permissions:
  actions: read
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Resolve and verify release identity
        id: release
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "$tag" || { echo "Expected tag $tag, got $GITHUB_REF_NAME" >&2; exit 1; }
          else
            expected_branch="release-candidate/${tag}"
            test "$GITHUB_REF_NAME" = "$expected_branch" || { echo "Expected RC branch $expected_branch, got $GITHUB_REF_NAME" >&2; exit 1; }
            [[ "$version" == *-* ]] || { echo "Release-candidate branches may publish prerelease versions only." >&2; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        run: npm ci
      - name: Execute stable release gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:gate
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ steps.release.outputs.tag }}
          path: |
            .cache/release/release-evidence.json
            .cache/reproducible-release/
            release/
          if-no-files-found: error
          retention-days: 90
      - name: Attest release build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Attest release SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
          sbom-path: release/SBOM.cdx.json
      - name: Resolve verified npm publication eligibility
        id: npm-publication
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { verifyNpmPublicationIdentity } from './scripts/verify-npm-publication-identity.mjs';
          const identity = verifyNpmPublicationIdentity();
          appendFileSync(process.env.GITHUB_OUTPUT, `eligible=${identity.registryVersionEligible}\n`);
          NODE
      - name: Pin npm Trusted Publishing client
        if: steps.npm-publication.outputs.eligible == 'true'
        shell: bash
        run: |
          npm install --global npm@11.19.0 --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.19.0"
      - name: Publish reviewed npm Registry packages
        if: steps.npm-publication.outputs.eligible == 'true'
        shell: bash
        run: node scripts/publish-npm-release.mjs --expected-commit="$GITHUB_SHA"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; release assets are immutable." >&2
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          release_args=("$TAG" release/* --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then release_args+=(--prerelease); fi
          gh release create "${release_args[@]}"
