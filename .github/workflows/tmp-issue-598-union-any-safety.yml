name: Temporary issue 598 union any-safety patch

on:
  push:
    branches:
      - fix/598-structural-foreign-argument-any

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/598-structural-foreign-argument-any
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify regression fails before fix
        run: |
          npm run build
          if node --test packages/js-interop/dist/test/usage-resolution-structural-any-safety.test.js; then
            echo "expected union any-safety regression to fail before the fix" >&2
            exit 1
          fi
      - name: Apply guarded source patch
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Build patched repository
        run: npm run build
      - name: Run focused Interop safety regressions
        run: node --test packages/js-interop/dist/test/usage-resolution-any-safety.test.js packages/js-interop/dist/test/usage-resolution-structural-any-safety.test.js
      - name: Commit validated patch
        run: |
          rm .github/workflows/tmp-issue-598-union-any-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/js-interop/src/index.ts .github/workflows/tmp-issue-598-union-any-safety.yml
          git commit -m "fix(interop): isolate union any-safety evidence"
          git push origin HEAD:fix/598-structural-foreign-argument-any
      - name: Remove failed patch runner
        if: failure()
        run: |
          git reset --hard HEAD
          rm -f .github/workflows/tmp-issue-598-union-any-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove failed issue 598 union patch runner" || true
          git push origin HEAD:fix/598-structural-foreign-argument-any
