name: Patch parser lexer boundary

on:
  push:
    branches:
      - agent/selfhost-frontend-parser-core
    paths:
      - .github/workflows/patch-parser-lexer-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-frontend-parser-core
          fetch-depth: 0
      - name: Keep JSON at the Host boundary only
        shell: python
        run: |
          import re
          from pathlib import Path

          lexer_path = Path('selfhost/mvp/src/frontend-lexer.virune')
          lexer = lexer_path.read_text(encoding='utf-8')
          lexer_pattern = re.compile(
              r'@jsExport\npub fn lexFrontend\(source: String\) -> Result<String, List<JsonError>> \{\n\treturn Json\.encode<FrontendLexResult>\(scanFrontend\(source\)\)\n\}',
          )
          lexer_replacement = '''pub fn scanFrontendResult(source: String) -> FrontendLexResult {
          \treturn scanFrontend(source)
          }

          @jsExport
          pub fn lexFrontend(source: String) -> Result<String, List<JsonError>> {
          \treturn Json.encode<FrontendLexResult>(scanFrontendResult(source))
          }'''
          lexer, lexer_count = lexer_pattern.subn(lexer_replacement, lexer)
          if lexer_count != 1:
              raise SystemExit(f'lexer replacement count: {lexer_count}')
          lexer_path.write_text(lexer, encoding='utf-8')

          parser_path = Path('selfhost/mvp/src/frontend-parser-core.virune')
          parser = parser_path.read_text(encoding='utf-8')
          parser, import_count = re.subn(
              r'import \{ lexFrontend \} from "\./frontend-lexer\.virune"',
              'import { scanFrontendResult } from "./frontend-lexer.virune"',
              parser,
          )
          decode_pattern = re.compile(
              r'fn decodeFrontend\(source: String\) -> Result<FrontendLexResult, List<JsonError>> \{\n'
              r'(?:\t.*\n)+?'
              r'\}',
          )
          decode_replacement = '''fn decodeFrontend(source: String) -> Result<FrontendLexResult, List<JsonError>> {
          \treturn Ok(scanFrontendResult(source))
          }'''
          parser, decode_count = decode_pattern.subn(decode_replacement, parser, count=1)
          if import_count != 1:
              raise SystemExit(f'import replacement count: {import_count}')
          if decode_count != 1:
              raise SystemExit(f'decode replacement count: {decode_count}')
          parser_path.write_text(parser, encoding='utf-8')
      - name: Commit patch and remove helper workflow
        run: |
          git rm .github/workflows/patch-parser-lexer-boundary.yml
          git add selfhost/mvp/src/frontend-lexer.virune selfhost/mvp/src/frontend-parser-core.virune
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(selfhost): keep lexer JSON at host boundary"
          git push origin HEAD:agent/selfhost-frontend-parser-core
