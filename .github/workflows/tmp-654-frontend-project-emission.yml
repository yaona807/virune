name: Temporary PR 654 frontend project emission patch

on:
  push:
    branches:
      - feat/frontend-project-jsx-emission

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/frontend-project-jsx-emission
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Apply exact project and regression patches
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          function replaceOnce(text, from, to, label) {
            const first = text.indexOf(from);
            if (first < 0) throw new Error(`Missing patch anchor: ${label}`);
            if (text.indexOf(from, first + from.length) >= 0) throw new Error(`Ambiguous patch anchor: ${label}`);
            return text.slice(0, first) + to + text.slice(first + from.length);
          }

          const projectPath = 'packages/compiler/src/project/project.ts';
          let project = await readFile(projectPath, 'utf8');
          project = replaceOnce(
            project,
            "import { validateFrontendJsxUsage } from '../interop/jsx-view-validation.js';\n",
            "import { validateFrontendComponentEmissionBoundary } from '../interop/frontend-component-emission.js';\nimport { validateFrontendJsxUsage } from '../interop/jsx-view-validation.js';\n",
            'project frontend validator import',
          );
          project = replaceOnce(
            project,
            "\tif (includeConfigEntry) await visit(entry);\n\tfor (const additionalEntry of additionalEntries) await visit(isAbsolute(additionalEntry) ? additionalEntry : resolve(root, additionalEntry));\n\tconst moduleInterfaces = await buildModuleInterfaces(root, order, parsedByPath, projectDiagnostics, host);\n",
            "\tif (includeConfigEntry) await visit(entry);\n\tfor (const additionalEntry of additionalEntries) await visit(isAbsolute(additionalEntry) ? additionalEntry : resolve(root, additionalEntry));\n\tconst importedModulePaths = new Set([...dependenciesByPath.values()].flat());\n\tconst moduleInterfaces = await buildModuleInterfaces(root, order, parsedByPath, projectDiagnostics, host);\n",
            'project incoming dependency set',
          );
          project = replaceOnce(
            project,
            "\tfor (const path of order) {\n\t\tconst parsed = parsedByPath.get(path)!;\n\t\tconst dependencySignature = contentHash((dependenciesByPath.get(path) ?? []).map(dependency => `${dependency}:${interfaceHashes.get(dependency) ?? ''}`).sort().join('|'));\n\t\tconst buildFingerprint = contentHash(`${sourceHashes.get(path) ?? ''}|${dependencySignature}|${configFingerprint}`);\n",
            "\tfor (const path of order) {\n\t\tconst parsed = parsedByPath.get(path)!;\n\t\tconst component = parsed.ast?.declarations.find(declaration => declaration.kind === 'ComponentDeclaration');\n\t\tconst importedComponent = component !== undefined && importedModulePaths.has(path);\n\t\tconst dependencySignature = contentHash((dependenciesByPath.get(path) ?? []).map(dependency => `${dependency}:${interfaceHashes.get(dependency) ?? ''}`).sort().join('|'));\n\t\tconst buildFingerprint = contentHash(`${sourceHashes.get(path) ?? ''}|${dependencySignature}|${importedComponent ? 'component-imported' : ''}|${configFingerprint}`);\n",
            'project build fingerprint',
          );
          project = replaceOnce(
            project,
            "\t\t\tvalidateFrontendJsxUsage(parsed.ast, semantic, { containingFile: path, platform: config.platform, ...(jsInteropProvider === undefined ? {} : { jsInteropProvider }) });\n\t\t\tmutableStats.checkedModules++;\n\t\t\tconst component = parsed.ast.declarations.find(declaration => declaration.kind === 'ComponentDeclaration');\n\t\t\tif (!semantic.diagnostics.hasErrors && component !== undefined && isWithin(resolve(root, config.sourceDir), path)) {\n\t\t\t\tsemantic.diagnostics.error('L4307', 'Component emission is unavailable until frontend JSX usage and preserved artifact emission are implemented', component.span);\n\t\t\t}\n\t\t\tconst diagnostics = [...parsed.diagnostics, ...semantic.diagnostics.items];\n\t\t\tlet output: EmitResult | undefined; let outputPath: string | undefined;\n\t\t\tif (!diagnostics.some(item => item.severity === 'error') && isWithin(resolve(root, config.sourceDir), path)) {\n\t\t\t\tconst relativePath = relative(resolve(root, config.sourceDir), path);\n\t\t\t\toutputPath = resolve(root, config.outDir, relativePath.replace(/\\.virune$/u, '.js'));\n",
            "\t\t\tvalidateFrontendJsxUsage(parsed.ast, semantic, { containingFile: path, platform: config.platform, ...(jsInteropProvider === undefined ? {} : { jsInteropProvider }) });\n\t\t\tmutableStats.checkedModules++;\n\t\t\tconst inSourceDirectory = isWithin(resolve(root, config.sourceDir), path);\n\t\t\tif (!semantic.diagnostics.hasErrors && component !== undefined && inSourceDirectory) {\n\t\t\t\tif (importedComponent) semantic.diagnostics.error('L4307', 'Component module emission is unavailable while another Virune module imports it; cross-module preserved JSX artifact routing is not implemented', component.span);\n\t\t\t\telse validateFrontendComponentEmissionBoundary(parsed.ast, semantic, semantic.diagnostics);\n\t\t\t}\n\t\t\tconst diagnostics = [...parsed.diagnostics, ...semantic.diagnostics.items];\n\t\t\tlet output: EmitResult | undefined; let outputPath: string | undefined;\n\t\t\tif (!diagnostics.some(item => item.severity === 'error') && inSourceDirectory) {\n\t\t\t\tconst relativePath = relative(resolve(root, config.sourceDir), path);\n\t\t\t\toutputPath = resolve(root, config.outDir, relativePath.replace(/\\.virune$/u, component === undefined ? '.js' : '.jsx'));\n",
            'project component emission gate',
          );
          await writeFile(projectPath, project, 'utf8');

          const jsxTestPath = 'packages/js-interop/test/frontend-jsx-validation.test.ts';
          let jsxTest = await readFile(jsxTestPath, 'utf8');
          jsxTest = replaceOnce(
            jsxTest,
            "test('project builds reuse the same JSX oracle validation before the existing emission gate', async () => {",
            "test('project builds preserve JSX output after the JSX oracle accepts usage', async () => {",
            'project JSX test title',
          );
          jsxTest = replaceOnce(
            jsxTest,
            "\t\tassert.equal(accepted.diagnostics.some(item => item.code === 'L4308'), false);\n\t\tassert.ok(accepted.diagnostics.some(item => item.code === 'L4307'));\n",
            "\t\tassert.equal(accepted.diagnostics.some(item => item.code === 'L4308'), false);\n\t\tassert.equal(accepted.diagnostics.some(item => item.code === 'L4307'), false);\n\t\tconst acceptedModule = accepted.modules.find(module => module.source.path === join(root, 'src/main.virune'));\n\t\tassert.equal(acceptedModule?.outputPath, join(root, 'dist/main.jsx'));\n\t\tassert.ok(acceptedModule?.output);\n",
            'project JSX accepted assertions',
          );
          await writeFile(jsxTestPath, jsxTest, 'utf8');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Build focused artifacts
        run: npm run build

      - name: Run focused frontend tests
        run: >-
          node --test --test-timeout=120000
          packages/compiler/dist/test/project-frontend-jsx-emission.test.js
          packages/compiler/dist/test/frontend-preserved-jsx-emission.test.js
          packages/compiler/dist/test/internal-visibility.test.js
          packages/js-interop/dist/test/frontend-jsx-validation.test.js

      - name: Remove temporary transport and commit final source tree
        shell: bash
        run: |
          rm .github/workflows/tmp-654-frontend-project-emission.yml
          cat > .github/self-hosting/temporary-artifacts.json <<'JSON'
          {
          	"schemaVersion": 1,
          	"artifacts": []
          }
          JSON
          git add -A
          node scripts/verify-selfhost-temporary-artifacts.mjs --require-clean
          expected="$(printf '%s\n' \
            packages/compiler/src/compiler.ts \
            packages/compiler/src/interop/frontend-component-emission.ts \
            packages/compiler/src/project/project.ts \
            packages/compiler/test/project-frontend-jsx-emission.test.ts \
            packages/js-interop/test/frontend-jsx-validation.test.ts | sort)"
          actual="$(git diff --cached --name-only origin/main | sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'Unexpected final diff paths:\n%s\n' "$actual"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(frontend): emit standalone project components as JSX'
          git push origin HEAD:feat/frontend-project-jsx-emission
