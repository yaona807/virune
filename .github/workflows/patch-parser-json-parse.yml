name: Patch parser JSON parsing

on:
  push:
    branches:
      - agent/selfhost-frontend-parser-core
    paths:
      - .github/workflows/patch-parser-json-parse.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-frontend-parser-core
          fetch-depth: 0
      - name: Parse JSON text before decoding the lexer payload
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('selfhost/mvp/src/frontend-parser-core.virune')
          content = path.read_text(encoding='utf-8')
          start = content.index('fn decodeFrontend(')
          end = content.index('\n\n@jsExport\npub fn parseFrontendCore', start)
          replacement = '''fn decodeFrontend(source: String) -> Result<FrontendLexResult, List<JsonError>> {
          \tlet encoded = lexFrontendJson(source)?
          \tlet raw = Json.parse(encoded)?
          \treturn Json.decode<FrontendLexResult>(raw)
          }'''
          path.write_text(content[:start] + replacement + content[end:], encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git rm .github/workflows/patch-parser-json-parse.yml
          git add selfhost/mvp/src/frontend-parser-core.virune
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(selfhost): parse lexer JSON before decoding"
          git push origin HEAD:agent/selfhost-frontend-parser-core
