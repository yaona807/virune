name: Frontend callable props diagnostic

on:
  push:
    branches:
      - feat/frontend-view-callable-props
    paths:
      - .github/workflows/frontend-callable-props-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/frontend-view-callable-props
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Reproduce exact edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/frontend-callable-props-branch-edit.yml').read_text()
          marker = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if marker not in source:
              raise SystemExit('embedded edit script marker missing')
          body = source.split(marker, 1)[1].split(end, 1)[0]
          Path('/tmp/frontend-edit.py').write_text(textwrap.dedent(body))
          PY
          python /tmp/frontend-edit.py
      - name: Focused validation with captured log
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .cache/frontend-callable-props
          {
            echo '=== npm ci ==='
            npm ci
            echo '=== npm run build ==='
            npm run build
            echo '=== focused test ==='
            node --test packages/js-interop/dist/test/frontend-view-callable-props.test.js
          } 2>&1 | tee .cache/frontend-callable-props/validation.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-callable-props-diagnostic-${{ github.sha }}
          path: .cache/frontend-callable-props/validation.log
          if-no-files-found: error
      - name: Fail if validation failed
        if: steps.validate.outcome != 'success'
        run: exit 1
