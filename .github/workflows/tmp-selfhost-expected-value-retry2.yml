name: Temporary self-host expected value retry 2

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/selfhost-try-rebuild-run-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Retry with dedicated expected record-field helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/tmp-selfhost-expected-list-retry.yml').read_text()
          replacement = ''
          updated, count = re.subn(r"record_patch = '[^']+'", f"record_patch = '{replacement}'", workflow, count=1)
          if count != 1:
              raise RuntimeError(f'expected one record patch assignment, found {count}')
          marker = '        run: |\n'
          if updated.count(marker) != 1:
              raise RuntimeError(f'expected one run block, found {updated.count(marker)}')
          Path('/tmp/expected-value-retry2.sh').write_text(textwrap.dedent(updated.split(marker, 1)[1]))
          PY
          bash /tmp/expected-value-retry2.sh
