name: Implement self-host statement detail AST

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.head_ref == 'agent/selfhost-statement-detail-ast' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/selfhost-statement-detail-ast
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Implement statement detail parser
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          function requireText(source, text, label) {
            if (!source.includes(text)) throw new Error('Missing ' + label);
          }

          const declarationPath = 'selfhost/mvp/src/frontend-declaration-parser.virune';
          let declaration = await readFile(declarationPath, 'utf8');
          const declarationMarker = 'pub fn parseDetailedDeclarationJson(';
          requireText(declaration, declarationMarker, 'declaration export marker');
          if (!declaration.includes('pub fn parseTypeReferenceJson(')) {
            const typeExport = `fn parseTypeReferenceTransport(\n\ttokens: List<FrontendToken>,\n\tstartIndex: Int,\n\tbaseId: Int,\n) -> DetailedDeclarationTransport {\n\tlet initial = DetailState {\n\t\tindex: startIndex,\n\t\tbaseId: baseId,\n\t\tnodes: [],\n\t\tdiagnostics: [],\n\t}\n\tlet parsed = parseTypeReference(initial, tokens)\n\treturn DetailedDeclarationTransport {\n\t\tnextIndex: parsed.state.index,\n\t\tnodes: parsed.state.nodes,\n\t\tdiagnostics: parsed.state.diagnostics,\n\t\troot: parsed.id,\n\t}\n}\n\npub fn parseTypeReferenceJson(\n\ttokensEncoded: String,\n\tstartIndex: Int,\n\tbaseId: Int,\n) -> Result<String, List<JsonError>> {\n\tlet tokensRaw = Json.parse(tokensEncoded)?\n\tlet tokens = Json.decode<List<FrontendToken>>(tokensRaw)?\n\treturn Json.encode<DetailedDeclarationTransport>(\n\t\tparseTypeReferenceTransport(tokens, startIndex, baseId),\n\t)\n}`;
            declaration = declaration.replace(declarationMarker, typeExport + '\n\n' + declarationMarker);
          }
          await writeFile(declarationPath, declaration);

          const corePath = 'selfhost/mvp/src/frontend-parser-core.virune';
          let core = await readFile(corePath, 'utf8');
          requireText(core, 'import { parseDetailedDeclarationJson } from "./frontend-declaration-parser.virune"', 'declaration import');
          core = core.replace(
            'import { parseDetailedDeclarationJson } from "./frontend-declaration-parser.virune"',
            'import {\n\tparseDetailedDeclarationJson,\n\tparseTypeReferenceJson,\n} from "./frontend-declaration-parser.virune"',
          );

          const statementStart = core.indexOf('fn parseStatement(');
          const statementEnd = core.indexOf('\nfn parseFunction(', statementStart);
          if (statementStart < 0 || statementEnd < 0) throw new Error('Statement parser boundaries not found');

          const statementParser = `fn parseStatement(stateValue: CoreState, tokens: List<FrontendToken>) -> ParsedNode {\n\tlet mut state = stateValue\n\tlet start = state.index\n\tlet text = currentText(state, tokens)\n\tif text == "break" || text == "continue" {\n\t\tstate = consumeLineEnd(advance(state), tokens, text)\n\t\tlet kind = if text == "break" then "BreakStatement" else "ContinueStatement"\n\t\treturn addNode(state, tokens, kind, text, start, state.index, [], [])\n\t}\n\tif text == "let" {\n\t\tstate = advance(state)\n\t\tlet mutable = isText(state, tokens, "mut")\n\t\tif mutable {\n\t\t\tstate = advance(state)\n\t\t}\n\t\tlet bindingStart = state.index\n\t\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\t\tlet name = if validName then currentText(state, tokens) else ""\n\t\tif validName {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a local binding name", state.index)\n\t\t}\n\t\tlet mut bindingChildren: List<Int> = []\n\t\tif isText(state, tokens, ":") {\n\t\t\tlet annotation = parseTypeReferenceNode(advance(state), tokens)\n\t\t\tstate = annotation.state\n\t\t\tif annotation.id >= 0 {\n\t\t\t\tbindingChildren = List.append(bindingChildren, annotation.id)\n\t\t\t}\n\t\t}\n\t\tlet bindingText = if mutable then "mut " + name else name\n\t\tlet binding = addNode(\n\t\t\tstate,\n\t\t\ttokens,\n\t\t\t"LetBinding",\n\t\t\tbindingText,\n\t\t\tbindingStart,\n\t\t\tstate.index,\n\t\t\tbindingChildren,\n\t\t\t[],\n\t\t)\n\t\tstate = binding.state\n\t\tif isText(state, tokens, "=") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected = in a let statement", state.index)\n\t\t}\n\t\tlet expression = parseExpression(state, tokens, 1, false)\n\t\tstate = consumeLineEnd(expression.state, tokens, "a let statement")\n\t\tlet mut children: List<Int> = [binding.id]\n\t\tif expression.id >= 0 {\n\t\t\tchildren = List.append(children, expression.id)\n\t\t}\n\t\treturn addNode(state, tokens, "LetStatement", "let", start, state.index, children, [])\n\t}\n\tif text == "return" || text == "discard" || text == "defer" {\n\t\tstate = advance(state)\n\t\tlet mut children: List<Int> = []\n\t\tlet hasValue = currentKind(state, tokens) != FrontendTokenKind.NewLine\n\t\t\t&& !atEnd(state, tokens)\n\t\t\t&& !isText(state, tokens, "}")\n\t\tif hasValue {\n\t\t\tlet expression = parseExpression(state, tokens, 1, false)\n\t\t\tstate = expression.state\n\t\t\tif expression.id >= 0 {\n\t\t\t\tchildren = List.append(children, expression.id)\n\t\t\t}\n\t\t} else if text != "return" {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected an expression after " + text, state.index)\n\t\t}\n\t\tstate = consumeLineEnd(state, tokens, text)\n\t\tlet kind = if text == "return" then "ReturnStatement" else if text == "discard" then "DiscardStatement" else "DeferStatement"\n\t\treturn addNode(state, tokens, kind, text, start, state.index, children, [])\n\t}\n\tif text == "if" {\n\t\tlet condition = parseExpression(advance(state), tokens, 1, true)\n\t\tstate = condition.state\n\t\tlet body = parseBlock(state, tokens)\n\t\tstate = body.state\n\t\tlet mut children: List<Int> = []\n\t\tif condition.id >= 0 {\n\t\t\tchildren = List.append(children, condition.id)\n\t\t}\n\t\tchildren = List.append(children, body.id)\n\t\tif isText(state, tokens, "else") {\n\t\t\tstate = advance(state)\n\t\t\tif isText(state, tokens, "if") {\n\t\t\t\tlet alternative = parseStatement(state, tokens)\n\t\t\t\tstate = alternative.state\n\t\t\t\tif alternative.id >= 0 {\n\t\t\t\t\tchildren = List.append(children, alternative.id)\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\tlet alternative = parseBlock(state, tokens)\n\t\t\t\tstate = alternative.state\n\t\t\t\tchildren = List.append(children, alternative.id)\n\t\t\t}\n\t\t}\n\t\treturn addNode(state, tokens, "IfStatement", "if", start, state.index, children, [])\n\t}\n\tif text == "while" {\n\t\tlet condition = parseExpression(advance(state), tokens, 1, true)\n\t\tstate = condition.state\n\t\tlet body = parseBlock(state, tokens)\n\t\tstate = body.state\n\t\tlet mut children: List<Int> = []\n\t\tif condition.id >= 0 {\n\t\t\tchildren = List.append(children, condition.id)\n\t\t}\n\t\tchildren = List.append(children, body.id)\n\t\treturn addNode(state, tokens, "WhileStatement", "while", start, state.index, children, [])\n\t}\n\tif text == "for" {\n\t\tstate = advance(state)\n\t\tlet bindingStart = state.index\n\t\tlet validName = currentKind(state, tokens) == FrontendTokenKind.Identifier\n\t\tlet name = if validName then currentText(state, tokens) else ""\n\t\tif validName {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected a loop binding", state.index)\n\t\t}\n\t\tlet binding = addNode(state, tokens, "ForBinding", name, bindingStart, state.index, [], [])\n\t\tstate = binding.state\n\t\tif isText(state, tokens, "in") {\n\t\t\tstate = advance(state)\n\t\t} else {\n\t\t\tstate = addDiagnosticAt(state, tokens, "P0001", "Expected in in a for statement", state.index)\n\t\t}\n\t\tlet iterable = parseExpression(state, tokens, 1, true)\n\t\tstate = iterable.state\n\t\tlet body = parseBlock(state, tokens)\n\t\tstate = body.state\n\t\tlet mut children: List<Int> = [binding.id]\n\t\tif iterable.id >= 0 {\n\t\t\tchildren = List.append(children, iterable.id)\n\t\t}\n\t\tchildren = List.append(children, body.id)\n\t\treturn addNode(state, tokens, "ForStatement", "for", start, state.index, children, [])\n\t}\n\tif currentKind(state, tokens) == FrontendTokenKind.Identifier\n\t\t&& tokenAt(tokens, state.index + 1).text == "=" {\n\t\tlet targetName = currentText(state, tokens)\n\t\tlet target = addNode(advance(state), tokens, "AssignmentTarget", targetName, start, start + 1, [], [])\n\t\tstate = target.state\n\t\tstate = advance(state)\n\t\tlet value = parseExpression(state, tokens, 1, false)\n\t\tstate = consumeLineEnd(value.state, tokens, "an assignment statement")\n\t\tlet mut children: List<Int> = [target.id]\n\t\tif value.id >= 0 {\n\t\t\tchildren = List.append(children, value.id)\n\t\t}\n\t\treturn addNode(state, tokens, "AssignmentStatement", "=", start, state.index, children, [])\n\t}\n\tlet expression = parseExpression(state, tokens, 1, false)\n\tstate = consumeLineEnd(expression.state, tokens, "an expression statement")\n\tlet mut children: List<Int> = []\n\tif expression.id >= 0 {\n\t\tchildren = List.append(children, expression.id)\n\t}\n\treturn addNode(state, tokens, "ExpressionStatement", "", start, state.index, children, [])\n}`;

          core = core.slice(0, statementStart) + statementParser + '\n\n' + core.slice(statementEnd + 1);
          const updatedStatementStart = core.indexOf('fn parseStatement(');
          const typeHelpers = `fn loadTypeReference(\n\tstate: CoreState,\n\ttokens: List<FrontendToken>,\n) -> Result<DetailedDeclarationTransport, List<JsonError>> {\n\tlet tokensEncoded = Json.encode<List<FrontendToken>>(tokens)?\n\tlet encoded = parseTypeReferenceJson(\n\t\ttokensEncoded,\n\t\tstate.index,\n\t\tList.length(state.nodes),\n\t)?\n\tlet raw = Json.parse(encoded)?\n\treturn Json.decode<DetailedDeclarationTransport>(raw)\n}\n\nfn mergeTypeReference(\n\tstateValue: CoreState,\n\tvalue: DetailedDeclarationTransport,\n) -> ParsedNode {\n\tlet state = CoreState {\n\t\tindex: value.nextIndex,\n\t\tnodes: List.concat(stateValue.nodes, value.nodes),\n\t\tdiagnostics: List.concat(stateValue.diagnostics, value.diagnostics),\n\t\tcommentIndex: stateValue.commentIndex,\n\t\tpendingDocumentation: stateValue.pendingDocumentation,\n\t\tmoduleDocumentation: stateValue.moduleDocumentation,\n\t\tsignificantSeen: stateValue.significantSeen,\n\t}\n\treturn ParsedNode { state: state, id: value.root }\n}\n\nfn typeReferenceFailure(\n\tstateValue: CoreState,\n\ttokens: List<FrontendToken>,\n) -> ParsedNode {\n\tlet failed = addDiagnosticAt(\n\t\tstateValue,\n\t\ttokens,\n\t\t"P9003",\n\t\t"Type reference parser transport failed",\n\t\tstateValue.index,\n\t)\n\treturn ParsedNode { state: failed, id: -1 }\n}\n\nfn parseTypeReferenceNode(\n\tstateValue: CoreState,\n\ttokens: List<FrontendToken>,\n) -> ParsedNode {\n\treturn match loadTypeReference(stateValue, tokens) {\n\t\tOk(value) => mergeTypeReference(stateValue, value)\n\t\tErr(_) => typeReferenceFailure(stateValue, tokens)\n\t}\n}`;
          core = core.slice(0, updatedStatementStart) + typeHelpers + '\n\n' + core.slice(updatedStatementStart);
          await writeFile(corePath, core);

          const englishPath = 'docs/self-hosting-frontend.md';
          let english = await readFile(englishPath, 'utf8');
          if (!english.includes('### Statement detail AST')) {
            english += '\n\n### Statement detail AST\n\nThe Stage 0 frontend expands local statements into the canonical flat arena. `LetStatement` owns a `LetBinding` child and initializer; the binding text distinguishes `mut` and may own a detailed type-reference child. Assignments use an `AssignmentTarget` child, while `ForStatement` owns `ForBinding`, iterable, and body children. Invalid headers recover at line or block boundaries without changing the production parser selection or public compiler contracts.\n';
          }
          await writeFile(englishPath, english);

          const japanesePath = 'docs/self-hosting-frontend_ja.md';
          let japanese = await readFile(japanesePath, 'utf8');
          if (!japanese.includes('### Statement detail AST')) {
            japanese += '\n\n### Statement detail AST\n\nStage 0 frontendはlocal statementをcanonical flat arenaへ詳細化します。`LetStatement`は`LetBinding`とinitializerをchildとして持ち、binding textで`mut`を区別し、任意の型注釈は詳細type-reference childとして接続します。assignmentは`AssignmentTarget`を持ち、`ForStatement`は`ForBinding`、iterable、bodyを保持します。壊れたheaderはlineまたはblock境界で復旧し、Production Parserの選択や公開Compiler契約は変更しません。\n';
          }
          await writeFile(japanesePath, japanese);
          NODE
      - run: npm ci
      - run: npm run check
      - name: Run statement detail Host test
        run: node --test --test-timeout=120000 packages/compiler/dist/test/selfhost-statement-detail-ast.test.js
      - name: Run Stage 0 self-host tests
        run: node packages/cli/dist/src/main.js test selfhost/mvp
      - run: git diff --check
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/implement-selfhost-statement-detail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfhost/mvp/src/frontend-declaration-parser.virune selfhost/mvp/src/frontend-parser-core.virune packages/compiler/test/selfhost-statement-detail-ast.test.ts selfhost/mvp/src/frontend-statement-detail.spec.virune docs/self-hosting-frontend.md docs/self-hosting-frontend_ja.md .github/workflows/implement-selfhost-statement-detail.yml
          git commit -m "compiler(selfhost): add statement detail AST"
          git push origin HEAD:agent/selfhost-statement-detail-ast
