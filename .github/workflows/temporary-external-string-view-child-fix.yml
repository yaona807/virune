name: Temporary External string View child fix

on:
  push:
    branches:
      - fix/frontend-external-string-child

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/frontend-external-string-child
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused proof-renderer fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('packages/compiler/src/interop/jsx-view-validation.ts')
          source = source_path.read_text()
          marker = "\tif (type.kind === 'foreign' && expression.kind === 'IdentifierExpression' && expression.symbolId !== undefined) {"
          replacement = "\tif (type.kind === 'foreign' && type.snapshot.category === 'primitive' && type.snapshot.primitive === 'string') return '(\"\" as string)';\n" + marker
          if source.count(marker) != 1:
              raise SystemExit(f'foreign View value marker count={source.count(marker)}')
          source_path.write_text(source.replace(marker, replacement, 1))

          test_path = Path('packages/js-interop/test/frontend-jsx-validation.test.ts')
          test = test_path.read_text()
          decl_marker = 'export declare const UnknownValue: unknown;\n'
          if test.count(decl_marker) != 1:
              raise SystemExit(f'declaration marker count={test.count(decl_marker)}')
          test = test.replace(decl_marker, decl_marker + 'export declare function currentText(): string;\n', 1)

          runtime_marker = "export const Card = () => null; export const child = () => null; export const ui = { Tile: () => null }; export const UnsafeCard = () => null; export const unsafeUi = { Tile: () => null }; export const UnknownValue = undefined;\\n"
          runtime_replacement = 'export const Card = () => null; export const child = () => null; export const ui = { Tile: () => null }; export const UnsafeCard = () => null; export const unsafeUi = { Tile: () => null }; export const UnknownValue = undefined; export const currentText = () => "external";\\n'
          if test.count(runtime_marker) != 1:
              raise SystemExit(f'runtime marker count={test.count(runtime_marker)}')
          test = test.replace(runtime_marker, runtime_replacement, 1)

          helper_old = """async function compile(text: string) {
          \tconst root = await project();
          \tconst provider = new TypeScriptInteropProvider({ projectRoot: root });
          \ttry {
          \t\treturn compileSource({ id: 1, path: join(root, 'src/main.virune'), text }, { emit: false, platform: 'browser', jsInteropProvider: provider });
          \t} finally {
          \t\tprovider.dispose();
          \t}
          }"""
          helper_new = """async function compile(text: string, emit = false) {
          \tconst root = await project();
          \tconst provider = new TypeScriptInteropProvider({ projectRoot: root });
          \ttry {
          \t\treturn compileSource({ id: 1, path: join(root, 'src/main.virune'), text }, { emit, platform: 'browser', jsInteropProvider: provider });
          \t} finally {
          \t\tprovider.dispose();
          \t}
          }"""
          if test.count(helper_old) != 1:
              raise SystemExit(f'compile helper target count={test.count(helper_old)}')
          test = test.replace(helper_old, helper_new, 1)

          insert_before = "test('View conditionals preserve supported single-child branch value types', async () => {"
          regression = """test('provider-proven External string call results pass JSX proof while preserved emission keeps the real call', async () => {
          \tconst result = await compile(`import js { currentText } from \"./library.js\"
          
          component Page() uses JavaScript {
          \treturn view {
          \t\tpanel(tone: \"warm\") {
          \t\t\t{ currentText() }
          \t\t}
          \t}
          }
          `, true);
          \tassert.deepEqual(errors(result), []);
          \tassert.ok(result.output);
          \tassert.ok(result.output.code.includes('{currentText()}'));
          });
          
          """
          if test.count(insert_before) != 1:
              raise SystemExit(f'regression insertion target count={test.count(insert_before)}')
          test = test.replace(insert_before, regression + insert_before, 1)
          test_path.write_text(test)
          PY
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check
        run: npm run check
      - name: Run focused frontend JSX regression
        run: node --test packages/js-interop/dist/test/frontend-jsx-validation.test.js
      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/compiler/src/interop/jsx-view-validation.ts packages/js-interop/test/frontend-jsx-validation.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(frontend): validate External string View children"
          git push origin HEAD:fix/frontend-external-string-child
