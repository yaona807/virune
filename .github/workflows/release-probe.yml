name: Release publication probe

on:
  push:
    branches:
      - 'release-verification/v1.0.0-rc.1'
    paths:
      - '.github/release-probe-request.json'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Query public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0-rc.1" > /tmp/release.json 2> /tmp/release.err
          status=$?
          set -e
          STATUS="$status" node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          let release = null;
          try { release = JSON.parse(await readFile('/tmp/release.json', 'utf8')); } catch {}
          const error = await readFile('/tmp/release.err', 'utf8').catch(() => '');
          const result = {
            schemaVersion: 1,
            status: Number(process.env.STATUS),
            exists: release !== null,
            tag: release?.tag_name ?? 'v1.0.0-rc.1',
            prerelease: release?.prerelease ?? null,
            draft: release?.draft ?? null,
            htmlUrl: release?.html_url ?? null,
            assetCount: release?.assets?.length ?? 0,
            assets: release?.assets?.map(asset => ({ name: asset.name, size: asset.size, digest: asset.digest ?? null })) ?? [],
            error: error.trim() || null,
            checkedAt: new Date().toISOString(),
          };
          await writeFile('.github/release-probe-result.json', `${JSON.stringify(result, null, '\t')}\n`);
          NODE
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-probe-result.json
          git commit -m "release: record v1.0.0-rc.1 publication probe"
          git push origin HEAD
