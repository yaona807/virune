name: Patch 617 selfhost syntax

on:
  push:
    branches:
      - fix/616-block-lambda-newlines
    paths:
      - .github/workflows/patch-617-selfhost-syntax.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/616-block-lambda-newlines
      - name: Apply source patch
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python3
      - name: Remove temporary patch workflow
        run: git rm .github/workflows/patch-617-selfhost-syntax.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selfhost/mvp/src/frontend-lexer.virune
          git commit -m 'fix(parser): keep selfhost lambda scope scan syntax-valid'
          git push origin HEAD:fix/616-block-lambda-newlines
