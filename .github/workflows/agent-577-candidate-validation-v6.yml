name: Temporary #577 candidate validation v7

on:
  push:
    branches:
      - fix/577-contextual-external-callable

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
      - name: Apply reviewed candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/agent-577-candidate-source.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          source = workflow[start:end]
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in source.splitlines())

          old = '''old = "\\tassert.deepEqual(projection.descriptor.parameters, ['External']);"
          new = "\\tassert.equal(projection.descriptor.version, 'virune-callable-shim/v2');\\n\\tassert.deepEqual(projection.descriptor.parameters, ['External']);"
          if text.count(old) != 1:
              raise RuntimeError(f'expected one v2 projection assertion anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)'''
          new = '''test_name = "test('contextual async callback keeps concrete parameter and result External through generated shim'"
          block_start = text.index(test_name)
          block_end = text.index("\\n});", block_start)
          block = text[block_start:block_end]
          old = "\\tassert.deepEqual(projection.descriptor.parameters, ['External']);"
          replacement = "\\tassert.equal(projection.descriptor.version, 'virune-callable-shim/v2');\\n\\tassert.deepEqual(projection.descriptor.parameters, ['External']);"
          if block.count(old) != 1:
              raise RuntimeError(f'expected one positive v2 projection assertion anchor, found {block.count(old)}')
          block = block.replace(old, replacement, 1)
          text = text[:block_start] + block + text[block_end:]'''
          if source.count(old) != 1:
              raise RuntimeError(f'expected one v6 assertion rewrite block, found {source.count(old)}')
          source = source.replace(old, new, 1)
          exec(compile(source, '<candidate-577-v7>', 'exec'), {'Path': Path})
          PY
      - name: Build reviewed candidate
        run: npm run build
      - name: Run focused callback regressions
        run: node --test packages/js-interop/dist/test/contextual-external-callable.test.js packages/js-interop/dist/test/callable-boundary-ignored-arguments.test.js packages/js-interop/dist/test/callable-boundary-shim.test.js packages/js-interop/dist/test/callable-boundary-regressions.test.js
      - name: Type-check reviewed candidate
        run: npm run check
