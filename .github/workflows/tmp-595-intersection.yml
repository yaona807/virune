name: Temporary issue 595 intersection patch

on:
  push:
    branches: [fix/595-contextual-object-callback]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/595-contextual-object-callback
          fetch-depth: 0
      - name: Permit concrete contextual intersection parameters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/js-interop/src/index.ts')
          text = path.read_text()
          old = """\t\tconst flags = type.getFlags();
\t\tif ((flags & (ts.TypeFlags.Any | ts.TypeFlags.Unknown | ts.TypeFlags.Never | ts.TypeFlags.TypeParameter | ts.TypeFlags.Union | ts.TypeFlags.Intersection)) !== 0) return undefined;
\t\tconst typeExpression = renderContextualTypeExpression(type, checker, location);
"""
          new = """\t\tconst flags = type.getFlags();
\t\tconst unsafeFlags = ts.TypeFlags.Any | ts.TypeFlags.Unknown | ts.TypeFlags.Never | ts.TypeFlags.TypeParameter | ts.TypeFlags.Union;
\t\tif ((flags & unsafeFlags) !== 0) return undefined;
\t\tif ((flags & ts.TypeFlags.Intersection) !== 0 && (type as ts.IntersectionType).types.some(item => (item.getFlags() & unsafeFlags) !== 0)) return undefined;
\t\tconst typeExpression = renderContextualTypeExpression(type, checker, location);
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one contextual parameter safety anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-595-intersection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/js-interop/src/index.ts .github/workflows/tmp-595-intersection.yml
          git diff --cached --check
          git commit -m "fix(interop): preserve concrete intersection callback evidence"
          git push origin HEAD:fix/595-contextual-object-callback
