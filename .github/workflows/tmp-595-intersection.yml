name: Temporary issue 595 intersection patch

on:
  push:
    branches: [fix/595-contextual-object-callback]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/595-contextual-object-callback
          fetch-depth: 0
      - name: Apply concrete intersection parameter patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | python3
          rm .github/workflows/tmp-595-intersection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/js-interop/src/index.ts .github/workflows/tmp-595-intersection.yml
          git diff --cached --check
          git commit -m "fix(interop): preserve concrete intersection callback evidence"
          git push origin HEAD:fix/595-contextual-object-callback
