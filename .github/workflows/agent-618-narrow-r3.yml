name: Narrow #618 sync-or-promise proof r3

on:
  push:
    branches:
      - fix/618-generic-sync-promise-callback

permissions:
  contents: write

jobs:
  narrow-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/618-generic-sync-promise-callback
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Narrow proof to Unit-compatible sync-or-promise unions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path('packages/js-interop/src/index.ts')
          text = provider.read_text()
          old = '''function contextualCallbackResultForNativeCallable(type: ts.Type, checker: ts.TypeChecker, callable: NativeCallableTypeTemplate): ContextualCallableResult | undefined {
          \tif (!type.isUnion() || callable.async || callable.result !== 'Unit') return contextualCallbackResult(type, checker);
          \tfor (const branch of type.types) {
          \t\tconst result = contextualCallbackResult(branch, checker);
          \t\tif (result?.kind === 'void' || result?.kind === 'value' && result.value === 'undefined') return result;
          \t}
          \treturn contextualCallbackResult(type, checker);
          }'''
          new = '''function contextualCallbackResultForNativeCallable(type: ts.Type, checker: ts.TypeChecker, callable: NativeCallableTypeTemplate): ContextualCallableResult | undefined {
          \tif (!type.isUnion() || callable.async || callable.result !== 'Unit') return contextualCallbackResult(type, checker);
          \tlet synchronous: ContextualCallableResult | undefined;
          \tlet hasPromise = false;
          \tfor (const branch of type.types) {
          \t\tconst result = contextualCallbackResult(branch, checker);
          \t\tif (result?.kind === 'promise' && (result.value === 'undefined' || result.value === 'void')) {
          \t\t\thasPromise = true;
          \t\t\tcontinue;
          \t\t}
          \t\tif (result?.kind === 'void' || result?.kind === 'value' && result.value === 'undefined') {
          \t\t\tsynchronous ??= result;
          \t\t\tcontinue;
          \t\t}
          \t\treturn contextualCallbackResult(type, checker);
          \t}
          \treturn hasPromise && synchronous !== undefined ? synchronous : contextualCallbackResult(type, checker);
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one current helper, found {text.count(old)}')
          provider.write_text(text.replace(old, new, 1))

          test_file = Path('packages/js-interop/test/generic-sync-or-promise-callable.test.ts')
          tests = test_file.read_text()
          marker = '''test('promise-only generic callback still rejects a synchronous Unit boundary', async () => {'''
          if tests.count(marker) != 1:
              raise SystemExit('expected promise-only regression marker exactly once')
          addition = '''\n\ntest('non-promise mixed callback result remains fail closed for synchronous Unit', async () => {
          \tconst result = await compileFixture(
          \t\t`export declare function mixed(task: () => string | undefined): void;\n`,
          \t\t`import js { mixed } from "./library.js"\n\nfn main() -> Unit uses JavaScript {\n\tdiscard mixed(fn() -> Unit {\n\t\treturn Unit\n\t})\n\treturn Unit\n}\n`,
          \t);
          \tassert.ok(result.diagnostics.some(item => item.code === 'L4204'));
          \tassert.equal(result.semantic?.interop.callableProjections?.length ?? 0, 0);
          });'''
          if "non-promise mixed callback result remains fail closed" in tests:
              raise SystemExit('negative regression already exists')
          test_file.write_text(tests.rstrip() + addition + '\n')

          Path('.github/workflows/agent-618-narrow-r3.yml').unlink()
          PY
      - name: Bootstrap
        run: npm run bootstrap
      - name: Build
        run: npm run build
      - name: Focused regressions
        run: |
          node --test packages/js-interop/dist/test/generic-sync-or-promise-callable.test.js
          node --test packages/js-interop/dist/test/callable-boundary-regressions.test.js
          node --test packages/js-interop/dist/test/direct-adversarial-corpus.test.js
      - name: Validate final diff
        shell: bash
        run: |
          git diff --check
          git status --short
          test "$(git status --short | wc -l)" -eq 3
      - name: Commit narrowed change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/js-interop/src/index.ts packages/js-interop/test/generic-sync-or-promise-callable.test.ts .github/workflows/agent-618-narrow-r3.yml
          git commit -m "fix(interop): require mixed sync-or-promise Unit evidence"
          git push origin HEAD:fix/618-generic-sync-promise-callback
