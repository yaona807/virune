name: Fix self-host aggregate parser declarations

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'agent/selfhost-aggregate-call-ast' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/selfhost-aggregate-call-ast
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/fix-selfhost-aggregate-parser.mjs
      - name: Commit parser fix
        run: |
          rm scripts/fix-selfhost-aggregate-parser.mjs
          rm .github/workflows/fix-selfhost-aggregate-parser.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfhost/mvp/src/frontend-parser-core.virune \
            scripts/fix-selfhost-aggregate-parser.mjs \
            .github/workflows/fix-selfhost-aggregate-parser.yml
          git commit -m "fix(selfhost): repair aggregate parser declarations"
          git push origin HEAD:agent/selfhost-aggregate-call-ast
