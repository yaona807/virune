name: Frontend callable props branch edit v2

on:
  push:
    branches:
      - feat/frontend-view-callable-props
    paths:
      - .github/workflows/frontend-callable-props-branch-edit-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/frontend-view-callable-props
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Apply exact source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/frontend-callable-props-branch-edit.yml').read_text()
          marker = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if marker not in source:
              raise SystemExit('embedded edit script marker missing')
          body = source.split(marker, 1)[1].split(end, 1)[0]
          Path('/tmp/frontend-edit.py').write_text(textwrap.dedent(body))
          PY
          python /tmp/frontend-edit.py
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/js-interop/test/frontend-view-callable-props.test.ts')
          text = path.read_text()
          old = '''export const ExternalButton: (props: { onClick: () => void }) => JSX.Element;\n`, 'utf8');\n\tconst provider = new TypeScriptInteropProvider({ projectRoot: root });\n\ttry {\n\t\treturn compileSource({ id: 1, path: join(root, 'src/main.virune'), text }, { emit, platform: 'browser', jsInteropProvider: provider });'''
          new = '''export interface Marker { readonly marker: true; }\nexport const ExternalButton: (props: { onClick: () => void }) => JSX.Element;\n`, 'utf8');\n\tconst provider = new TypeScriptInteropProvider({ projectRoot: root });\n\ttry {\n\t\treturn compileSource({ id: 1, path: join(root, 'src/main.virune'), text: `import js type { Marker } from "./library.js"\\n${text}` }, { emit, platform: 'browser', jsInteropProvider: provider });'''
          if text.count(old) != 1:
              raise SystemExit(f'test fixture replacement target count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Focused validation
        run: |
          npm ci
          npm run build
          node --test packages/js-interop/dist/test/frontend-view-callable-props.test.js
      - name: Commit validated source change and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/frontend-callable-props-branch-edit.yml
          rm .github/workflows/frontend-callable-props-diagnostic.yml
          rm .github/workflows/frontend-callable-props-branch-edit-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(frontend): project native callable view props"
          git push origin HEAD:feat/frontend-view-callable-props
