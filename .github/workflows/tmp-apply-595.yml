name: Temporary issue 595 source patch

on:
  push:
    branches: [fix/595-contextual-object-callback]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/595-contextual-object-callback
          fetch-depth: 0
      - name: Apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- packages/compiler/src/checker/checker.ts packages/js-interop/src/index.ts
          printf '%s' '' | base64 -d | python3
          rm .github/workflows/tmp-apply-595.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/compiler/src/checker/checker.ts packages/js-interop/src/index.ts .github/workflows/tmp-apply-595.yml
          git diff --cached --check
          git commit -m "fix(interop): contextually type object-literal callbacks"
          git push origin HEAD:fix/595-contextual-object-callback
