name: Temporary #575 optional callback validation

on:
  push:
    branches:
      - fix/575-callback-ignored-args

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/575-callback-ignored-args
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact optional-callback normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/js-interop/src/index.ts')
          text = path.read_text()
          old = '''function contextualCallableSignature(type: ts.Type, checker: ts.TypeChecker): ts.Signature | undefined {
          \tconst flags = type.getFlags();
          \tif ((flags & (ts.TypeFlags.Any | ts.TypeFlags.Unknown | ts.TypeFlags.TypeParameter)) !== 0) return undefined;
          \tif (type.getConstructSignatures().length !== 0) return undefined;
          \tconst signatures = type.getCallSignatures();
          \tif (signatures.length !== 1) return undefined;
          \tconst requiredProperties = checker.getPropertiesOfType(type).filter(property => (property.flags & ts.SymbolFlags.Optional) === 0);
          '''.replace('          ', '')
          new = '''function contextualCallableSignature(type: ts.Type, checker: ts.TypeChecker): ts.Signature | undefined {
          \tlet callableType = type;
          \tif (type.isUnion()) {
          \t\tconst candidates = type.types.filter(item => (item.getFlags() & ts.TypeFlags.Undefined) === 0);
          \t\tif (candidates.length !== type.types.length) {
          \t\t\tif (candidates.length !== 1) return undefined;
          \t\t\tcallableType = candidates[0]!;
          \t\t}
          \t}
          \tconst flags = callableType.getFlags();
          \tif ((flags & (ts.TypeFlags.Any | ts.TypeFlags.Unknown | ts.TypeFlags.TypeParameter)) !== 0) return undefined;
          \tif (callableType.getConstructSignatures().length !== 0) return undefined;
          \tconst signatures = callableType.getCallSignatures();
          \tif (signatures.length !== 1) return undefined;
          \tconst requiredProperties = checker.getPropertiesOfType(callableType).filter(property => (property.flags & ts.SymbolFlags.Optional) === 0);
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact source snippet, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Run focused callback boundary regressions
        shell: bash
        run: |
          npm ci
          npm run build
          node --test --test-timeout=120000 \
            packages/js-interop/dist/test/callable-boundary-ignored-arguments.test.js \
            packages/js-interop/dist/test/callable-boundary-shim.test.js \
            packages/js-interop/dist/test/callable-boundary-generic.test.js \
            packages/js-interop/dist/test/callable-boundary-void.test.js
      - name: Commit final source and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-575-optional-callback.yml
          git add packages/js-interop/src/index.ts
          git diff --cached --check
          git commit -m 'fix(interop): normalize provided optional callback context'
          git push origin HEAD:fix/575-callback-ignored-args
