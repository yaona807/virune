name: Temporary js-yaml security lock refresh

on:
  push:
    branches:
      - fix/security-js-yaml-4-3-1

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh js-yaml lock entry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Refresh only js-yaml in the lockfile
        run: npm update js-yaml --package-lock-only --ignore-scripts
      - name: Validate the patched lock entry and scope
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const entry = lock.packages?.['node_modules/js-yaml'];
          if (entry?.version !== '4.3.1') {
            throw new Error(`Expected js-yaml 4.3.1, received ${entry?.version ?? 'missing'}`);
          }
          NODE
          changed="$(git diff --name-only)"
          if [ "$changed" != "package-lock.json" ]; then
            printf 'Unexpected npm update diff:\n%s\n' "$changed" >&2
            exit 1
          fi
          npm audit --audit-level=high
      - name: Commit the lock refresh and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/security-js-yaml-lock-refresh.yml
          git add package-lock.json
          git commit -m 'fix(deps): update js-yaml to 4.3.1'
          final_diff="$(git diff --name-only origin/main...HEAD)"
          if [ "$final_diff" != "package-lock.json" ]; then
            printf 'Unexpected final diff against main:\n%s\n' "$final_diff" >&2
            exit 1
          fi
          git push origin HEAD:fix/security-js-yaml-4-3-1
