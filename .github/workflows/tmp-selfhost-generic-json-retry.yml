name: Temporary self-host generic Json branch promotion

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/selfhost-try-rebuild-run-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply validated generic Json support to formal branch
        shell: bash
        run: |
          set -euo pipefail
          expected_main='27c445c37b5a306436088f4f64a569bf7fe5e6ad'
          expected_branch_head='27c445c37b5a306436088f4f64a569bf7fe5e6ad'
          branch='feat/selfhost-generic-json-type-arguments'
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git rev-parse origin/$branch)" = "$expected_branch_head"
          test "$(git rev-parse "$expected_main:selfhost/mvp/src/parser.virune")" = 'bfa9a235f80dc544516ccb6ad1c131e19e551ef4'
          test "$(git rev-parse "$expected_main:selfhost/mvp/src/checker.virune")" = '4a5b42c92aef87c864227ba11c6d93da7be8db37'
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          workflow = Path('.github/workflows/tmp-selfhost-try-rebuild.yml').read_text()
          match = re.search(r"python - <<'PY'\n(?P<body>.*?)\n          PY", workflow, re.DOTALL)
          if match is None:
              raise RuntimeError('validated transformation heredoc not found')
          Path('/tmp/generic-json-transform.py').write_text(textwrap.dedent(match.group('body')))
          PY
          git checkout -B "$branch" "origin/$branch"
          python /tmp/generic-json-transform.py
          python - <<'PY'
          from pathlib import Path
          path = Path('selfhost/mvp/src/checker.virune')
          source = path.read_text()
          old_start = 'fn sourceQualifiedName(expressionId: Int, context: CheckContext) -> Result<String?, MvpDiagnostic> {\n\tlet node = sourceExpressionAt(context, expressionId)?'
          new_start = 'fn sourceQualifiedName(expressionId: Int, context: CheckContext) -> Result<String?, MvpDiagnostic> {\n\tlet missing: String? = None\n\tlet node = sourceExpressionAt(context, expressionId)?'
          if source.count(old_start) != 1:
              raise RuntimeError(f'sourceQualifiedName start count is {source.count(old_start)}')
          source = source.replace(old_start, new_start, 1)
          if source.count('None => Ok(None)') != 1:
              raise RuntimeError(f'Ok(None) match-arm count is {source.count("None => Ok(None)")}')
          source = source.replace('None => Ok(None)', 'None => Ok(missing)', 1)
          if source.count('return Ok(None)') != 1:
              raise RuntimeError(f'return Ok(None) count is {source.count("return Ok(None)")}')
          source = source.replace('return Ok(None)', 'return Ok(missing)', 1)
          path.write_text(source)
          PY
          expected_paths="$(printf '%s\n' selfhost/mvp/src/checker.virune selfhost/mvp/src/parser.virune | sort)"
          actual_paths="$(git diff --name-only | sort)"
          test "$actual_paths" = "$expected_paths"
          git diff --check
          npm ci
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/parser.virune selfhost/mvp/src/checker.virune
          git commit -m 'feat(selfhost): support generic Json type arguments'
          git push --force-with-lease=refs/heads/$branch:"$expected_branch_head" origin HEAD:$branch
