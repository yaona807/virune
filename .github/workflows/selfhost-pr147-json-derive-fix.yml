name: Selfhost PR147 JSON derive fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/selfhost-pr147-json-derive-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfhost/closed-pattern-coverage
      - name: Add JSON derives to private request records
        shell: python
        run: |
          from pathlib import Path

          path = Path('selfhost/mvp/src/frontend-pattern-coverage.virune')
          content = path.read_text()
          replacements = [
              ('record FrontendPatternArm {', 'record FrontendPatternArm derives Eq, Debug, Json {'),
              ('record FrontendPatternCheck {', 'record FrontendPatternCheck derives Eq, Debug, Json {'),
              ('record FrontendPatternCoverageRequest {', 'record FrontendPatternCoverageRequest derives Eq, Debug, Json {'),
          ]
          for before, after in replacements:
              count = content.count(before)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {before!r}, found {count}')
              content = content.replace(before, after, 1)
          path.write_text(content)
          Path('.github/workflows/selfhost-pr147-json-derive-fix.yml').unlink()
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add selfhost/mvp/src/frontend-pattern-coverage.virune .github/workflows/selfhost-pr147-json-derive-fix.yml
          git commit -m "compiler(selfhost): derive JSON for pattern requests"
          git push origin HEAD:selfhost/closed-pattern-coverage
