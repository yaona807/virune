name: Temporary issue 595 repair runner

on:
  push:
    branches: [fix/595-contextual-object-callback]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/595-contextual-object-callback
          fetch-depth: 0
      - name: Repair and apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          workflow = Path('.github/workflows/tmp-apply-595.yml').read_text()
          lines = [line.strip() for line in workflow.splitlines() if "base64 -d | python3" in line]
          if len(lines) != 1:
              raise SystemExit(f'expected exactly one patch payload line, found {len(lines)}')
          prefix = "printf '%s' '"
          suffix = "' | base64 -d | python3"
          line = lines[0]
          if not line.startswith(prefix) or not line.endswith(suffix):
              raise SystemExit('unexpected issue 595 payload line shape')
          payload = base64.b64decode(line[len(prefix):-len(suffix)]).decode()
          old = "function nativePrimitiveCompatible(argument: Extract<InteropArgumentType, { kind: 'native-primitive' }>"
          new = "function nativePrimitiveCompatible(argument: Extract<InteropArgumentType, { readonly kind: 'native-primitive' }>"
          count = payload.count(old)
          print(f'provider helper signature repair: matches={count}')
          if count != 2:
              raise SystemExit(f'expected exactly two payload signature occurrences, found {count}')
          Path('/tmp/apply595.py').write_text(payload.replace(old, new))
          PY
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- packages/compiler/src/checker/checker.ts packages/js-interop/src/index.ts
          python3 /tmp/apply595.py
          rm -f .github/workflows/tmp-apply-595.yml .github/workflows/tmp-fix-595-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/compiler/src/checker/checker.ts packages/js-interop/src/index.ts .github/workflows/tmp-apply-595.yml .github/workflows/tmp-fix-595-runner.yml
          git diff --cached --check
          git commit -m "fix(interop): contextually type object-literal callbacks"
          git push origin HEAD:fix/595-contextual-object-callback
